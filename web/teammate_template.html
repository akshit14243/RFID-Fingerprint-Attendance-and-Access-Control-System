<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance — Admin Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#0b1220; --surface:#141c2f; --surface-2:#1a2438; --border:#26314a;
    --text:#e7ebf5; --text-dim:#8d97ad; --text-faint:#5c6680;
    --primary:#4c6fff; --primary-dim:#2a3d8f;
    --teal:#2dd4bf; --teal-bg:#0e2e2a;
    --amber:#f5a524; --amber-bg:#332208;
    --rose:#f5738a; --rose-bg:#331119;
    --radius:10px;
  }
  [data-theme="light"]{
    --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f8; --border:#dde3ef;
    --text:#1c2333; --text-dim:#5b6479; --text-faint:#98a1b5;
    --primary:#3454d1; --primary-dim:#dde5ff;
    --teal:#0f8f7a; --teal-bg:#e1f5f0;
    --amber:#b8710a; --amber-bg:#fdf1dd;
    --rose:#c23b57; --rose-bg:#fbe6ea;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  #root{min-height:100vh;}
  ::selection{background:var(--primary); color:#fff;}
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useMemo, useEffect} = React;

/* ---------------- Mock data ---------------- */
const DEPARTMENTS = ["Engineering","HR","Sales","Operations","Finance"];

const EMPLOYEES = [
  {id:"EMP001", name:"Varma", dept:"Engineering", role:"Software Engineer", email:"varma@company.com", phone:"+91 90000 00001", rfid:"RFID12345", fp:12, status:"active"},
  {id:"EMP002", name:"Ananya Rao", dept:"HR", role:"HR Executive", email:"ananya.rao@company.com", phone:"+91 90000 00002", rfid:"RFID12346", fp:13, status:"active"},
  {id:"EMP003", name:"Kiran Mehta", dept:"Sales", role:"Sales Lead", email:"kiran.mehta@company.com", phone:"+91 90000 00003", rfid:"RFID12347", fp:14, status:"active"},
  {id:"EMP004", name:"Divya Sharma", dept:"Engineering", role:"QA Engineer", email:"divya.sharma@company.com", phone:"+91 90000 00004", rfid:"RFID12348", fp:15, status:"active"},
  {id:"EMP005", name:"Rohan Iyer", dept:"Operations", role:"Ops Analyst", email:"rohan.iyer@company.com", phone:"+91 90000 00005", rfid:"RFID12349", fp:null, status:"active"},
  {id:"EMP006", name:"Sneha Pillai", dept:"Finance", role:"Accountant", email:"sneha.pillai@company.com", phone:"+91 90000 00006", rfid:null, fp:null, status:"inactive"},
];

const ATTENDANCE = [
  {emp:"EMP001", name:"Varma", dept:"Engineering", date:"2026-09-04", in:"09:04", out:"18:12", hrs:"9.1", status:"present", method:"RFID + Fingerprint"},
  {emp:"EMP002", name:"Ananya Rao", dept:"HR", date:"2026-09-04", in:"09:41", out:"18:05", hrs:"8.4", status:"late", method:"RFID + Fingerprint"},
  {emp:"EMP003", name:"Kiran Mehta", dept:"Sales", date:"2026-09-04", in:"08:57", out:null, hrs:"—", status:"present", method:"RFID + Fingerprint"},
  {emp:"EMP004", name:"Divya Sharma", dept:"Engineering", date:"2026-09-04", in:null, out:null, hrs:"—", status:"absent", method:"—"},
  {emp:"EMP005", name:"Rohan Iyer", dept:"Operations", date:"2026-09-04", in:"09:12", out:"17:50", hrs:"8.6", status:"present", method:"RFID only"},
  {emp:"EMP001", name:"Varma", dept:"Engineering", date:"2026-09-03", in:"09:02", out:"18:20", hrs:"9.3", status:"present", method:"RFID + Fingerprint"},
  {emp:"EMP002", name:"Ananya Rao", dept:"HR", date:"2026-09-03", in:"09:08", out:"18:00", hrs:"8.9", status:"present", method:"RFID + Fingerprint"},
];

const ACTIVITY = [
  {time:"09:41:12", name:"Ananya Rao", id:"EMP002", event:"Check-in", status:"late"},
  {time:"09:12:03", name:"Rohan Iyer", id:"EMP005", event:"Check-in", status:"present"},
  {time:"09:04:51", name:"Varma", id:"EMP001", event:"Check-in", status:"present"},
  {time:"08:57:44", name:"Kiran Mehta", id:"EMP003", event:"Check-in", status:"present"},
];

const DEVICES = [
  {id:"ESP32_01", location:"Main Entrance", ip:"192.168.1.42", online:true, lastSeen:"12 sec ago", rfid:"ok", fp:"ok", events:284},
  {id:"ESP32_02", location:"West Wing Gate", ip:"192.168.1.58", online:true, lastSeen:"41 sec ago", rfid:"ok", fp:"ok", events:191},
  {id:"ESP32_03", location:"Parking Entry", ip:"192.168.1.71", online:false, lastSeen:"2 hr 14 min ago", rfid:"error", fp:"unknown", events:57},
];

const NAV = [
  {key:"dashboard", label:"Dashboard", icon:"grid"},
  {key:"employees", label:"Employees", icon:"users"},
  {key:"attendance", label:"Attendance", icon:"clock"},
  {key:"devices", label:"Devices", icon:"cpu"},
  {key:"admin", label:"Admin panel", icon:"settings"},
];

/* ---------------- Tiny inline icon set ---------------- */
function Icon({name, size=18}){
  const p = {width:size, height:size, viewBox:"0 0 24 24", fill:"none", stroke:"currentColor", strokeWidth:1.8, strokeLinecap:"round", strokeLinejoin:"round"};
  switch(name){
    case "grid": return <svg {...p}><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>;
    case "users": return <svg {...p}><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M21 20c0-2.6-1.7-4.8-4-5.6"/></svg>;
    case "clock": return <svg {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>;
    case "cpu": return <svg {...p}><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>;
    case "settings": return <svg {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9c.2.6.7 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>;
    case "sun": return <svg {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>;
    case "moon": return <svg {...p}><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>;
    case "search": return <svg {...p}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>;
    case "plus": return <svg {...p}><path d="M12 5v14M5 12h14"/></svg>;
    case "download": return <svg {...p}><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>;
    case "id": return <svg {...p}><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="12" r="2"/><path d="M14 10h5M14 14h5"/></svg>;
    case "check": return <svg {...p}><path d="M20 6L9 17l-5-5"/></svg>;
    case "x": return <svg {...p}><path d="M18 6L6 18M6 6l12 12"/></svg>;
    case "logout": return <svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>;
    case "chevron": return <svg {...p}><path d="M9 18l6-6-6-6"/></svg>;
    default: return null;
  }
}

/* ---------------- Small building blocks ---------------- */
function StatusBadge({status}){
  const map = {
    present:{c:"var(--teal)", bg:"var(--teal-bg)", label:"Present"},
    late:{c:"var(--amber)", bg:"var(--amber-bg)", label:"Late"},
    absent:{c:"var(--rose)", bg:"var(--rose-bg)", label:"Absent"},
    active:{c:"var(--teal)", bg:"var(--teal-bg)", label:"Active"},
    inactive:{c:"var(--text-faint)", bg:"var(--surface-2)", label:"Inactive"},
    online:{c:"var(--teal)", bg:"var(--teal-bg)", label:"Online"},
    offline:{c:"var(--rose)", bg:"var(--rose-bg)", label:"Offline"},
  };
  const s = map[status] || map.inactive;
  return (
    <span style={{
      display:"inline-flex", alignItems:"center", gap:6, fontSize:12, fontWeight:600,
      color:s.c, background:s.bg, padding:"3px 10px", borderRadius:999,
    }}>
      <span style={{width:6, height:6, borderRadius:99, background:s.c}}/>
      {s.label}
    </span>
  );
}

function Card({children, style}){
  return (
    <div style={{
      background:"var(--surface)", border:"1px solid var(--border)", borderRadius:"var(--radius)",
      padding:"18px 20px", ...style
    }}>{children}</div>
  );
}

function StatCard({label, value, sub, accent}){
  return (
    <Card>
      <div style={{fontSize:12.5, color:"var(--text-dim)", fontWeight:500, marginBottom:10}}>{label}</div>
      <div style={{fontSize:28, fontWeight:700, color: accent || "var(--text)", lineHeight:1}}>{value}</div>
      {sub && <div style={{fontSize:12, color:"var(--text-faint)", marginTop:8}}>{sub}</div>}
    </Card>
  );
}

function Button({children, variant="ghost", onClick, style}){
  const base = {
    padding:"9px 14px", borderRadius:8, fontSize:13.5, fontWeight:600, cursor:"pointer",
    display:"inline-flex", alignItems:"center", gap:7, border:"1px solid var(--border)",
    transition:"background .12s ease", ...style
  };
  const variants = {
    primary:{background:"var(--primary)", color:"#fff", border:"1px solid var(--primary)"},
    ghost:{background:"transparent", color:"var(--text)"},
    subtle:{background:"var(--surface-2)", color:"var(--text)"},
  };
  return <button onClick={onClick} style={{...base, ...variants[variant]}}>{children}</button>;
}

function Th({children}){
  return <th style={{textAlign:"left", padding:"10px 14px", fontSize:11.5, textTransform:"uppercase", letterSpacing:"0.04em", color:"var(--text-faint)", fontWeight:600, borderBottom:"1px solid var(--border)"}}>{children}</th>;
}
function Td({children, mono}){
  return <td className={mono?"mono":""} style={{padding:"11px 14px", fontSize:13.5, borderBottom:"1px solid var(--border)", color:"var(--text)"}}>{children}</td>;
}

/* ---------------- Pages ---------------- */
function DashboardPage(){
  const total = EMPLOYEES.length;
  const present = ATTENDANCE.filter(a=>a.date==="2026-09-04" && a.status==="present").length;
  const late = ATTENDANCE.filter(a=>a.date==="2026-09-04" && a.status==="late").length;
  const absent = ATTENDANCE.filter(a=>a.date==="2026-09-04" && a.status==="absent").length;
  const active = ATTENDANCE.filter(a=>a.date==="2026-09-04" && a.in && !a.out).length;
  const pct = Math.round(((present+late)/total)*100);

  return (
    <div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(150px,1fr))", gap:14, marginBottom:22}}>
        <StatCard label="Total employees" value={total} />
        <StatCard label="Present today" value={present} accent="var(--teal)" />
        <StatCard label="Late today" value={late} accent="var(--amber)" />
        <StatCard label="Absent today" value={absent} accent="var(--rose)" />
        <StatCard label="Currently active" value={active} sub="checked in, not out" />
        <StatCard label="Attendance rate" value={pct+"%"} accent="var(--primary)" />
      </div>

      <div style={{display:"grid", gridTemplateColumns:"1.4fr 1fr", gap:16}}>
        <Card>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
            <div style={{fontSize:14.5, fontWeight:600}}>Today's attendance</div>
            <span className="mono" style={{fontSize:12, color:"var(--text-faint)"}}>04 Sep 2026</span>
          </div>
          <div style={{overflowX:"auto"}}>
            <table style={{width:"100%", borderCollapse:"collapse"}}>
              <thead><tr>
                <Th>Employee</Th><Th>Department</Th><Th>Check-in</Th><Th>Check-out</Th><Th>Status</Th>
              </tr></thead>
              <tbody>
                {ATTENDANCE.filter(a=>a.date==="2026-09-04").map((a,i)=>(
                  <tr key={i}>
                    <Td>{a.name}</Td>
                    <Td>{a.dept}</Td>
                    <Td mono>{a.in || "—"}</Td>
                    <Td mono>{a.out || "—"}</Td>
                    <Td><StatusBadge status={a.status}/></Td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Card>

        <Card>
          <div style={{fontSize:14.5, fontWeight:600, marginBottom:14}}>Live scan activity</div>
          <div style={{display:"flex", flexDirection:"column", gap:0}}>
            {ACTIVITY.map((a,i)=>(
              <div key={i} style={{
                display:"flex", alignItems:"center", gap:12, padding:"10px 0",
                borderBottom: i<ACTIVITY.length-1 ? "1px solid var(--border)" : "none"
              }}>
                <div style={{
                  width:34, height:34, borderRadius:8, background:"var(--surface-2)",
                  display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0
                }}><Icon name="id" size={16}/></div>
                <div style={{flex:1, minWidth:0}}>
                  <div style={{fontSize:13, fontWeight:600}}>{a.name} <span className="mono" style={{color:"var(--text-faint)", fontWeight:400}}>· {a.id}</span></div>
                  <div style={{fontSize:12, color:"var(--text-dim)"}}>{a.event}</div>
                </div>
                <div style={{textAlign:"right"}}>
                  <div className="mono" style={{fontSize:11.5, color:"var(--text-faint)"}}>{a.time}</div>
                  <StatusBadge status={a.status}/>
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>
    </div>
  );
}

function EmployeesPage({onSelect}){
  const [q, setQ] = useState("");
  const [dept, setDept] = useState("all");
  const filtered = EMPLOYEES.filter(e=>
    (dept==="all" || e.dept===dept) &&
    (e.name.toLowerCase().includes(q.toLowerCase()) || e.id.toLowerCase().includes(q.toLowerCase()))
  );
  return (
    <Card style={{padding:0}}>
      <div style={{display:"flex", gap:10, alignItems:"center", padding:"16px 18px", borderBottom:"1px solid var(--border)", flexWrap:"wrap"}}>
        <div style={{position:"relative", flex:"1 1 220px"}}>
          <span style={{position:"absolute", left:10, top:9, color:"var(--text-faint)"}}><Icon name="search" size={16}/></span>
          <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search by name or ID"
            style={{width:"100%", padding:"9px 12px 9px 34px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}/>
        </div>
        <select value={dept} onChange={e=>setDept(e.target.value)}
          style={{padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}>
          <option value="all">All departments</option>
          {DEPARTMENTS.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
        <Button variant="primary"><Icon name="plus" size={15}/>Add employee</Button>
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%", borderCollapse:"collapse"}}>
          <thead><tr>
            <Th>ID</Th><Th>Name</Th><Th>Department</Th><Th>Designation</Th><Th>RFID</Th><Th>Fingerprint</Th><Th>Status</Th><Th></Th>
          </tr></thead>
          <tbody>
            {filtered.map(e=>(
              <tr key={e.id} style={{cursor:"pointer"}} onClick={()=>onSelect(e)}>
                <Td mono>{e.id}</Td>
                <Td>{e.name}</Td>
                <Td>{e.dept}</Td>
                <Td>{e.role}</Td>
                <Td>{e.rfid ? <span className="mono" style={{color:"var(--teal)"}}>linked</span> : <span style={{color:"var(--text-faint)"}}>not linked</span>}</Td>
                <Td>{e.fp!=null ? <span className="mono" style={{color:"var(--teal)"}}>slot {e.fp}</span> : <span style={{color:"var(--text-faint)"}}>not linked</span>}</Td>
                <Td><StatusBadge status={e.status}/></Td>
                <Td><Icon name="chevron" size={15}/></Td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </Card>
  );
}

function EmployeeProfile({emp, onBack}){
  const history = ATTENDANCE.filter(a=>a.emp===emp.id);
  const presentDays = history.filter(a=>a.status==="present").length;
  const pct = history.length ? Math.round((presentDays/history.length)*100) : 0;
  return (
    <div>
      <Button variant="ghost" onClick={onBack} style={{marginBottom:14}}>
        <span style={{transform:"rotate(180deg)", display:"inline-flex"}}><Icon name="chevron" size={15}/></span> Back to employees
      </Button>
      <div style={{display:"grid", gridTemplateColumns:"1fr 1.6fr", gap:16}}>
        <Card>
          <div style={{display:"flex", alignItems:"center", gap:12, marginBottom:16}}>
            <div style={{width:48, height:48, borderRadius:"50%", background:"var(--primary-dim)", display:"flex", alignItems:"center", justifyContent:"center", fontWeight:700, color:"var(--primary)"}}>
              {emp.name.split(" ").map(n=>n[0]).join("")}
            </div>
            <div>
              <div style={{fontWeight:700, fontSize:15.5}}>{emp.name}</div>
              <div style={{fontSize:12.5, color:"var(--text-dim)"}}>{emp.role} · {emp.dept}</div>
            </div>
          </div>
          <div style={{display:"flex", flexDirection:"column", gap:9, fontSize:13}}>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>Employee ID</span><span className="mono">{emp.id}</span></div>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>Email</span><span>{emp.email}</span></div>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>Phone</span><span className="mono">{emp.phone}</span></div>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>RFID</span>{emp.rfid ? <span className="mono">{emp.rfid}</span> : <StatusBadge status="inactive"/>}</div>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>Fingerprint</span>{emp.fp!=null ? <span className="mono">slot {emp.fp}</span> : <StatusBadge status="inactive"/>}</div>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>Status</span><StatusBadge status={emp.status}/></div>
          </div>
        </Card>
        <div style={{display:"flex", flexDirection:"column", gap:16}}>
          <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:14}}>
            <StatCard label="Attendance %" value={pct+"%"} accent="var(--primary)"/>
            <StatCard label="Present days" value={presentDays}/>
            <StatCard label="Total hours" value={history.reduce((s,a)=>s+(parseFloat(a.hrs)||0),0).toFixed(1)}/>
          </div>
          <Card>
            <div style={{fontSize:14.5, fontWeight:600, marginBottom:12}}>Attendance history</div>
            <table style={{width:"100%", borderCollapse:"collapse"}}>
              <thead><tr><Th>Date</Th><Th>Check-in</Th><Th>Check-out</Th><Th>Hours</Th><Th>Status</Th></tr></thead>
              <tbody>
                {history.map((a,i)=>(
                  <tr key={i}>
                    <Td mono>{a.date}</Td><Td mono>{a.in||"—"}</Td><Td mono>{a.out||"—"}</Td><Td mono>{a.hrs}</Td>
                    <Td><StatusBadge status={a.status}/></Td>
                  </tr>
                ))}
              </tbody>
            </table>
          </Card>
        </div>
      </div>
    </div>
  );
}

function AttendancePage(){
  const [status, setStatus] = useState("all");
  const [dept, setDept] = useState("all");
  const rows = ATTENDANCE.filter(a=>(status==="all"||a.status===status) && (dept==="all"||a.dept===dept));
  return (
    <Card style={{padding:0}}>
      <div style={{display:"flex", gap:10, alignItems:"center", padding:"16px 18px", borderBottom:"1px solid var(--border)", flexWrap:"wrap"}}>
        <select value={dept} onChange={e=>setDept(e.target.value)} style={{padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}>
          <option value="all">All departments</option>
          {DEPARTMENTS.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
        <select value={status} onChange={e=>setStatus(e.target.value)} style={{padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}>
          <option value="all">All statuses</option>
          <option value="present">Present</option>
          <option value="late">Late</option>
          <option value="absent">Absent</option>
        </select>
        <input type="date" defaultValue="2026-09-04" style={{padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}/>
        <div style={{flex:1}}/>
        <Button variant="subtle"><Icon name="download" size={15}/>Export</Button>
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%", borderCollapse:"collapse"}}>
          <thead><tr>
            <Th>Employee ID</Th><Th>Name</Th><Th>Department</Th><Th>Date</Th><Th>Check-in</Th><Th>Check-out</Th><Th>Hours</Th><Th>Status</Th><Th>Method</Th>
          </tr></thead>
          <tbody>
            {rows.map((a,i)=>(
              <tr key={i}>
                <Td mono>{a.emp}</Td><Td>{a.name}</Td><Td>{a.dept}</Td><Td mono>{a.date}</Td>
                <Td mono>{a.in||"—"}</Td><Td mono>{a.out||"—"}</Td><Td mono>{a.hrs}</Td>
                <Td><StatusBadge status={a.status}/></Td>
                <Td style={{fontSize:12.5, color:"var(--text-dim)"}}>{a.method}</Td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 18px", fontSize:12.5, color:"var(--text-faint)"}}>
        <span>Showing {rows.length} of {ATTENDANCE.length} records</span>
        <div style={{display:"flex", gap:6}}>
          <Button variant="subtle" style={{padding:"5px 10px"}}>Prev</Button>
          <Button variant="subtle" style={{padding:"5px 10px"}}>Next</Button>
        </div>
      </div>
    </Card>
  );
}

function DevicesPage(){
  return (
    <div style={{display:"grid", gridTemplateColumns:"repeat(auto-fit, minmax(280px,1fr))", gap:16}}>
      {DEVICES.map(d=>(
        <Card key={d.id}>
          <div style={{display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:14}}>
            <div>
              <div className="mono" style={{fontSize:13.5, fontWeight:700}}>{d.id}</div>
              <div style={{fontSize:12.5, color:"var(--text-dim)"}}>{d.location}</div>
            </div>
            <StatusBadge status={d.online?"online":"offline"}/>
          </div>
          <div style={{display:"flex", flexDirection:"column", gap:8, fontSize:13}}>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>IP address</span><span className="mono">{d.ip}</span></div>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>Last seen</span><span>{d.lastSeen}</span></div>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>RFID reader</span><span style={{color: d.rfid==="ok"?"var(--teal)":"var(--rose)"}}>{d.rfid}</span></div>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>Fingerprint sensor</span><span style={{color: d.fp==="ok"?"var(--teal)":"var(--rose)"}}>{d.fp}</span></div>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>Events received</span><span className="mono">{d.events}</span></div>
          </div>
        </Card>
      ))}
    </div>
  );
}

function AdminPage(){
  const [tab, setTab] = useState("departments");
  const tabs = [
    {key:"departments", label:"Departments"},
    {key:"hours", label:"Working hours"},
    {key:"rules", label:"Late-entry rules"},
    {key:"holidays", label:"Holidays"},
  ];
  return (
    <Card style={{padding:0}}>
      <div style={{display:"flex", borderBottom:"1px solid var(--border)"}}>
        {tabs.map(t=>(
          <button key={t.key} onClick={()=>setTab(t.key)} style={{
            padding:"13px 18px", background:"none", border:"none", cursor:"pointer",
            fontSize:13.5, fontWeight:600, color: tab===t.key?"var(--primary)":"var(--text-dim)",
            borderBottom: tab===t.key ? "2px solid var(--primary)" : "2px solid transparent"
          }}>{t.label}</button>
        ))}
      </div>
      <div style={{padding:20}}>
        {tab==="departments" && (
          <div style={{display:"flex", flexDirection:"column", gap:8}}>
            {DEPARTMENTS.map(d=>(
              <div key={d} style={{display:"flex", justifyContent:"space-between", padding:"10px 14px", background:"var(--surface-2)", borderRadius:8, fontSize:13.5}}>
                <span>{d}</span>
                <span className="mono" style={{color:"var(--text-faint)"}}>{EMPLOYEES.filter(e=>e.dept===d).length} employees</span>
              </div>
            ))}
          </div>
        )}
        {tab==="hours" && (
          <div style={{display:"flex", gap:24, fontSize:13.5}}>
            <div><div style={{color:"var(--text-dim)", marginBottom:6}}>Work start</div><div className="mono" style={{fontSize:18, fontWeight:700}}>09:30</div></div>
            <div><div style={{color:"var(--text-dim)", marginBottom:6}}>Work end</div><div className="mono" style={{fontSize:18, fontWeight:700}}>18:30</div></div>
            <div><div style={{color:"var(--text-dim)", marginBottom:6}}>Grace period</div><div className="mono" style={{fontSize:18, fontWeight:700}}>15 min</div></div>
          </div>
        )}
        {tab==="rules" && (
          <div style={{fontSize:13.5, color:"var(--text-dim)"}}>Check-in after 09:45 is marked <b style={{color:"var(--amber)"}}>late</b>. No scan by end of day is marked <b style={{color:"var(--rose)"}}>absent</b>, excluding configured holidays.</div>
        )}
        {tab==="holidays" && (
          <div style={{display:"flex", flexDirection:"column", gap:8, fontSize:13.5}}>
            <div style={{display:"flex", justifyContent:"space-between", padding:"10px 14px", background:"var(--surface-2)", borderRadius:8}}><span>Gandhi Jayanti</span><span className="mono" style={{color:"var(--text-faint)"}}>02 Oct 2026</span></div>
            <div style={{display:"flex", justifyContent:"space-between", padding:"10px 14px", background:"var(--surface-2)", borderRadius:8}}><span>Diwali</span><span className="mono" style={{color:"var(--text-faint)"}}>08 Nov 2026</span></div>
          </div>
        )}
      </div>
    </Card>
  );
}

function LoginPage({onLogin}){
  const [u, setU] = useState("");
  const [p, setP] = useState("");
  const [err, setErr] = useState("");
  const submit = (e)=>{
    e.preventDefault();
    if(!u.trim() || !p.trim()){ setErr("Enter both username and password."); return; }
    setErr("");
    onLogin();
  };
  return (
    <div style={{minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"var(--bg)"}}>
      <form onSubmit={submit} style={{width:340, background:"var(--surface)", border:"1px solid var(--border)", borderRadius:14, padding:"32px 28px"}}>
        <div style={{width:40, height:40, borderRadius:10, background:"var(--primary)", display:"flex", alignItems:"center", justifyContent:"center", marginBottom:18}}>
          <Icon name="id" size={20}/>
        </div>
        <div style={{fontSize:19, fontWeight:700, marginBottom:4}}>Attendance console</div>
        <div style={{fontSize:13, color:"var(--text-dim)", marginBottom:22}}>Sign in to manage employees and attendance.</div>
        <div style={{display:"flex", flexDirection:"column", gap:12}}>
          <input value={u} onChange={e=>setU(e.target.value)} placeholder="Username" style={{padding:"10px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}/>
          <input value={p} onChange={e=>setP(e.target.value)} type="password" placeholder="Password" style={{padding:"10px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}/>
        </div>
        {err && <div style={{color:"var(--rose)", fontSize:12.5, marginTop:10}}>{err}</div>}
        <Button variant="primary" style={{width:"100%", justifyContent:"center", marginTop:18}}>Sign in</Button>
        <div style={{fontSize:11.5, color:"var(--text-faint)", marginTop:14, textAlign:"center"}}>Demo — any username and password signs in</div>
      </form>
    </div>
  );
}

/* ---------------- Shell ---------------- */
function Shell(){
  const [authed, setAuthed] = useState(false);
  const [page, setPage] = useState("dashboard");
  const [theme, setTheme] = useState("dark");
  const [selectedEmp, setSelectedEmp] = useState(null);
  const [now, setNow] = useState(new Date("2026-09-04T09:41:00"));

  useEffect(()=>{
    const t = setInterval(()=> setNow(n => new Date(n.getTime()+1000)), 1000);
    return ()=>clearInterval(t);
  },[]);

  if(!authed) return <LoginPage onLogin={()=>setAuthed(true)} />;

  const pageTitle = NAV.find(n=>n.key===page)?.label || "";

  return (
    <div data-theme={theme} style={{display:"flex", minHeight:"100vh", background:"var(--bg)", color:"var(--text)"}}>
      <aside style={{width:220, borderRight:"1px solid var(--border)", padding:"20px 14px", display:"flex", flexDirection:"column"}}>
        <div style={{display:"flex", alignItems:"center", gap:9, padding:"0 8px", marginBottom:26}}>
          <div style={{width:28, height:28, borderRadius:7, background:"var(--primary)", display:"flex", alignItems:"center", justifyContent:"center"}}>
            <Icon name="id" size={15}/>
          </div>
          <span style={{fontWeight:700, fontSize:14.5}}>Attendance</span>
        </div>
        <nav style={{display:"flex", flexDirection:"column", gap:2}}>
          {NAV.map(n=>(
            <button key={n.key} onClick={()=>{setPage(n.key); setSelectedEmp(null);}} style={{
              display:"flex", alignItems:"center", gap:10, padding:"9px 10px", borderRadius:8,
              border:"none", cursor:"pointer", textAlign:"left", fontSize:13.5, fontWeight:500,
              background: page===n.key ? "var(--primary-dim)" : "transparent",
              color: page===n.key ? "var(--primary)" : "var(--text-dim)"
            }}>
              <Icon name={n.icon} size={17}/>{n.label}
            </button>
          ))}
        </nav>
        <div style={{flex:1}}/>
        <button onClick={()=>setAuthed(false)} style={{
          display:"flex", alignItems:"center", gap:10, padding:"9px 10px", borderRadius:8,
          border:"none", cursor:"pointer", background:"transparent", color:"var(--text-faint)", fontSize:13
        }}><Icon name="logout" size={16}/>Sign out</button>
      </aside>

      <main style={{flex:1, display:"flex", flexDirection:"column", minWidth:0}}>
        <header style={{
          display:"flex", alignItems:"center", justifyContent:"space-between",
          padding:"14px 24px", borderBottom:"1px solid var(--border)"
        }}>
          <div>
            <div style={{fontSize:16.5, fontWeight:700}}>{selectedEmp ? selectedEmp.name : pageTitle}</div>
            <div className="mono" style={{fontSize:12, color:"var(--text-faint)"}}>
              {now.toLocaleDateString(undefined,{weekday:"long", year:"numeric", month:"long", day:"numeric"})} · {now.toLocaleTimeString()}
            </div>
          </div>
          <div style={{display:"flex", alignItems:"center", gap:10}}>
            <button onClick={()=>setTheme(t=>t==="dark"?"light":"dark")} style={{
              width:34, height:34, borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)",
              display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", color:"var(--text)"
            }}><Icon name={theme==="dark"?"sun":"moon"} size={16}/></button>
            <div style={{width:32, height:32, borderRadius:"50%", background:"var(--primary-dim)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:700, color:"var(--primary)"}}>AD</div>
          </div>
        </header>

        <div style={{padding:24, flex:1, overflow:"auto"}}>
          {page==="dashboard" && <DashboardPage/>}
          {page==="employees" && !selectedEmp && <EmployeesPage onSelect={setSelectedEmp}/>}
          {page==="employees" && selectedEmp && <EmployeeProfile emp={selectedEmp} onBack={()=>setSelectedEmp(null)}/>}
          {page==="attendance" && <AttendancePage/>}
          {page==="devices" && <DevicesPage/>}
          {page==="admin" && <AdminPage/>}
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Shell/>);
</script>
</body>
</html>
