  const submit = async (e) => {
    e.preventDefault();
    if (!date || !name.trim()) { setErr("Date and Holiday Name are required"); return; }
    setLoading(true);
    setErr("");
    try {
      await onSave({
        holiday_date: date,
        holiday_name: name.trim(),
        description: desc.trim() || null
      });
      onClose();
    } catch(err) {
      setErr(err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal-box">
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18}}>
          <div style={{fontSize:16, fontWeight:700}}>Add Company Holiday</div>
          <button onClick={onClose} style={{background:"none", border:"none", cursor:"pointer", color:"var(--text-dim)"}}><Icon name="x" size={18}/></button>
        </div>
        {err && <div style={{color:"var(--rose)", fontSize:12.5, marginBottom:12}}>{err}</div>}
        <form onSubmit={submit} style={{display:"flex", flexDirection:"column", gap:12}}>
          <div>
            <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Holiday Date</label>
            <input required type="date" value={date} onChange={e=>setDate(e.target.value)}
              style={{width:"100%", padding:"8px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}} />
          </div>
          <div>
            <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Holiday Name</label>
            <input required placeholder="New Year's Day" value={name} onChange={e=>setName(e.target.value)}
              style={{width:"100%", padding:"8px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}} />
          </div>
          <div>
            <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Description (optional)</label>
            <input placeholder="National holiday" value={desc} onChange={e=>setDesc(e.target.value)}
              style={{width:"100%", padding:"8px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}} />
          </div>
          <div style={{display:"flex", justifyContent:"flex-end", gap:8, marginTop:8}}>
            <Button variant="ghost" onClick={onClose} disabled={loading}>Cancel</Button>
            <Button variant="primary" type="submit" disabled={loading}>{loading ? "Saving..." : "Add Holiday"}</Button>
          </div>
        </form>
      </div>
    </div>
  );
}

function LoginPage({onLogin}){
  const [u, setU] = useState("admin@example.com");
  const [p, setP] = useState("admin123");
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);

  const submit = async (e)=>{
    e.preventDefault();
    if(!u.trim() || !p.trim()){ setErr("Enter both email and password."); return; }
    setLoading(true);
    setErr("");
    try {
      const email = u.includes("@") ? u : u + "@example.com";
      const data = await apiCall("/api/auth/login", "POST", { email, password: p });
      sessionStorage.setItem("token", data.token);
      sessionStorage.setItem("role", data.user?.role || "admin");
      sessionStorage.setItem("userName", data.user?.email || "Admin");
      onLogin(data.token);
    } catch(err) {
      setErr("Login failed: " + err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div style={{minHeight:"100vh", display:"flex", alignItems:"center", justifyContent:"center", background:"var(--bg)"}}>
      <form onSubmit={submit} style={{width:360, background:"var(--surface)", border:"1px solid var(--border)", borderRadius:14, padding:"32px 28px"}}>
        <div style={{width:40, height:40, borderRadius:10, background:"var(--primary)", display:"flex", alignItems:"center", justifyContent:"center", marginBottom:18}}>
          <Icon name="id" size={20}/>
        </div>
        <div style={{fontSize:19, fontWeight:700, marginBottom:4}}>Attendance console</div>
        <div style={{fontSize:13, color:"var(--text-dim)", marginBottom:22}}>Sign in to manage employees, access control, and live attendance.</div>
        <div style={{display:"flex", flexDirection:"column", gap:12}}>
          <input value={u} onChange={e=>setU(e.target.value)} placeholder="Email or Username" style={{padding:"10px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}/>
          <input value={p} onChange={e=>setP(e.target.value)} type="password" placeholder="Password" style={{padding:"10px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}/>
        </div>
        {err && <div style={{color:"var(--rose)", fontSize:12.5, marginTop:10}}>{err}</div>}
        <Button variant="primary" type="submit" disabled={loading} style={{width:"100%", justifyContent:"center", marginTop:18}}>
          {loading ? "Signing in..." : "Sign in"}
        </Button>
        <div style={{fontSize:11.5, color:"var(--text-faint)", marginTop:14, textAlign:"center"}}>
          Default: <span className="mono">admin@example.com</span> &middot; <span className="mono">admin123</span>
        </div>
      </form>
    </div>
  );
}

function Shell(){
  const [token, setToken] = useState(sessionStorage.getItem("token") || "");
  const [page, setPage] = useState("dashboard");
  const [theme, setTheme] = useState(() => localStorage.getItem("theme") || "light");
  const [selectedEmp, setSelectedEmp] = useState(null);
  const [now, setNow] = useState(new Date());
  const [isAddModalOpen, setIsAddModalOpen] = useState(false);
  const [isDeleteUnlocked, setIsDeleteUnlocked] = useState(false);
  const [deletePassword, setDeletePassword] = useState("");
  const [showUnlockModal, setShowUnlockModal] = useState(false);
  const [deleteTargetEmp, setDeleteTargetEmp] = useState(null);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("theme", theme); } catch (e) {}
  }, [theme]);

  const [employees, setEmployees] = useState([]);
  const [attendance, setAttendance] = useState([]);
  const [activity, setActivity] = useState([]);
  const [devices, setDevices] = useState([]);
  const [occupancy, setOccupancy] = useState({ count: 0, people: [] });
  const [rules, setRules] = useState([]);
  const [departmentsList, setDepartmentsList] = useState([]);
  const [shifts, setShifts] = useState([]);
  const [holidays, setHolidays] = useState([]);
  const [rooms, setRooms] = useState([]);
  const [selectedDate, setSelectedDate] = useState(new Date().toISOString().slice(0,10));

  useEffect(()=>{
    const t = setInterval(()=> setNow(new Date()), 1000);
    return ()=>clearInterval(t);
  },[]);

  const loadData = useCallback(async () => {
    if (!token) return;
    try {
      const [peopleRes, attRes, evRes, devRes, occRes, rulesRes, deptsRes, shiftsRes, holsRes, roomsRes] = await Promise.all([
        apiCall("/api/people", "GET", null, token).catch(() => ({ people: [] })),
        apiCall("/api/attendance?date=" + selectedDate, "GET", null, token).catch(() => ({ attendance: [] })),
        apiCall("/api/events?limit=30", "GET", null, token).catch(() => ({ events: [] })),
        apiCall("/api/devices", "GET", null, token).catch(() => ({ devices: [] })),
        apiCall("/api/occupancy", "GET", null, token).catch(() => ({ count: 0, people: [] })),
        apiCall("/api/rules", "GET", null, token).catch(() => ({ rules: [] })),
        apiCall("/api/departments", "GET", null, token).catch(() => ({ departments: [] })),
        apiCall("/api/shifts", "GET", null, token).catch(() => ({ shifts: [] })),
        apiCall("/api/holidays", "GET", null, token).catch(() => ({ holidays: [] })),
        apiCall("/api/rooms", "GET", null, token).catch(() => ({ rooms: [] })),
      ]);

      const peopleList = peopleRes.people || [];
      const grouped = {};
      for (const p of peopleList) {
        if (!grouped[p.id]) grouped[p.id] = p;
        else if (p.card_uid) grouped[p.id] = p;
      }
      setEmployees(Object.values(grouped));
      setAttendance(attRes.attendance || []);
      setActivity(evRes.events || []);
      setDevices(devRes.devices || []);
      setOccupancy(occRes || { count: 0, people: [] });
      setRules(rulesRes.rules || []);
      setDepartmentsList(deptsRes.departments || []);
      setShifts(shiftsRes.shifts || []);
      setHolidays(holsRes.holidays || []);
      setRooms(roomsRes.rooms || []);
    } catch(err) {
      console.error("Data fetch error:", err);
    }
  }, [token, selectedDate]);

  useEffect(() => {
    loadData();
  }, [loadData]);

  useEffect(() => {
    if (!token) return;
    const stream = new EventSource(API + "/api/stream");

    stream.addEventListener("access_event", (e) => {
      try {
        const ev = JSON.parse(e.data);
        setActivity(prev => [ev, ...prev.slice(0, 29)]);
        apiCall("/api/attendance?date=" + selectedDate, "GET", null, token).then(r => setAttendance(r.attendance || []));
        apiCall("/api/occupancy", "GET", null, token).then(r => setOccupancy(r || { count: 0, people: [] }));
      } catch(err) {}
    });

    stream.addEventListener("occupancy_changed", () => {
      apiCall("/api/occupancy", "GET", null, token).then(r => setOccupancy(r || { count: 0, people: [] }));
    });

    return () => stream.close();
  }, [token, selectedDate]);

  const departments = useMemo(() => {
    if (departmentsList && departmentsList.length > 0) return departmentsList.map(d => d.name);
    const set = new Set(["Engineering", "Operations", "Finance", "HR", "Sales"]);
    employees.forEach(e => { if (e.department) set.add(e.department); });
    return Array.from(set);
  }, [departmentsList, employees]);


  const handleAddEmployee = async (empData) => {
    try {
      const person = await apiCall(
        "/api/people",
        "POST",
        {
          employee_code: (empData.code || "").trim(),
          full_name: (empData.name || "").trim(),
          department: (empData.dept || "").trim(),
          person_type: empData.type || "EMPLOYEE",
          email: (empData.email || "").trim() || null,
        },
        token
      );

      if (!person || !person.id) {
        throw new Error("Employee creation failed");
      }

      if ((empData.card && empData.card.trim()) || (empData.fp && !isNaN(empData.fp))) {
        await apiCall(
          "/api/credentials",
          "POST",
          {
            person_id: person.id,
            card_uid: (empData.card || "").trim().toUpperCase(),
            fingerprint_slot: empData.fp && !isNaN(empData.fp) ? Number(empData.fp) : null,
          },
          token
        );
      }

      await loadData();
    } catch (err) {
      console.error("Add employee failed:", err);
      alert(err.message || "Failed to add employee");
    }
  };

  const handleEnrollEmployee = async (employee, deviceId) => {
  if (!employee || !employee.id) {
    alert("Invalid employee");
    return;
  }

  if (!deviceId) {
    alert("Please select a target ESP32 device");
    return;
  }

  try {
    const result = await apiCall(
      "/api/fingerprint-enrollment",
      "POST",
      {
        person_id: Number(employee.id),
        target_device_id: Number(deviceId),
      },
      token
    );

    if (!result) {
      throw new Error("Failed to create enrollment job");
    }

    if (result.created === false && result.existing === true) {
      alert(
        `Enrollment job already exists.\n\n` +
        `Job ID: ${result.job_id}\n` +
        `Fingerprint ID: ${result.fingerprint_id}\n` +
        `Target ESP32: ${result.target_esp32_id}`
      );
      return;
    }

    alert(
      `Enrollment job created successfully!\n\n` +
      `Job ID: ${result.job_id}\n` +
      `Employee: ${result.full_name}\n` +
      `Fingerprint ID: ${result.fingerprint_id}\n` +
      `Target ESP32: ${result.target_esp32_id}`
    );

    await loadData();

  } catch (err) {
    console.error(
      "Enrollment job creation failed:",
      err
    );

    alert(
      err.message ||
      "Failed to create enrollment job"
    );
  }
};
 
  const handleUnlockDelete = (pw) => {
    setDeletePassword(pw);
    setIsDeleteUnlocked(true);
    setShowUnlockModal(false);
  };

  const handleLockDelete = () => {
    setIsDeleteUnlocked(false);
    setDeletePassword("");
  };

  const handlePermanentDelete = async (emp, pw) => {
    const passwordToUse = (pw || deletePassword || "").trim();
    if (!emp || !emp.id) return;
    try {
      await apiCall(
        `/api/people/${emp.id}/permanent`,
        "DELETE",
        { password: passwordToUse },
        token
      );
      setDeleteTargetEmp(null);
      setSelectedEmp(null);
      await loadData();
      alert(`Employee ${emp.full_name} and all biometric/NFC credentials were permanently deleted.`);
    } catch (err) {
      console.error("Permanent deletion failed:", err);
      throw err;
    }
  };

  const handleDeactivate = async (emp) => {
    try {
      if (emp.is_active) {
        if (!confirm("Deactivate " + emp.full_name + "? Their card access will be stopped.")) return;
        await apiCall("/api/people/" + emp.id, "DELETE", null, token);
      } else {
        await apiCall("/api/people/" + emp.id, "PUT", { is_active: true }, token);
      }
      setSelectedEmp(null);
      await loadData();
    } catch(err) {
      alert("Action failed: " + err.message);
    }
  };

  const handleAddDevice = async (deviceData) => {
    await apiCall("/api/devices", "POST", deviceData, token);
    await loadData();
  };

  const handleUpdateDevicePurpose = async (deviceId, purpose) => {
    try {
      await apiCall("/api/devices/" + deviceId, "PUT", { purpose }, token);
      await loadData();
    } catch(err) {
      alert("Failed to update device purpose: " + err.message);
    }
  };

  const handleDeleteDevice = async (deviceId) => {
    if (!confirm("Are you sure you want to remove/deactivate this hardware device?")) return;
    await apiCall("/api/devices/" + deviceId, "DELETE", null, token);
    await loadData();
  };

  const handleAddDepartment = async (name) => {
    await apiCall("/api/departments", "POST", { name }, token);
    await loadData();
  };

  const handleDeleteDepartment = async (deptId, deptName) => {
    if (!confirm("Delete department '" + deptName + "'?")) return;
    await apiCall("/api/departments/" + deptId, "DELETE", null, token);
    await loadData();
  };

  const handleAddRule = async (ruleData) => {
    await apiCall("/api/rules", "POST", ruleData, token);
    await loadData();
  };

  const handleDeleteRule = async (ruleId) => {
    if (!confirm("Remove this access rule?")) return;
    await apiCall("/api/rules/" + ruleId, "DELETE", null, token);
    await loadData();
  };

  const handleAddShift = async (shiftData) => {
    await apiCall("/api/shifts", "POST", shiftData, token);
    await loadData();
  };

  const handleDeleteShift = async (shiftId) => {
    if (!confirm("Remove this shift schedule?")) return;
    await apiCall("/api/shifts/" + shiftId, "DELETE", null, token);
    await loadData();
  };

  const handleAddHoliday = async (holidayData) => {
    await apiCall("/api/holidays", "POST", holidayData, token);
    await loadData();
  };

  const handleDeleteHoliday = async (holidayId) => {
    if (!confirm("Remove this holiday?")) return;
    await apiCall("/api/holidays/" + holidayId, "DELETE", null, token);
    await loadData();
  };

  const handleLogout = () => {
    sessionStorage.clear();
    setToken("");
    setSelectedEmp(null);
  };

  if(!token) return <LoginPage onLogin={t => setToken(t)} />;

  const pageTitle = NAV.find(n=>n.key===page)?.label || "";

  return (
    <div data-theme={theme} style={{display:"flex", minHeight:"100vh", background:"var(--bg)", color:"var(--text)"}}>
      <aside style={{width:220, borderRight:"1px solid var(--border)", padding:"20px 14px", display:"flex", flexDirection:"column"}}>
        <div style={{display:"flex", alignItems:"center", gap:9, padding:"0 8px", marginBottom:26}}>
          <div style={{width:28, height:28, borderRadius:7, background:"var(--primary)", display:"flex", alignItems:"center", justifyContent:"center"}}>
            <Icon name="id" size={15}/>
          </div>
          <span style={{fontWeight:700, fontSize:14.5}}>Attendance</span>
        </div>
        <nav style={{display:"flex", flexDirection:"column", gap:2}}>
          {NAV.map(n=>(
            <button key={n.key} onClick={()=>{setPage(n.key); setSelectedEmp(null);}} style={{
              display:"flex", alignItems:"center", gap:10, padding:"9px 10px", borderRadius:8,
              border:"none", cursor:"pointer", textAlign:"left", fontSize:13.5, fontWeight:500,
              background: page===n.key ? "var(--primary-dim)" : "transparent",
              color: page===n.key ? "var(--primary)" : "var(--text-dim)"
            }}>
              <Icon name={n.icon} size={17}/>{n.label}
            </button>
          ))}
        </nav>
        <div style={{flex:1}}/>
        <button onClick={handleLogout} style={{
          display:"flex", alignItems:"center", gap:10, padding:"9px 10px", borderRadius:8,
          border:"none", cursor:"pointer", background:"transparent", color:"var(--text-faint)", fontSize:13
        }}><Icon name="logout" size={16}/>Sign out</button>
      </aside>

      <main style={{flex:1, display:"flex", flexDirection:"column", minWidth:0}}>
        <header style={{
          display:"flex", alignItems:"center", justifyContent:"space-between",
          padding:"14px 24px", borderBottom:"1px solid var(--border)"
        }}>
          <div>
            <div style={{fontSize:16.5, fontWeight:700}}>{selectedEmp ? selectedEmp.full_name : pageTitle}</div>
            <div className="mono" style={{fontSize:12, color:"var(--text-faint)"}}>
              {now.toLocaleDateString(undefined,{weekday:"long", year:"numeric", month:"long", day:"numeric"})} · {now.toLocaleTimeString()}
            </div>
          </div>
          <div style={{display:"flex", alignItems:"center", gap:10}}>
            <button onClick={()=>setTheme(t=>t==="dark"?"light":"dark")} style={{
              width:34, height:34, borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)",
              display:"flex", alignItems:"center", justifyContent:"center", cursor:"pointer", color:"var(--text)"
            }}><Icon name={theme==="dark"?"sun":"moon"} size={16}/></button>
            <div style={{width:32, height:32, borderRadius:"50%", background:"var(--primary-dim)", display:"flex", alignItems:"center", justifyContent:"center", fontSize:12, fontWeight:700, color:"var(--primary)"}}>AD</div>
          </div>
        </header>

        <div style={{padding:24, flex:1, overflow:"auto"}}>
          {page==="dashboard" && (
            <DashboardPage
              employees={employees}
              attendance={attendance}
              activity={activity}
              occupancy={occupancy}
              dateStr={selectedDate}
            />
          )}
          {page==="employees" && !selectedEmp && (
            <EmployeesPage
              employees={employees}
              departments={departments}
              onSelect={setSelectedEmp}
              onAddClick={()=>setIsAddModalOpen(true)}
              onDeactivate={handleDeactivate}
              onDelete={(emp)=>setDeleteTargetEmp(emp)}
              isDeleteUnlocked={isDeleteUnlocked}
              onUnlockClick={()=>setShowUnlockModal(true)}
              onLockClick={handleLockDelete}
            />
          )}
          {page==="employees" && selectedEmp && (
            <EmployeeProfile
              emp={selectedEmp}
              attendanceHistory={attendance.filter(a => a.person_id === selectedEmp.id || a.employee_code === selectedEmp.employee_code)}
              onBack={()=>setSelectedEmp(null)}
              onDeactivate={handleDeactivate}
              onDelete={(emp)=>setDeleteTargetEmp(emp)}
              isDeleteUnlocked={isDeleteUnlocked}
              onUnlockClick={()=>setShowUnlockModal(true)}
              token={token}
            />
          )}
          {page==="attendance" && (
            <AttendancePage
              attendance={attendance}
              departments={departments}
              selectedDate={selectedDate}
              onDateChange={setSelectedDate}
            />
          )}
          {page==="devices" && (
            <DevicesPage
              devices={devices}
              rooms={rooms}
              onAddDevice={handleAddDevice}
              onDeleteDevice={handleDeleteDevice}
              onUpdatePurpose={handleUpdateDevicePurpose}
            />
          )}
          {page==="admin" && (
            <AdminPage
              departments={departmentsList}
              employees={employees}
              rules={rules}
              shifts={shifts}
              holidays={holidays}
              rooms={rooms}
              onAddDepartment={handleAddDepartment}
              onDeleteDepartment={handleDeleteDepartment}
              onAddRule={handleAddRule}
              onDeleteRule={handleDeleteRule}
              onAddShift={handleAddShift}
              onDeleteShift={handleDeleteShift}
              onAddHoliday={handleAddHoliday}
              onDeleteHoliday={handleDeleteHoliday}
            />
          )}
        </div>
      </main>

      <AddEmployeeModal
        isOpen={isAddModalOpen}
        onClose={()=>setIsAddModalOpen(false)}
        onSaved={loadData}
        departments={departmentsList}
        devices={devices}
        token={token}
      />

      <UnlockDeleteModal
        isOpen={showUnlockModal}
        onClose={()=>setShowUnlockModal(false)}
        onUnlock={handleUnlockDelete}
        token={token}
      />

      <PermanentDeleteModal
        emp={deleteTargetEmp}
        isOpen={Boolean(deleteTargetEmp)}
        onClose={()=>setDeleteTargetEmp(null)}
        onConfirm={handlePermanentDelete}
        defaultPassword={deletePassword}
        token={token}
      />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Shell/>);
</script>
</body>
</html>
