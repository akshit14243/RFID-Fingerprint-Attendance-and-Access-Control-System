<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance & Access Control — Admin Console</title>
<script>
  (function() {
    var manual = localStorage.getItem("theme_manual");
    var savedTheme = manual ? localStorage.getItem("theme") : null;
    if (!savedTheme) {
      var hour = new Date().getHours();
      savedTheme = (hour >= 12) ? "dark" : "light";
    }
    document.documentElement.setAttribute("data-theme", savedTheme);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#f4f6fb; --surface:#ffffff; --surface-2:#f1f4f9; --surface-hover:#e8eef8;
    --border:#e2e8f0; --border-subtle:#edf2f7;
    --text:#111827; --text-dim:#5a6679; --text-faint:#94a3b8;
    --primary:#2563eb; --primary-hover:#1d4ed8; --primary-dim:#eff4ff;
    --primary-glow:rgba(37, 99, 235, 0.14);
    --chart-bar-mute:#e2e8f0; --chart-bar-hover:#cbd5e1;
    --chart-grid:rgba(226, 232, 240, 0.7);
    --teal:#10b981; --teal-bg:#ecfdf5;
    --amber:#f59e0b; --amber-bg:#fffbeb;
    --rose:#ef4444; --rose-bg:#fef2f2;
    --radius:12px;
    --card-shadow: 0 1px 3px rgba(0,0,0,0.03), 0 6px 16px -4px rgba(0,0,0,0.03);
  }
  [data-theme="dark"]{
    --bg:#0b0d11; --surface:#12151b; --surface-2:#181c25; --surface-hover:#1f2432;
    --border:#202531; --border-subtle:#181c26;
    --text:#f1f5f9; --text-dim:#8e9ab0; --text-faint:#556075;
    --primary:#3b82f6; --primary-hover:#2563eb; --primary-dim:#17223b;
    --primary-glow:rgba(59, 130, 246, 0.18);
    --chart-bar-mute:#1e2433; --chart-bar-hover:#2a3346;
    --chart-grid:rgba(32, 37, 49, 0.8);
    --teal:#10b981; --teal-bg:#06261a;
    --amber:#f59e0b; --amber-bg:#2b1b04;
    --rose:#f43f5e; --rose-bg:#2d0b13;
    --card-shadow: 0 2px 10px rgba(0,0,0,0.5);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{
    font-family:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    font-variant-numeric: tabular-nums;
  }
  #root{min-height:100vh;}
  ::selection{background:var(--primary); color:#fff;}
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  ::-webkit-scrollbar{width:7px; height:7px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-faint);}
  @keyframes flashIn { from { background: var(--primary-dim); } to { background: transparent; } }
  .flash-row { animation: flashIn 1.4s ease-out; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 500px; padding: 24px; box-shadow: 0 16px 40px rgba(0,0,0,0.6); }
  .modal-box-large { max-width: 580px; }
  @keyframes pulseGlow {
    0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(76, 111, 255, 0.45); }
    70% { transform: scale(1.02); box-shadow: 0 0 0 20px rgba(76, 111, 255, 0); }
    100% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(76, 111, 255, 0); }
  }
  @keyframes pulseGreen {
    0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.5); }
    70% { transform: scale(1.02); box-shadow: 0 0 0 20px rgba(45, 212, 191, 0); }
    100% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(45, 212, 191, 0); }
  }
  @keyframes scanLine {
    0% { top: 4px; opacity: 0.9; }
    50% { top: calc(100% - 6px); opacity: 1; }
    100% { top: 4px; opacity: 0.9; }
  }
  @keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .spin-slow { animation: spinSlow 1.5s linear infinite; }
  .nfc-card-glow { animation: pulseGlow 2s infinite ease-in-out; }
  .nfc-card-success { animation: pulseGreen 2s infinite ease-in-out; }
  .scanner-beam { position: absolute; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #2dd4bf, transparent); box-shadow: 0 0 12px #2dd4bf; animation: scanLine 2s ease-in-out infinite; }
  
  /* Modern Dashboard Layout Utilities */
  .modern-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--card-shadow);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  .modern-card:hover {
    border-color: rgba(37, 99, 235, 0.35);
  }
  .chart-tooltip-badge {
    position: absolute;
    background: var(--primary);
    color: #ffffff;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    pointer-events: none;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
    transform: translate(-50%, -100%);
    white-space: nowrap;
  }
  .trend-tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 11.5px;
    font-weight: 500;
    padding: 2px 0;
  }
  .trend-tag .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
  }
  .dock-btn {
    width: 44px;
    height: 44px;
    border-radius: 10px;
    border: none;
    background: transparent;
    color: var(--text-dim);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    position: relative;
    transition: all .15s ease;
  }
  .dock-btn:hover {
    background: var(--surface-2);
    color: var(--text);
  }
  .dock-btn.active {
    background: var(--primary-dim);
    color: var(--primary);
    font-weight: 600;
  }
  .dock-btn.active::before {
    content: '';
    position: absolute;
    left: -12px;
    top: 8px;
    bottom: 8px;
    width: 3.5px;
    border-radius: 0 3px 3px 0;
    background: var(--primary);
  }
  .table-row-hover:hover {
    background: var(--surface-hover);
  }
  .print-only { display: none !important; }
  @media print {
    @page { margin: 12mm 14mm; }
    aside, header, nav, .no-print, .dock-btn, select, input, button {
      display: none !important;
    }
    html, body {
      background: #ffffff !important;
      color: #111827 !important;
      font-size: 10pt !important;
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
    }
    #root, main, div[data-theme] {
      display: block !important;
      width: 100% !important;
      margin: 0 !important;
      padding: 0 !important;
      background: #ffffff !important;
      color: #111827 !important;
      min-height: auto !important;
    }
    .modern-card, .card {
      border: none !important;
      box-shadow: none !important;
      background: transparent !important;
      padding: 0 !important;
      margin: 0 !important;
    }
    .print-only {
      display: block !important;
    }
    .print-only-flex {
      display: flex !important;
    }
    table {
      width: 100% !important;
      border-collapse: collapse !important;
      margin-top: 10px !important;
      color: #111827 !important;
    }
    th {
      background: #f3f4f6 !important;
      color: #111827 !important;
      border-bottom: 2px solid #111827 !important;
      border-top: 1px solid #e5e7eb !important;
      padding: 8px 10px !important;
      font-size: 9pt !important;
      text-transform: uppercase !important;
      letter-spacing: 0.5px !important;
      print-color-adjust: exact;
      -webkit-print-color-adjust: exact;
    }
    td {
      border-bottom: 1px solid #e5e7eb !important;
      padding: 8px 10px !important;
      color: #111827 !important;
      font-size: 9.5pt !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useMemo, useEffect, useCallback, useRef} = React;

const API = (location.port === "3000") ? "" : "http://127.0.0.1:3000";

const NAV = [
  {key:"dashboard", label:"Dashboard", icon:"grid"},
  {key:"logs", label:"Recent Logs", icon:"list"},
  {key:"employees", label:"Employees", icon:"user"},
  {key:"attendance", label:"Attendance", icon:"clock"},
  {key:"devices", label:"Devices", icon:"cpu"},
  {key:"admin", label:"Admin & Rules", icon:"shield"},
];

function Icon({name, size=18, style}){

    case "user": return <svg {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
    case "user-x": return <svg {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="17" y1="11" x2="22" y2="11"/></svg>;
    case "clock": return <svg {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>;
    case "clock-alert": return <svg {...p}><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 9 14"/><path d="M12 2v3"/></svg>;
    case "cpu": return <svg {...p}><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>;
    case "settings": return <svg {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1 2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9c.2.6.7 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>;
    case "shield": return <svg {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>;

    case "calendar": return <svg {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>;
    case "bell": return <svg {...p}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>;
    case "layout": return <svg {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>;
    case "sliders": return <svg {...p}><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>;
    case "sun": return <svg {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>;
    case "sun-rays": return <svg {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>;
    case "moon": return <svg {...p}><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>;
    case "search": return <svg {...p}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>;
    case "plus": return <svg {...p}><path d="M12 5v14M5 12h14"/></svg>;
    case "download": return <svg {...p}><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>;
    case "printer": return <svg {...p}><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>;
    case "id": return <svg {...p}><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="12" r="2"/><path d="M14 10h5M14 14h5"/></svg>;
    case "check": return <svg {...p}><path d="M20 6L9 17l-5-5"/></svg>;
    case "x": return <svg {...p}><path d="M18 6L6 18M6 6l12 12"/></svg>;
    case "logout": return <svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>;
    case "chevron": return <svg {...p}><path d="M9 18l6-6-6-6"/></svg>;
    case "chevron-left": return <svg {...p}><path d="M15 18l-6-6 6-6"/></svg>;
    case "chevron-right": return <svg {...p}><path d="M9 18l6-6-6-6"/></svg>;
    case "chevrons-left": return <svg {...p}><path d="M11 17l-5-5 5-5M18 17l-5-5 5-5"/></svg>;
    case "chevrons-right": return <svg {...p}><path d="M13 17l5-5-5-5M6 17l5-5-5-5"/></svg>;
    case "trash": return <svg {...p}><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    case "nfc": return <svg {...p}><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 10a5 5 0 0 1 7.1 0M9.5 12.5a1.5 1.5 0 0 1 2.1 0"/><circle cx="17" cy="15" r="1"/></svg>;

    case "arrow-right": return <svg {...p}><path d="M5 12h14M12 5l7 7-7 7"/></svg>;
    case "loader": return <svg {...p} className="spin-slow"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>;

    case "check-circle": return <svg {...p}><circle cx="12" cy="12" r="9"/><path d="M8.5 12l2.5 2.5 5-5"/></svg>;
    case "alert-triangle": return <svg {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;

    case "external-link": return <svg {...p}><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>;
    case "filter": return <svg {...p}><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>;
    case "polygon-emblem": return (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" style={style}>
        <path d="M4 4l15 2.2-4.5 15L3.5 18.5 4 4z" fill="var(--primary)" fillOpacity="0.9"/>
        <path d="M14.5 6.2l4.5-.2-4.5 15.2-3.8-3.2 3.8-11.8z" fill="var(--primary-hover)" fillOpacity="0.75"/>

}

function StatusBadge({status}){
  const map = {
    present:{c:"var(--teal)", bg:"var(--teal-bg)", label:"Present"},
    on_time:{c:"var(--teal)", bg:"var(--teal-bg)", label:"On Time"},
    late:{c:"var(--amber)", bg:"var(--amber-bg)", label:"Late"},
    absent:{c:"var(--rose)", bg:"var(--rose-bg)", label:"Absent"},
    early_leave:{c:"var(--primary)", bg:"var(--primary-dim)", label:"Early Leave"},
    active:{c:"var(--teal)", bg:"var(--teal-bg)", label:"Active"},
    inactive:{c:"var(--text-faint)", bg:"var(--surface-2)", label:"Inactive"},
    online:{c:"var(--teal)", bg:"var(--teal-bg)", label:"Online"},
    offline:{c:"var(--rose)", bg:"var(--rose-bg)", label:"Offline"},
    ALLOWED:{c:"var(--teal)", bg:"var(--teal-bg)", label:"Allowed"},
    DENIED:{c:"var(--rose)", bg:"var(--rose-bg)", label:"Denied"},
  };
  const s = map[status] || map.inactive;
  return (
    <span style={{
      display:"inline-flex", alignItems:"center", gap:6, fontSize:12, fontWeight:600,
      color:s.c, background:s.bg, padding:"3px 10px", borderRadius:999,
    }}>

    </span>
  );
}

async function apiCall(path, method="GET", body=null, token="") {
  const headers = {};
  if (token) headers["Authorization"] = "Bearer " + token;
  if (body) headers["Content-Type"] = "application/json";

  const res = await fetch(API + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : null,
  });

  if (res.status === 401) {
    sessionStorage.clear();
    window.location.reload();
    throw new Error("Session expired");
  }

  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detailMsg = data.details
      ? (Array.isArray(data.details) ? data.details.map(d => d.message || (d.path && d.path.join("."))).join(", ") : JSON.stringify(data.details))
      : "";
    throw new Error(data.message || detailMsg || data.error || ("HTTP " + res.status));
  }
  return data;
}

function getPaginationItems(current, total) {
  if (total <= 7) {
    return Array.from({ length: total }, (_, i) => i + 1);
  }
  if (current <= 4) {
    return [1, 2, 3, 4, 5, "...", total];
  }
  if (current >= total - 3) {
    return [1, "...", total - 4, total - 3, total - 2, total - 1, total];
  }
  return [1, "...", current - 1, current, current + 1, "...", total];
}

function DashboardPage({
  employees = [],
  attendance = [],
  activity = [],
  activityTotal = 0,
  activityPage = 1,
  activityStats = null,
  onPageChange,
  onRefreshActivity,
  isLogsLoading = false,
  occupancy,
  dateStr,
  onSelectDate,
  onAdvancedConfig,
  token
}) {
  const [clock, setClock] = useState(() => new Date());
  const [comparisonTab, setComparisonTab] = useState("daily");
  const [hoveredPoint, setHoveredPoint] = useState(null);
  const [hoveredBar, setHoveredBar] = useState(null);
  const [dailyTrend, setDailyTrend] = useState([]);
  const [searchQuery, setSearchQuery] = useState("");
  const [filterDecision, setFilterDecision] = useState("all");
  const [filterDept, setFilterDept] = useState("all");
  const [showFilters, setShowFilters] = useState(false);
  const [jumpPage, setJumpPage] = useState("");

  // Live ticking clock
  useEffect(() => {
    const timer = setInterval(() => setClock(new Date()), 1000);
    return () => clearInterval(timer);
  }, []);

  // Fetch live past 7-day attendance trend
  useEffect(() => {
    let isCancelled = false;
    async function fetchPastDays() {
      const daysCount = 7;
      const days = [];
      const baseDate = dateStr ? new Date(dateStr) : new Date();

      for (let i = daysCount - 1; i >= 0; i--) {
        const d = new Date(baseDate);
        d.setDate(d.getDate() - i);
        const iso = d.toISOString().slice(0, 10);
        const dayLabel = d.toLocaleDateString(undefined, { day: "2-digit", month: "short" });
        days.push({ iso, label: dayLabel });
      }

      const totalEmp = employees?.length || 1;
      const todayISO = (dateStr || new Date().toISOString().slice(0, 10));
      const authToken = token || sessionStorage.getItem("token") || "";

      const promises = days.map(async (day) => {
        if (day.iso === todayISO && Array.isArray(attendance) && attendance.length > 0) {
          const present = attendance.filter(a => Boolean(a.first_in)).length;
          return {
            label: day.label,
            val: totalEmp > 0 ? Math.round((present / totalEmp) * 100) : 0,
            present,
            total: totalEmp
          };
        }
        try {
          const res = await apiCall("/api/attendance?date=" + day.iso, "GET", null, authToken);
          const attList = res?.attendance || [];
          const present = attList.filter(a => Boolean(a.first_in)).length;
          return {
            label: day.label,
            val: totalEmp > 0 ? Math.round((present / totalEmp) * 100) : 0,
            present,
            total: totalEmp
          };
        } catch (e) {
          return {
            label: day.label,
            val: 0,
            present: 0,
            total: totalEmp
          };
        }
      });

      const results = await Promise.all(promises);
      if (!isCancelled) {
        setDailyTrend(results);
      }
    }

    fetchPastDays();
    return () => { isCancelled = true; };
  }, [token, dateStr, attendance, employees]);

  // Formatted clock time (e.g. 8:02:09 AM)
  const clockTime = useMemo(() => {
    return clock.toLocaleTimeString([], {
      hour: "numeric",
      minute: "2-digit",
      second: "2-digit",
      hour12: true
    });
  }, [clock]);

  // Determine if current time is PM (for sun/moon theme sync)
  const isPM = useMemo(() => {
    return clock.getHours() >= 12;
  }, [clock]);

  // Formatted date with ordinal suffix (e.g. 2nd August 2026 / 30th September 2026)
  const formattedToday = useMemo(() => {
    const day = clock.getDate();
    const s = ["th", "st", "nd", "rd"];
    const v = day % 100;
    const ord = day + (s[(v - 20) % 10] || s[v] || s[0]);
    const month = clock.toLocaleDateString(undefined, { month: "long" });
    const year = clock.getFullYear();
    return `${ord} ${month} ${year}`;
  }, [clock]);

  // Format helper for times
  const formatTime = (value) => {
    if (!value) return "--";
    const d = new Date(value);
    if (isNaN(d.getTime())) return value;
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  };

  const formatDate = (value) => {
    if (!value) return "--";
    const d = new Date(value);
    if (isNaN(d.getTime())) return value;
    return d.toLocaleDateString([], { day: "2-digit", month: "short", year: "numeric" });
  };

  const getEmployeeName = (ev) => {
    if (ev.full_name && ev.full_name !== "Unknown") return ev.full_name;
    if (ev.person_name && ev.person_name !== "Unknown") return ev.person_name;
    if (ev.name && ev.name !== "Unknown") return ev.name;
    if (employees && employees.length > 0) {
      if (ev.person_id) {
        const found = employees.find(e => Number(e.id) === Number(ev.person_id));
        if (found && found.full_name) return found.full_name;
      }
      if (ev.employee_code) {
        const found = employees.find(e => (e.employee_code || "").toUpperCase() === (ev.employee_code || "").toUpperCase());
        if (found && found.full_name) return found.full_name;
      }
      if (ev.card_uid) {
        const cleanCard = String(ev.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
        const found = employees.find(e => e.card_uid && String(e.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase() === cleanCard);
        if (found && found.full_name) return found.full_name;
      }
    }
    if (ev.employee_code) return ev.employee_code;
    if (ev.person_id) return "Employee #" + ev.person_id;
    return "Unregistered User";
  };

  const getEmployeeCode = (ev) => {
    if (ev.employee_code && ev.employee_code !== "--") return ev.employee_code;
    if (employees && employees.length > 0) {
      if (ev.person_id) {
        const found = employees.find(e => Number(e.id) === Number(ev.person_id));
        if (found && found.employee_code) return found.employee_code;
      }
      if (ev.card_uid) {
        const cleanCard = String(ev.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
        const found = employees.find(e => e.card_uid && String(e.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase() === cleanCard);
        if (found && found.employee_code) return found.employee_code;
      }
    }
    return "--";
  };

  const getEmployeeDept = (ev) => {
    if (ev.department) return ev.department;
    if (employees && employees.length > 0) {
      if (ev.person_id) {
        const found = employees.find(e => Number(e.id) === Number(ev.person_id));
        if (found && found.department) return found.department;
      }
      if (ev.card_uid) {
        const cleanCard = String(ev.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
        const found = employees.find(e => e.card_uid && String(e.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase() === cleanCard);
        if (found && found.department) return found.department;
      }
    }
    return "Operations";
  };

  const getDecision = (ev) => {
    const value = String(ev.decision || ev.result || "").toUpperCase();
    if (value === "ALLOWED" || value === "GRANTED") return "GRANTED";
    return "DENIED";
  };

  // Dynamic KPI calculations
  const totalEmployeesCount = employees?.length || 0;
  const onTimeCount = useMemo(() => {
    if (!attendance || attendance.length === 0) return 0;
    return attendance.filter(a => {
      if (!a.first_in) return false;
      const t = new Date(a.first_in).toLocaleTimeString('en-GB');
      return t <= "09:45:00";
    }).length;
  }, [attendance]);

  const lateCount = useMemo(() => {
    if (!attendance || attendance.length === 0) return 0;
    return attendance.filter(a => {
      if (!a.first_in) return false;
      const t = new Date(a.first_in).toLocaleTimeString('en-GB');
      return t > "09:45:00";
    }).length;
  }, [attendance]);

  const presentCount = useMemo(() => {
    if (!attendance || attendance.length === 0) return 0;
    return attendance.filter(a => Boolean(a.first_in)).length;
  }, [attendance]);

  const absentCount = Math.max(0, totalEmployeesCount - presentCount);

  const earlyDepartCount = useMemo(() => {
    if (!attendance || attendance.length === 0) return 0;
    return attendance.filter(a => {
      if (!a.last_out) return false;
      const t = new Date(a.last_out).toLocaleTimeString('en-GB');
      return t < "17:30:00";
    }).length;
  }, [attendance]);

  const insideCount = occupancy?.count || 0;
  const onTimeRate = totalEmployeesCount > 0 ? Math.round((onTimeCount / totalEmployeesCount) * 100) : 0;
  const absentRate = totalEmployeesCount > 0 ? Math.round((absentCount / totalEmployeesCount) * 100) : 0;
  const activeEmployeesCount = useMemo(() => {
    return (employees || []).filter(e => e.is_active !== false).length;
  }, [employees]);

  // Pagination calculations
  const recentLogs = Array.isArray(activity) ? activity : [];
  const totalEvents = activityTotal != null ? Number(activityTotal) : recentLogs.length;
  const totalPages = Math.max(1, Math.ceil(totalEvents / 30));
  const currentPage = Math.min(Math.max(1, Number(activityPage) || 1), totalPages);
  const pageItems = getPaginationItems(currentPage, totalPages);

  const handleJump = (e) => {
    e.preventDefault();
    const p = parseInt(jumpPage, 10);
    if (!isNaN(p) && p >= 1 && p <= totalPages) {
      if (onPageChange) onPageChange(p);
      setJumpPage("");
    }
  };

  // Filter logs locally for search and quick dropdowns if applied
  const displayedLogs = useMemo(() => {
    return recentLogs.filter(ev => {
      const name = getEmployeeName(ev).toLowerCase();
      const code = getEmployeeCode(ev).toLowerCase();
      const dept = (getEmployeeDept(ev) || "").toLowerCase();
      const card = (ev.card_uid || "").toLowerCase();
      const q = searchQuery.toLowerCase();
      const matchesSearch = !q || name.includes(q) || code.includes(q) || dept.includes(q) || card.includes(q);

      const decision = getDecision(ev);
      const matchesDecision = filterDecision === "all" || decision === filterDecision;
      const matchesDept = filterDept === "all" || dept === filterDept.toLowerCase();

      return matchesSearch && matchesDecision && matchesDept;
    });
  }, [recentLogs, searchQuery, filterDecision, filterDept, employees]);

  // Analytics Comparison Spline Data Points (Dynamic from live attendance)
  const comparisonData = useMemo(() => {
    const totalEmp = employees?.length || 1;
    const todayPresent = (attendance || []).filter(a => Boolean(a.first_in)).length;
    const currentRate = totalEmp > 0 ? Math.round((todayPresent / totalEmp) * 100) : 0;

    if (comparisonTab === "weekly") {
      const avgPast = dailyTrend.length > 0
        ? Math.round(dailyTrend.reduce((acc, d) => acc + d.val, 0) / dailyTrend.length)
        : currentRate;
      return [
        { label: "W1", val: Math.max(0, avgPast - 10), present: Math.max(0, todayPresent - 1), total: totalEmp },
        { label: "W2", val: Math.max(0, avgPast - 5), present: todayPresent, total: totalEmp },
        { label: "W3", val: Math.max(0, avgPast + 3), present: todayPresent, total: totalEmp },
        { label: "Current", val: currentRate, present: todayPresent, total: totalEmp }
      ];
    }

    if (comparisonTab === "monthly") {
      const months = [];
      const now = new Date();
      for (let i = 5; i >= 0; i--) {
        const m = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const label = m.toLocaleDateString(undefined, { month: "short" });
        const val = i === 0 ? currentRate : Math.max(0, currentRate - (i * 3));
        months.push({ label, val, present: i === 0 ? todayPresent : 0, total: totalEmp });
      }
      return months;
    }

    // Daily tab (Live 7-Day Trend)
    if (dailyTrend.length > 0) {
      return dailyTrend;
    }

    // Immediate fallback while 7-day trend loads
    const days = [];
    const baseDate = dateStr ? new Date(dateStr) : new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(baseDate);
      d.setDate(d.getDate() - i);
      const label = d.toLocaleDateString(undefined, { day: "2-digit", month: "short" });
      const isSelected = i === 0;
      days.push({
        label,
        val: isSelected ? currentRate : 0,
        present: isSelected ? todayPresent : 0,
        total: totalEmp
      });
    }
    return days;
  }, [comparisonTab, dailyTrend, employees, attendance, dateStr]);

  // SVG dimensions for Area Spline Chart
  const svgWidth = 620;
  const svgHeight = 220;
  const padX = 35;
  const padY = 30;
  const chartW = svgWidth - padX * 2;
  const chartH = svgHeight - padY * 2;
  const stepX = chartW / Math.max(1, comparisonData.length - 1);

  const splineCoords = useMemo(() => {
    return comparisonData.map((p, i) => ({
      x: padX + i * stepX,
      y: padY + (1 - (p.val || 0) / 100) * chartH,
      label: p.label,
      val: p.val || 0,
      present: p.present,
      total: p.total,
      index: i
    }));
  }, [comparisonData, chartH, stepX]);

  const splinePaths = useMemo(() => {
    if (splineCoords.length === 0) return { line: "", area: "" };
    let d = `M ${splineCoords[0].x.toFixed(1)} ${splineCoords[0].y.toFixed(1)}`;
    for (let i = 0; i < splineCoords.length - 1; i++) {
      const p0 = splineCoords[i === 0 ? 0 : i - 1];
      const p1 = splineCoords[i];
      const p2 = splineCoords[i + 1];
      const p3 = splineCoords[i + 2 < splineCoords.length ? i + 2 : i + 1];

      const cp1x = p1.x + (p2.x - p0.x) / 6;
      const cp1y = p1.y + (p2.y - p0.y) / 6;
      const cp2x = p2.x - (p3.x - p1.x) / 6;
      const cp2y = p2.y - (p3.y - p1.y) / 6;

      d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
    }
    const bottomY = padY + chartH;
    const area = `${d} L ${splineCoords[splineCoords.length - 1].x.toFixed(1)} ${bottomY} L ${splineCoords[0].x.toFixed(1)} ${bottomY} Z`;
    return { line: d, area };
  }, [splineCoords, chartH]);

  // Live Department Attendance Bar Chart Data
  const barData = useMemo(() => {
    const deptMap = {};

    // 1. Group registered employees by department
    (employees || []).forEach(e => {
      const d = (e.department && String(e.department).trim()) ? String(e.department).trim() : "General";
      if (!deptMap[d]) deptMap[d] = { total: 0, present: 0 };
      deptMap[d].total += 1;
    });

    // 2. Count present today from live attendance
    (attendance || []).forEach(a => {
      if (a.first_in) {
        const d = (a.department && String(a.department).trim()) ? String(a.department).trim() : "General";
        if (!deptMap[d]) deptMap[d] = { total: 0, present: 0 };
        deptMap[d].present += 1;
      }
    });

    const depts = Object.keys(deptMap);
    if (depts.length === 0) {
      return [
        { label: "Engineering", val: 0, isPeak: false, present: 0, total: 0 },
        { label: "Finance", val: 0, isPeak: false, present: 0, total: 0 },
        { label: "Operations", val: 0, isPeak: false, present: 0, total: 0 }
      ];
    }

    const calculated = depts.map(dept => {
      const item = deptMap[dept];
      const rate = item.total > 0 ? Math.round((item.present / item.total) * 100) : 0;
      return {
        label: dept,
        val: rate,
        present: item.present,
        total: item.total,
        isPeak: false
      };
    });

    // Mark peak department
    let maxVal = -1;
    calculated.forEach(c => {
      if (c.val > maxVal) maxVal = c.val;
    });
    if (maxVal > 0) {
      const peakItem = calculated.find(c => c.val === maxVal);
      if (peakItem) peakItem.isPeak = true;
    }

    return calculated;
  }, [employees, attendance]);

  const barSvgW = 320;
  const barSvgH = 220;
  const barPadX = 30;
  const barPadY = 30;
  const barChartW = barSvgW - barPadX * 2;
  const barChartH = barSvgH - barPadY * 2;
  const barStepX = barChartW / Math.max(1, barData.length);
  const barWidth = Math.min(32, Math.max(18, Math.floor(barStepX * 0.52)));

  const activePointIndex = hoveredPoint != null ? hoveredPoint : Math.max(0, splineCoords.length - 1);
  const activePoint = splineCoords[activePointIndex] || splineCoords[0];

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 20 }}>

      {/* TOP SECTION: Clock Card (Left) + 6 KPI Cards Grid (Right) */}
      <div style={{
        display: "grid",
        gridTemplateColumns: "290px 1fr",
        gap: 16,
        alignItems: "stretch"
      }}>

        {/* 1. Realtime / Nighttime Insight Clock Card (Synced with PM/AM) */}
        <div className="modern-card" style={{
          padding: "24px 22px",
          display: "flex",
          flexDirection: "column",
          justifyContent: "space-between"
        }}>
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <div style={{
                width: 40,
                height: 40,
                borderRadius: "50%",
                border: isPM ? "1.5px dashed var(--primary)" : "1.5px dashed var(--amber)",
                background: isPM ? "var(--primary-dim)" : "var(--amber-bg)",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                color: isPM ? "var(--primary)" : "var(--amber)",
                flexShrink: 0
              }}>
                <Icon name={isPM ? "moon" : "sun-rays"} size={20} />
              </div>

              <div>
                <div className="mono" style={{ fontSize: 24, fontWeight: 700, letterSpacing: -0.5, color: "var(--text)", lineHeight: 1.1 }}>
                  {clockTime}
                </div>
                <div style={{ fontSize: 12, color: "var(--text-dim)", marginTop: 2 }}>
                  {isPM ? "Nighttime insight" : "Realtime insight"}
                </div>
              </div>
            </div>

            <div style={{ marginTop: 28, marginBottom: 12 }}>
              <div style={{ fontSize: 12, color: "var(--text-faint)", marginBottom: 4, fontWeight: 500 }}>
                Today:
              </div>
              <div style={{ fontSize: 16.5, fontWeight: 700, color: "var(--text)" }}>
                {formattedToday}
              </div>
            </div>
          </div>

          <div style={{ marginTop: 18 }}>
            <button
              type="button"
              onClick={() => onAdvancedConfig ? onAdvancedConfig() : null}
              style={{
                display: "inline-flex",
                alignItems: "center",
                justifyContent: "center",
                gap: 8,
                width: "100%",
                padding: "11px 16px",
                borderRadius: 8,
                background: "var(--primary)",
                color: "#ffffff",
                border: "none",
                fontSize: 12.5,
                fontWeight: 600,
                cursor: "pointer",
                boxShadow: "0 2px 8px var(--primary-glow)",
                transition: "opacity 0.15s ease"
              }}
              onMouseEnter={e => e.currentTarget.style.opacity = "0.9"}
              onMouseLeave={e => e.currentTarget.style.opacity = "1"}
            >
              <Icon name="settings" size={14} /> Advanced Configuration
            </button>
          </div>
        </div>

        {/* 2. 6 KPI Cards Grid (3x2) */}
        <div style={{
          display: "grid",
          gridTemplateColumns: "repeat(3, 1fr)",

                  const granted = decision === "GRANTED";
                  const name = getEmployeeName(ev);
                  const code = getEmployeeCode(ev);
                  const dept = getEmployeeDept(ev);
                  const evTime = ev.scanned_at || ev.access_time || ev.received_at;
                  const door = ev.room_name || ev.device_label || "--";

                  // Extract initials for avatar chip
                  const initials = name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase() || "EM";

                  return (
                    <tr
                      key={ev.id || ev.event_id || index}
                      className="table-row-hover"
                      style={{ borderBottom: "1px solid var(--border)", transition: "background .1s ease" }}
                    >
                      {/* ID */}
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap" }}>
                        <span className="mono" style={{ fontSize: 11.5, color: "var(--text-dim)" }}>
                          {code !== "--" ? code : `#${ev.id || index + 1}`}
                        </span>
                      </td>

                      {/* Employee Avatar + Name */}
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                          <div style={{
                            width: 30,
                            height: 30,
                            borderRadius: "50%",
                            background: "var(--primary-dim)",
                            color: "var(--primary)",
                            display: "flex",
                            alignItems: "center",
                            justifyContent: "center",
                            fontSize: 11,
                            fontWeight: 700,
                            flexShrink: 0
                          }}>
                            {initials}
                          </div>
                          <div>
                            <div style={{ fontWeight: 600, color: "var(--text)" }}>
                              {name}
                            </div>
                            <div style={{ fontSize: 11, color: "var(--text-faint)", marginTop: 1 }}>
                              {ev.card_uid ? `Card: ${ev.card_uid}` : "Standard Badge"}
                            </div>
                          </div>
                        </div>
                      </td>

                      {/* Role */}
                      <td style={{ padding: "12px 16px", color: "var(--text-dim)" }}>
                        {ev.person_type || "Staff"}
                      </td>

                      {/* Department */}
                      <td style={{ padding: "12px 16px", color: "var(--text-dim)" }}>
                        {dept}
                      </td>

                      {/* Date */}
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap", color: "var(--text-dim)" }}>
                        {formatDate(evTime)}
                      </td>

                      {/* Status */}
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap" }}>
                        <StatusBadge status={granted ? "on_time" : "absent"} />
                      </td>

                      {/* Check-in */}
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap" }}>
                        <span className="mono" style={{ fontSize: 12 }}>
                          {formatTime(evTime)}
                        </span>
                      </td>

                      {/* Check-out */}
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap", color: "var(--text-dim)" }}>
                        <span className="mono" style={{ fontSize: 12 }}>
                          {ev.direction === "OUT" ? formatTime(evTime) : "--"}
                        </span>
                      </td>

                      {/* Work hours / Door */}
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap" }}>
                        <span style={{
                          display: "inline-flex",
                          alignItems: "center",
                          gap: 6,
                          fontSize: 11.5,
                          color: "var(--text-dim)"
                        }}>
                          <Icon name="cpu" size={13} style={{ color: "var(--text-faint)" }} />
                          {door}
                        </span>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}

        {/* 30-Records Server Pagination Bar */}
        {totalEvents > 0 && (
          <div style={{
            padding: "14px 20px",
            borderTop: "1px solid var(--border)",
            background: "var(--surface)",
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            flexWrap: "wrap",
            gap: 12
          }}>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)" }}>
              Showing <strong style={{ color: "var(--text)" }}>{totalEvents === 0 ? 0 : (currentPage - 1) * 30 + 1}</strong> to{" "}
              <strong style={{ color: "var(--text)" }}>{Math.min(currentPage * 30, totalEvents)}</strong> of{" "}
              <strong style={{ color: "var(--text)" }}>{totalEvents.toLocaleString()}</strong> records
              {totalPages > 1 && (
                <span style={{ marginLeft: 8, color: "var(--text-faint)" }}>
                  (Page {currentPage} of {totalPages})
                </span>
              )}
            </div>

            <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
              {/* First page */}
              {totalPages > 5 && (
                <button
                  type="button"
                  onClick={() => onPageChange && onPageChange(1)}
                  disabled={currentPage === 1 || isLogsLoading}
                  title="First Page"
                  style={{
                    padding: "5px 8px",
                    fontSize: 12,
                    borderRadius: 6,
                    border: "1px solid var(--border)",
                    background: "var(--surface-2)",
                    color: currentPage === 1 ? "var(--text-faint)" : "var(--text)",
                    cursor: currentPage === 1 ? "not-allowed" : "pointer",
                    opacity: currentPage === 1 ? 0.4 : 1,
                    display: "inline-flex",
                    alignItems: "center"
                  }}
                >
                  <Icon name="chevrons-left" size={13} />
                </button>
              )}

              {/* Prev */}
              <button
                type="button"
                onClick={() => onPageChange && onPageChange(Math.max(1, currentPage - 1))}
                disabled={currentPage === 1 || isLogsLoading}
                style={{
                  display: "inline-flex",
                  alignItems: "center",
                  gap: 4,
                  padding: "5px 10px",
                  fontSize: 12,
                  fontWeight: 600,
                  borderRadius: 6,
                  border: "1px solid var(--border)",
                  background: "var(--surface-2)",
                  color: currentPage === 1 ? "var(--text-faint)" : "var(--text)",
                  cursor: currentPage === 1 ? "not-allowed" : "pointer",
                  opacity: currentPage === 1 ? 0.4 : 1
                }}
              >
                <Icon name="chevron-left" size={13} /> Prev
              </button>

              {/* Page pills */}
              {pageItems.map((p, idx) => {
                if (p === "...") {
                  return (
                    <span
                      key={`dots-${idx}`}
                      style={{ padding: "0 6px", color: "var(--text-faint)", fontSize: 13, userSelect: "none" }}
                    >
                      ...
                    </span>
                  );
                }
                const isActive = p === currentPage;
                return (
                  <button
                    key={p}
                    type="button"
                    onClick={() => onPageChange && onPageChange(p)}
                    disabled={isLogsLoading}
                    style={{
                      minWidth: 30,
                      height: 28,
                      padding: "0 7px",
                      fontSize: 12,
                      fontWeight: isActive ? 700 : 500,
                      borderRadius: 6,
                      border: isActive ? "1px solid var(--primary)" : "1px solid var(--border)",
                      background: isActive ? "var(--primary)" : "var(--surface-2)",
                      color: isActive ? "#ffffff" : "var(--text)",
                      cursor: "pointer",
                      transition: "all 0.15s ease"
                    }}
                  >
                    {p}
                  </button>
                );
              })}

              {/* Next */}
              <button
                type="button"
                onClick={() => onPageChange && onPageChange(Math.min(totalPages, currentPage + 1))}
                disabled={currentPage === totalPages || isLogsLoading}
                style={{
                  display: "inline-flex",
                  alignItems: "center",
                  gap: 4,
                  padding: "5px 10px",
                  fontSize: 12,
                  fontWeight: 600,
                  borderRadius: 6,
                  border: "1px solid var(--border)",
                  background: "var(--surface-2)",
                  color: currentPage === totalPages ? "var(--text-faint)" : "var(--text)",
                  cursor: currentPage === totalPages ? "not-allowed" : "pointer",
                  opacity: currentPage === totalPages ? 0.4 : 1
                }}
              >
                Next <Icon name="chevron-right" size={13} />
              </button>

              {/* Last page */}
              {totalPages > 5 && (
                <button
                  type="button"
                  onClick={() => onPageChange && onPageChange(totalPages)}
                  disabled={currentPage === totalPages || isLogsLoading}
                  title="Last Page"
                  style={{
                    padding: "5px 8px",
                    fontSize: 12,
                    borderRadius: 6,
                    border: "1px solid var(--border)",
                    background: "var(--surface-2)",
                    color: currentPage === totalPages ? "var(--text-faint)" : "var(--text)",
                    cursor: currentPage === totalPages ? "not-allowed" : "pointer",
                    opacity: currentPage === totalPages ? 0.4 : 1,
                    display: "inline-flex",
                    alignItems: "center"
                  }}
                >
                  <Icon name="chevrons-right" size={13} />
                </button>
              )}

              {/* Jump to page */}
              {totalPages > 5 && (
                <form
                  onSubmit={handleJump}
                  style={{ display: "inline-flex", alignItems: "center", gap: 4, marginLeft: 6 }}
                >
                  <span style={{ fontSize: 11.5, color: "var(--text-faint)" }}>Go:</span>
                  <input
                    type="number"
                    min="1"
                    max={totalPages}
                    value={jumpPage}
                    onChange={e => setJumpPage(e.target.value)}
                    placeholder="#"
                    style={{
                      width: 42,
                      height: 28,
                      padding: "0 4px",
                      borderRadius: 6,
                      border: "1px solid var(--border)",
                      background: "var(--surface-2)",
                      color: "var(--text)",
                      fontSize: 11.5,
                      textAlign: "center"
                    }}
                  />
                </form>
              )}
            </div>
          </div>
        )}

      </div>

    </div>
  );
}


function RecentLogsPage({
  activity = [],
  activityTotal = 0,
  activityPage = 1,
  activityStats = null,
  onPageChange,
  onRefreshActivity,
  isLogsLoading = false,
  employees = [],
  devices = [],
  rooms = []
}) {
  const [q, setQ] = useState("");
  const [filterDecision, setFilterDecision] = useState("all");
  const [jumpPage, setJumpPage] = useState("");

  const formatTime = (value) => {
    if (!value) return "--";
    const d = new Date(value);
    if (isNaN(d.getTime())) return value;
    return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  };

  const formatDate = (value) => {
    if (!value) return "--";
    const d = new Date(value);
    if (isNaN(d.getTime())) return value;
    return d.toLocaleDateString([], { day: "2-digit", month: "short", year: "numeric" });
  };

  const getEmployeeName = (ev) => {
    if (ev.full_name && ev.full_name !== "Unknown") return ev.full_name;
    if (ev.person_name && ev.person_name !== "Unknown") return ev.person_name;
    if (ev.name && ev.name !== "Unknown") return ev.name;
    if (employees && employees.length > 0) {
      if (ev.person_id) {
        const found = employees.find(e => Number(e.id) === Number(ev.person_id));
        if (found && found.full_name) return found.full_name;
      }
      if (ev.employee_code) {
        const found = employees.find(e => (e.employee_code || "").toUpperCase() === (ev.employee_code || "").toUpperCase());
        if (found && found.full_name) return found.full_name;
      }
      if (ev.card_uid) {
        const cleanCard = String(ev.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
        const found = employees.find(e => e.card_uid && String(e.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase() === cleanCard);
        if (found && found.full_name) return found.full_name;
      }
    }
    if (ev.employee_code) return ev.employee_code;
    if (ev.person_id) return "Employee #" + ev.person_id;
    return "Unregistered User";
  };

  const getEmployeeCode = (ev) => {
    if (ev.employee_code && ev.employee_code !== "--") return ev.employee_code;
    if (employees && employees.length > 0) {
      if (ev.person_id) {
        const found = employees.find(e => Number(e.id) === Number(ev.person_id));
        if (found && found.employee_code) return found.employee_code;
      }
      if (ev.card_uid) {
        const cleanCard = String(ev.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
        const found = employees.find(e => e.card_uid && String(e.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase() === cleanCard);
        if (found && found.employee_code) return found.employee_code;
      }
    }
    return "--";
  };

  const getEmployeeDept = (ev) => {
    if (ev.department) return ev.department;
    if (employees && employees.length > 0) {
      if (ev.person_id) {
        const found = employees.find(e => Number(e.id) === Number(ev.person_id));
        if (found && found.department) return found.department;
      }
      if (ev.card_uid) {
        const cleanCard = String(ev.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
        const found = employees.find(e => e.card_uid && String(e.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase() === cleanCard);
        if (found && found.department) return found.department;
      }
    }
    return null;
  };

  const getDecision = (ev) => {
    const value = String(ev.decision || ev.result || "").toUpperCase();
    if (value === "ALLOWED" || value === "GRANTED") return "GRANTED";
    return "DENIED";
  };

  const recentLogs = Array.isArray(activity) ? activity : [];
  const totalEvents = activityTotal != null ? Number(activityTotal) : recentLogs.length;
  const totalPages = Math.max(1, Math.ceil(totalEvents / 30));
  const currentPage = Math.min(Math.max(1, Number(activityPage) || 1), totalPages);

  const grantedCount = activityStats?.granted != null
    ? activityStats.granted
    : recentLogs.filter(ev => getDecision(ev) === "GRANTED").length;

  const deniedCount = activityStats?.denied != null
    ? activityStats.denied
    : recentLogs.filter(ev => getDecision(ev) === "DENIED").length;

  const pageItems = getPaginationItems(currentPage, totalPages);

  const handleJump = (e) => {
    e.preventDefault();
    const p = parseInt(jumpPage, 10);
    if (!isNaN(p) && p >= 1 && p <= totalPages) {
      if (onPageChange) onPageChange(p);
      setJumpPage("");
    }
  };

  const filteredLogs = useMemo(() => {
    return recentLogs.filter(ev => {
      const name = getEmployeeName(ev).toLowerCase();
      const code = getEmployeeCode(ev).toLowerCase();
      const card = (ev.card_uid || "").toLowerCase();
      const door = (ev.room_name || ev.device_label || "").toLowerCase();
      const query = q.toLowerCase();
      const matchesQ = !query || name.includes(query) || code.includes(query) || card.includes(query) || door.includes(query);

      const decision = getDecision(ev);
      const matchesDecision = filterDecision === "all" || decision === filterDecision;

      return matchesQ && matchesDecision;
    });
  }, [recentLogs, q, filterDecision, employees]);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 18 }}>

      {/* Top Stat Cards */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(4, minmax(0, 1fr))", gap: 14 }}>
        <div className="modern-card" style={{ padding: "18px 20px" }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 500, marginBottom: 8 }}>
            Total Events
          </div>
          <div style={{ fontSize: 26, fontWeight: 700, color: "var(--text)", lineHeight: 1 }}>
            {totalEvents.toLocaleString()}
          </div>
          <div style={{ fontSize: 11.5, color: "var(--text-faint)", marginTop: 6 }}>
            Recorded in system
          </div>
        </div>

        <div className="modern-card" style={{ padding: "18px 20px" }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 500, marginBottom: 8 }}>
            Access Granted
          </div>
          <div style={{ fontSize: 26, fontWeight: 700, color: "var(--teal)", lineHeight: 1 }}>
            {grantedCount.toLocaleString()}
          </div>
          <div style={{ fontSize: 11.5, color: "var(--teal)", marginTop: 6, display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: "currentColor" }} /> Authorized entry
          </div>
        </div>

        <div className="modern-card" style={{ padding: "18px 20px" }}>
          <div style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 500, marginBottom: 8 }}>
            Access Denied
          </div>
          <div style={{ fontSize: 26, fontWeight: 700, color: "var(--rose)", lineHeight: 1 }}>
            {deniedCount.toLocaleString()}
          </div>
          <div style={{ fontSize: 11.5, color: "var(--rose)", marginTop: 6, display: "flex", alignItems: "center", gap: 4 }}>
            <span style={{ width: 6, height: 6, borderRadius: "50%", background: "currentColor" }} /> Blocked attempts
          </div>
        </div>

        <div className="modern-card" style={{ padding: "18px 20px", display: "flex", flexDirection: "column", justifyContent: "space-between" }}>
          <div>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)", fontWeight: 500, marginBottom: 8 }}>
              Live Stream Status
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13.5, fontWeight: 600, color: "var(--teal)" }}>
              <span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--teal)", boxShadow: "0 0 8px var(--teal)" }} />
              Live Stream Active
            </div>
          </div>
          <div style={{ fontSize: 11.5, color: "var(--text-faint)" }}>
            SSE real-time access events
          </div>
        </div>
      </div>

      {/* Main Logs Table Card */}
      <div className="modern-card" style={{ overflow: "hidden" }}>

        {/* Toolbar Header */}
        <div style={{
          padding: "16px 20px",
          borderBottom: "1px solid var(--border)",
          display: "flex",
          justifyContent: "space-between",
          alignItems: "center",
          flexWrap: "wrap",
          gap: 12
        }}>
          <div>
            <div style={{ fontSize: 16, fontWeight: 700, color: "var(--text)", display: "flex", alignItems: "center", gap: 8 }}>
              Recent Access Logs
              {isLogsLoading && (
                <span style={{ fontSize: 12, color: "var(--primary)", display: "inline-flex", alignItems: "center", gap: 4 }}>
                  <Icon name="loader" size={13} /> Loading page {currentPage}...
                </span>
              )}
            </div>
            <div style={{ fontSize: 11.5, color: "var(--text-faint)", marginTop: 3 }}>
              Page <strong>{currentPage}</strong> of <strong>{totalPages}</strong> • 30 records per page
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap" }}>
            {/* Search Input */}
            <div style={{ position: "relative", minWidth: 220 }}>
              <span style={{ position: "absolute", left: 10, top: 8.5, color: "var(--text-faint)" }}>
                <Icon name="search" size={15} />
              </span>
              <input
                type="text"
                value={q}
                onChange={e => setQ(e.target.value)}
                placeholder="Search name, ID, card..."
                style={{
                  width: "100%",
                  padding: "7.5px 12px 7.5px 32px",
                  borderRadius: 8,
                  border: "1px solid var(--border)",
                  background: "var(--surface-2)",
                  color: "var(--text)",
                  fontSize: 12.5,
                  outline: "none"
                }}
              />
            </div>

            {/* Decision Filter */}
            <select
              value={filterDecision}
              onChange={e => setFilterDecision(e.target.value)}
              style={{
                padding: "7.5px 12px",
                borderRadius: 8,
                border: "1px solid var(--border)",
                background: "var(--surface-2)",
                color: "var(--text)",
                fontSize: 12.5,
                outline: "none"
              }}
            >
              <option value="all">All Decisions</option>
              <option value="GRANTED">Granted Only</option>
              <option value="DENIED">Denied Only</option>
            </select>

            {/* Refresh Button */}
            {onRefreshActivity && (
              <button

                  borderRadius: 8,

                  background: "var(--surface-2)",
                  color: "var(--text)",

                }}
              >
                <Icon name="refresh" size={13} /> Refresh
              </button>

          </div>
        </div>

        {/* Table */}
        {filteredLogs.length === 0 ? (
          <div style={{ padding: "40px 20px", textAlign: "center", color: "var(--text-faint)", fontSize: 13 }}>
            {recentLogs.length === 0 ? "No access logs available yet." : "No logs match your filter criteria."}
          </div>
        ) : (
          <div style={{ overflowX: "auto", opacity: isLogsLoading ? 0.6 : 1, transition: "opacity 0.15s ease" }}>
            <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 12.5 }}>
              <thead>
                <tr style={{
                  borderBottom: "1px solid var(--border)",
                  color: "var(--text-dim)",
                  textAlign: "left",

                }}>
                  <th style={{ padding: "11px 16px", fontWeight: 600, fontSize: 11.5 }}>Time</th>
                  <th style={{ padding: "11px 16px", fontWeight: 600, fontSize: 11.5 }}>Employee</th>
                  <th style={{ padding: "11px 16px", fontWeight: 600, fontSize: 11.5 }}>Employee ID</th>
                  <th style={{ padding: "11px 16px", fontWeight: 600, fontSize: 11.5 }}>Door / Location</th>
                  <th style={{ padding: "11px 16px", fontWeight: 600, fontSize: 11.5 }}>Direction</th>
                  <th style={{ padding: "11px 16px", fontWeight: 600, fontSize: 11.5 }}>Card UID</th>
                  <th style={{ padding: "11px 16px", fontWeight: 600, fontSize: 11.5, textAlign: "center" }}>Fingerprint</th>
                  <th style={{ padding: "11px 16px", fontWeight: 600, fontSize: 11.5 }}>Result</th>
                  <th style={{ padding: "11px 16px", fontWeight: 600, fontSize: 11.5 }}>Reason</th>
                </tr>
              </thead>
              <tbody>
                {filteredLogs.map((ev, index) => {
                  const decision = getDecision(ev);
                  const granted = decision === "GRANTED";
                  const name = getEmployeeName(ev);
                  const code = getEmployeeCode(ev);
                  const dept = getEmployeeDept(ev);
                  const evTime = ev.scanned_at || ev.access_time || ev.received_at;
                  const initials = name.split(" ").map(w => w[0]).join("").slice(0, 2).toUpperCase() || "EM";

                  return (
                    <tr
                      key={ev.id || ev.event_id || index}
                      className="table-row-hover"
                      style={{ borderBottom: "1px solid var(--border)", transition: "background .1s ease" }}
                    >
                      {/* Time */}
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap" }}>
                        <div className="mono" style={{ fontSize: 12, fontWeight: 500 }}>
                          {formatTime(evTime)}
                        </div>
                        <div style={{ fontSize: 10.5, color: "var(--text-faint)", marginTop: 2 }}>
                          {formatDate(evTime)}
                        </div>
                      </td>

                      {/* Employee */}
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap" }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                          <div style={{
                            width: 30,
                            height: 30,
                            borderRadius: "50%",
                            background: "var(--primary-dim)",
                            color: "var(--primary)",
                            display: "flex",
                            alignItems: "center",
                            justifyContent: "center",
                            fontSize: 11,
                            fontWeight: 700,
                            flexShrink: 0
                          }}>
                            {initials}
                          </div>
                          <div>
                            <div style={{ fontWeight: 600, color: "var(--text)" }}>{name}</div>

                          </div>
                        </div>
                      </td>

                      {/* Employee ID */}
                      <td style={{ padding: "12px 16px", whiteSpace: "nowrap" }}>
                        <span className="mono" style={{ fontSize: 12, color: "var(--text-dim)" }}>

                      </td>

                      {/* Door */}

                        <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                          <Icon name="cpu" size={13} style={{ color: "var(--text-faint)" }} />
                          {ev.room_name || ev.device_label || "--"}

                      </td>

                      {/* Direction */}
                      <td style={{ padding: "12px 16px" }}>
                        {ev.direction ? (
                          <span style={{
                            fontSize: 11,
                            padding: "3px 8px",
                            borderRadius: 6,
                            background: "var(--surface-2)",
                            fontWeight: 600,
                            color: "var(--text-dim)"

                            {ev.direction}

                      {/* Card */}
                      <td style={{ padding: "12px 16px" }}>
                        <span className="mono" style={{ fontSize: 11.5, color: "var(--text-dim)" }}>
                          {ev.card_uid || "--"}
                        </span>
                      </td>

                      {/* Fingerprint */}
                      <td style={{ padding: "12px 16px", textAlign: "center" }}>
                        {ev.fingerprint_used ? (
                          <span style={{ color: "var(--teal)", fontWeight: 700, fontSize: 13 }}>✓</span>
                        ) : (
                          <span style={{ color: "var(--text-faint)" }}>—</span>
                        )}

                      {/* Result */}
                      <td style={{ padding: "12px 16px" }}>
                        <StatusBadge status={granted ? "ALLOWED" : "DENIED"} />
                      </td>

                      {/* Reason */}

                        {ev.reason_code || "--"}

                    </tr>

              </tbody>
            </table>
          </div>
        )}

        {/* 30-Records Pagination */}
        {totalEvents > 0 && (
          <div style={{
            padding: "14px 20px",
            borderTop: "1px solid var(--border)",
            background: "var(--surface)",
            display: "flex",
            justifyContent: "space-between",
            alignItems: "center",
            flexWrap: "wrap",
            gap: 12
          }}>
            <div style={{ fontSize: 12.5, color: "var(--text-dim)" }}>
              Showing <strong style={{ color: "var(--text)" }}>{totalEvents === 0 ? 0 : (currentPage - 1) * 30 + 1}</strong> to{" "}
              <strong style={{ color: "var(--text)" }}>{Math.min(currentPage * 30, totalEvents)}</strong> of{" "}
              <strong style={{ color: "var(--text)" }}>{totalEvents.toLocaleString()}</strong> records
              {totalPages > 1 && (
                <span style={{ marginLeft: 8, color: "var(--text-faint)" }}>
                  (Page {currentPage} of {totalPages})
                </span>
              )}
            </div>

            <div style={{ display: "flex", alignItems: "center", gap: 6, flexWrap: "wrap" }}>
              {/* First page */}
              {totalPages > 5 && (
                <button
                  type="button"
                  onClick={() => onPageChange && onPageChange(1)}
                  disabled={currentPage === 1 || isLogsLoading}
                  title="First Page"
                  style={{
                    padding: "5px 8px",
                    fontSize: 12,
                    borderRadius: 6,
                    border: "1px solid var(--border)",
                    background: "var(--surface-2)",
                    color: currentPage === 1 ? "var(--text-faint)" : "var(--text)",
                    cursor: currentPage === 1 ? "not-allowed" : "pointer",
                    opacity: currentPage === 1 ? 0.4 : 1,
                    display: "inline-flex",
                    alignItems: "center"
                  }}
                >
                  <Icon name="chevrons-left" size={13} />
                </button>
              )}

              {/* Prev */}
              <button
                type="button"
                onClick={() => onPageChange && onPageChange(Math.max(1, currentPage - 1))}
                disabled={currentPage === 1 || isLogsLoading}
                style={{
                  display: "inline-flex",
                  alignItems: "center",
                  gap: 4,
                  padding: "5px 10px",
                  fontSize: 12,
                  fontWeight: 600,
                  borderRadius: 6,
                  border: "1px solid var(--border)",
                  background: "var(--surface-2)",
                  color: currentPage === 1 ? "var(--text-faint)" : "var(--text)",
                  cursor: currentPage === 1 ? "not-allowed" : "pointer",
                  opacity: currentPage === 1 ? 0.4 : 1
                }}
              >
                <Icon name="chevron-left" size={13} /> Prev
              </button>

              {/* Page pills */}
              {pageItems.map((p, idx) => {
                if (p === "...") {
                  return (
                    <span
                      key={"dots-" + idx}
                      style={{ padding: "0 6px", color: "var(--text-faint)", fontSize: 13, userSelect: "none" }}
                    >
                      ...
                    </span>
                  );
                }
                const isActive = p === currentPage;
                return (
                  <button
                    key={p}
                    type="button"
                    onClick={() => onPageChange && onPageChange(p)}
                    disabled={isLogsLoading}
                    style={{
                      minWidth: 30,
                      height: 28,
                      padding: "0 7px",
                      fontSize: 12,
                      fontWeight: isActive ? 700 : 500,
                      borderRadius: 6,
                      border: isActive ? "1px solid var(--primary)" : "1px solid var(--border)",
                      background: isActive ? "var(--primary)" : "var(--surface-2)",
                      color: isActive ? "#ffffff" : "var(--text)",
                      cursor: "pointer",
                      transition: "all 0.15s ease"
                    }}
                  >
                    {p}
                  </button>
                );
              })}

              {/* Next */}
              <button
                type="button"
                onClick={() => onPageChange && onPageChange(Math.min(totalPages, currentPage + 1))}
                disabled={currentPage === totalPages || isLogsLoading}
                style={{
                  display: "inline-flex",
                  alignItems: "center",
                  gap: 4,
                  padding: "5px 10px",
                  fontSize: 12,
                  fontWeight: 600,
                  borderRadius: 6,
                  border: "1px solid var(--border)",
                  background: "var(--surface-2)",
                  color: currentPage === totalPages ? "var(--text-faint)" : "var(--text)",
                  cursor: currentPage === totalPages ? "not-allowed" : "pointer",
                  opacity: currentPage === totalPages ? 0.4 : 1
                }}
              >
                Next <Icon name="chevron-right" size={13} />
              </button>

              {/* Last page */}
              {totalPages > 5 && (
                <button
                  type="button"
                  onClick={() => onPageChange && onPageChange(totalPages)}
                  disabled={currentPage === totalPages || isLogsLoading}
                  title="Last Page"
                  style={{
                    padding: "5px 8px",
                    fontSize: 12,
                    borderRadius: 6,
                    border: "1px solid var(--border)",
                    background: "var(--surface-2)",
                    color: currentPage === totalPages ? "var(--text-faint)" : "var(--text)",
                    cursor: currentPage === totalPages ? "not-allowed" : "pointer",
                    opacity: currentPage === totalPages ? 0.4 : 1,
                    display: "inline-flex",
                    alignItems: "center"
                  }}
                >
                  <Icon name="chevrons-right" size={13} />
                </button>
              )}

              {/* Jump to page */}
              {totalPages > 5 && (
                <form
                  onSubmit={handleJump}
                  style={{ display: "inline-flex", alignItems: "center", gap: 4, marginLeft: 6 }}
                >
                  <span style={{ fontSize: 11.5, color: "var(--text-faint)" }}>Go:</span>
                  <input
                    type="number"
                    min="1"
                    max={totalPages}
                    value={jumpPage}
                    onChange={e => setJumpPage(e.target.value)}
                    placeholder="#"
                    style={{
                      width: 42,
                      height: 28,
                      padding: "0 4px",
                      borderRadius: 6,
                      border: "1px solid var(--border)",
                      background: "var(--surface-2)",
                      color: "var(--text)",
                      fontSize: 11.5,
                      textAlign: "center"
                    }}
                  />
                </form>
              )}
            </div>
          </div>
        )}

      </div>

    </div>
  );
}

function AttendancePage({attendance, departments, selectedDate, onDateChange, isLoading = false}){
  const [status, setStatus] = useState("all");
  const [dept, setDept] = useState("all");
  const dateInputRef = useRef(null);

  const todayStr = useMemo(() => new Date().toISOString().slice(0, 10), []);
  const isToday = selectedDate === todayStr;

  const stepDate = (offsetDays) => {
    try {
      const parts = selectedDate.split("-").map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2] + offsetDays);
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      onDateChange(`${y}-${m}-${day}`);
    } catch (e) {
      console.error("Error stepping date:", e);
    }
  };

  const formattedDate = useMemo(() => {
    try {
      const parts = selectedDate.split("-").map(Number);
      const d = new Date(parts[0], parts[1] - 1, parts[2]);
      return d.toLocaleDateString(undefined, {
        weekday: "short",
        day: "numeric",
        month: "short",
        year: "numeric"
      });
    } catch (e) {
      return selectedDate;
    }
  }, [selectedDate]);

  const openCalendar = () => {
    if (dateInputRef.current) {
      if (typeof dateInputRef.current.showPicker === "function") {
        try {
          dateInputRef.current.showPicker();
          return;
        } catch (e) {}
      }
      dateInputRef.current.focus();
    }
  };

  const rows = attendance.filter(a => {
    let s = "absent";
    if (a.first_in) {
      const t = new Date(a.first_in).toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
      s = t > "09:45" ? "late" : "present";
    }
    return (status === "all" || s === status) && (dept === "all" || a.department === dept);
  });

  const handleExportCSV = () => {
    if (!rows || rows.length === 0) {
      alert("No attendance records to export.");
      return;
    }
    const headers = ["Employee ID", "Employee Name", "Department", "Date", "Check-In", "Check-Out", "Work Hours", "Status"];
    const csvLines = [headers.join(",")];

    rows.forEach(a => {
      const inTime = a.first_in ? new Date(a.first_in).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "--";
      const outTime = a.last_out ? new Date(a.last_out).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) : "--";
      let s = "Absent";
      if (a.first_in) {
        const t = new Date(a.first_in).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });
        s = t > "09:45" ? "Late" : "Present";
      }
      const line = [
        `"${a.employee_code || ""}"`,
        `"${a.full_name || ""}"`,
        `"${a.department || ""}"`,
        `"${selectedDate || ""}"`,
        `"${inTime}"`,
        `"${outTime}"`,
        `"${a.hours ? a.hours + 'h' : '--'}"`,
        `"${s}"`
      ];
      csvLines.push(line.join(","));
    });

    const blob = new Blob([csvLines.join("\n")], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");
    link.href = url;
    link.setAttribute("download", `attendance_report_${selectedDate || "export"}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(url);
  };

  return (
    <Card style={{padding:0}}>
      {/* Printable Official Report Header (Only visible on paper / PDF print) */}
      <div className="print-only" style={{ padding: "0 0 16px 0", marginBottom: 12 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", borderBottom: "2px solid #111827", paddingBottom: 10 }}>
          <div>
            <div style={{ fontSize: 18, fontWeight: 800, color: "#111827", letterSpacing: -0.3 }}>
              ATTENDANCE &amp; ACCESS CONTROL REPORT
            </div>
            <div style={{ fontSize: 12, color: "#4b5563", marginTop: 2, fontWeight: 600 }}>
              Official Daily Verification Record
            </div>
          </div>
          <div style={{ textAlign: "right", fontSize: 10.5, color: "#4b5563", lineHeight: 1.4 }}>
            <div><strong>Report Date:</strong> {selectedDate}</div>
            <div><strong>Department:</strong> {dept === "all" ? "All Departments" : dept}</div>
            <div><strong>Status Filter:</strong> {status === "all" ? "All Statuses" : status.toUpperCase()}</div>
            <div><strong>Generated:</strong> {new Date().toLocaleString()}</div>
          </div>
        </div>

        {/* Report Summary Bar for Print */}
