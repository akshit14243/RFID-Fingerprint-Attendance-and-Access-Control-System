function UnlockDeleteModal({ isOpen, onClose, onUnlock, token }) {
  const [password, setPassword] = useState("");
  const [showPassword, setShowPassword] = useState(false);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  if (!isOpen) return null;

  const handleSubmit = async (e) => {
    e.preventDefault();
    if (!password.trim()) {
      setErr("Master security password is required");
      return;
    }
    setLoading(true);
    setErr("");
    try {
      const res = await apiCall("/api/verify-delete-password", "POST", { password: password.trim() }, token);
      if (res && res.success) {
        onUnlock(password.trim());
      } else {
        setErr(res?.message || "Invalid security password");
      }
    } catch (error) {
      setErr(error.message || "Invalid master security password");
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal-box" style={{maxWidth: 440}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
          <div style={{display:"flex", alignItems:"center", gap:8}}>
            <div style={{width:32, height:32, borderRadius:8, background:"var(--rose-bg)", color:"var(--rose)", display:"flex", alignItems:"center", justifyContent:"center"}}>
              <Icon name="lock" size={18}/>
            </div>
            <div>
              <div style={{fontSize:15.5, fontWeight:700}}>Security Authorization</div>
              <div style={{fontSize:11.5, color:"var(--text-dim)"}}>Permanent Deletion Protection</div>
            </div>
          </div>
          <button onClick={onClose} style={{background:"none", border:"none", cursor:"pointer", color:"var(--text-dim)"}}><Icon name="x" size={18}/></button>
        </div>

        <form onSubmit={handleSubmit} style={{display:"flex", flexDirection:"column", gap:14}}>
          <div style={{fontSize:12.5, color:"var(--text-dim)", lineHeight:1.5}}>
            Employee deletion is locked by default to prevent accidental data loss. Enter the master security password to reveal permanent deletion controls.
          </div>

          {err && (
            <div style={{color:"var(--rose)", background:"var(--rose-bg)", border:"1px solid var(--rose)", padding:"8px 12px", borderRadius:8, fontSize:12}}>
              {err}
            </div>
          )}

          <div>
            <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:5, fontWeight:600}}>Master Security Password</label>
            <div style={{position:"relative"}}>
              <input
                type={showPassword ? "text" : "password"}
                autoFocus
                placeholder="Enter deletion password..."
                value={password}
                onChange={e => { setPassword(e.target.value); setErr(""); }}
                style={{width:"100%", padding:"9px 36px 9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}
              />
              <button
                type="button"
                onClick={() => setShowPassword(!showPassword)}
                style={{position:"absolute", right:10, top:9, background:"none", border:"none", cursor:"pointer", color:"var(--text-dim)"}}
              >
                <Icon name={showPassword ? "eye-off" : "eye"} size={16}/>
              </button>
            </div>
          </div>

          <div style={{display:"flex", justifyContent:"flex-end", gap:8, marginTop:6}}>
            <Button variant="ghost" onClick={onClose}>Cancel</Button>
            <Button variant="danger" type="submit" disabled={loading} style={{background:"var(--rose)", color:"#fff"}}>
              {loading ? <><Icon name="loader" size={14}/> Verifying...</> : <><Icon name="unlock" size={14}/> Unlock Deletion</>}
            </Button>
          </div>
        </form>
      </div>
    </div>
  );
}

function PermanentDeleteModal({ emp, isOpen, onClose, onConfirm, defaultPassword="", token }) {
  const [password, setPassword] = useState(defaultPassword);
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  useEffect(() => {
    if (isOpen) {
      setPassword(defaultPassword);
      setErr("");
      setLoading(false);
    }
  }, [isOpen, defaultPassword]);

  if (!isOpen || !emp) return null;

  const handleDelete = async (e) => {
    e.preventDefault();
    if (!password.trim()) {
      setErr("Master security password is required to confirm deletion");
      return;
    }
    setLoading(true);
    setErr("");
    try {
      await onConfirm(emp, password.trim());
      onClose();
    } catch (error) {
      setErr(error.message || "Failed to permanently delete employee");
      setLoading(false);
    }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal-box" style={{maxWidth: 480}}>
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
          <div style={{display:"flex", alignItems:"center", gap:8}}>
            <div style={{width:32, height:32, borderRadius:8, background:"var(--rose-bg)", color:"var(--rose)", display:"flex", alignItems:"center", justifyContent:"center"}}>
              <Icon name="alert-triangle" size={18}/>
            </div>
            <div>
              <div style={{fontSize:16, fontWeight:700, color:"var(--rose)"}}>Permanent Employee Deletion</div>
              <div style={{fontSize:11.5, color:"var(--text-dim)"}}>Irreversible Credential & Record Wipe</div>
            </div>
          </div>
          <button onClick={onClose} style={{background:"none", border:"none", cursor:"pointer", color:"var(--text-dim)"}}><Icon name="x" size={18}/></button>
        </div>

        <form onSubmit={handleDelete} style={{display:"flex", flexDirection:"column", gap:14}}>
          <div style={{
            background:"var(--rose-bg)", border:"1px solid var(--rose)",
            padding:"10px 14px", borderRadius:8, fontSize:12.5, color:"var(--text)", lineHeight:1.5
          }}>
            <strong>Warning:</strong> You are about to permanently delete <strong>{emp.full_name}</strong> (<span className="mono">{emp.employee_code}</span>). All biometric templates, RFID cards, and access permissions will be completely purged from hardware & database.
          </div>

          <div style={{background:"var(--surface-2)", border:"1px solid var(--border)", borderRadius:8, padding:"10px 14px", fontSize:12}}>
            <div style={{fontWeight:600, marginBottom:6, color:"var(--text-dim)"}}>DATA THAT WILL BE PURGED:</div>
            <div style={{display:"flex", flexDirection:"column", gap:4}}>
              <div style={{display:"flex", alignItems:"center", gap:6, color:"var(--rose)"}}>
                <Icon name="x" size={13}/> RFID Card UID: <span className="mono">{emp.card_uid || "None assigned"}</span>
              </div>
              <div style={{display:"flex", alignItems:"center", gap:6, color:"var(--rose)"}}>
                <Icon name="x" size={13}/> Fingerprint Biometric Slot: <span className="mono">{emp.fingerprint_slot != null ? `Slot #${emp.fingerprint_slot}` : "None"}</span>
              </div>
              <div style={{display:"flex", alignItems:"center", gap:6, color:"var(--rose)"}}>
                <Icon name="x" size={13}/> Physical template files on server & sensor command queue
              </div>
              <div style={{display:"flex", alignItems:"center", gap:6, color:"var(--rose)"}}>
                <Icon name="x" size={13}/> Employee profile and attendance logs
              </div>
            </div>
          </div>

          {err && (
            <div style={{color:"var(--rose)", background:"var(--rose-bg)", border:"1px solid var(--rose)", padding:"8px 12px", borderRadius:8, fontSize:12}}>
              {err}
            </div>
          )}

          <div>
            <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4, fontWeight:600}}>
              Confirm Security Password
            </label>
            <input
              type="password"
              placeholder="Enter master password to confirm..."
              value={password}
              onChange={e => { setPassword(e.target.value); setErr(""); }}
              style={{width:"100%", padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}
            />
          </div>

          <div style={{display:"flex", justifyContent:"flex-end", gap:8, marginTop:6}}>
            <Button variant="ghost" onClick={onClose}>Cancel</Button>
            <Button variant="danger" type="submit" disabled={loading} style={{background:"var(--rose)", color:"#fff"}}>
              {loading ? <><Icon name="loader" size={14}/> Deleting...</> : <><Icon name="trash" size={14}/> Permanently Delete All Data</>}
            </Button>
          </div>
        </form>
      </div>
    </div>
  );
}

function AddEmployeeModal({isOpen, onClose, onSaved, departments=[], devices=[], token=""}){
  const [step, setStep] = useState(1); // 1: Details, 2: Device, 3: NFC Tap, 4: Fingerprint, 5: Sync
  const [code, setCode] = useState("");
  const [name, setName] = useState("");
  const [dept, setDept] = useState("Engineering");
  const [type, setType] = useState("EMPLOYEE");
  const [email, setEmail] = useState("");
  const [selectedDeviceId, setSelectedDeviceId] = useState("");
  
  const [jobId, setJobId] = useState(null);
  const [fingerprintId, setFingerprintId] = useState(null);
  const [cardUid, setCardUid] = useState("");
  const [fingerPass, setFingerPass] = useState(0); // 0: none, 1: first pass, 2: second pass
  const [syncProgress, setSyncProgress] = useState(0);
  const [syncDevices, setSyncDevices] = useState([]);
  const [syncSummary, setSyncSummary] = useState({ total: 1, completed: 0, all_synced: false });
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  const [isTimedOut, setIsTimedOut] = useState(false);
  const [timeoutReason, setTimeoutReason] = useState("");
  const [timeLeft, setTimeLeft] = useState(30);

  // Set default department and device when modal opens
  useEffect(() => {
    if (isOpen) {
      setStep(1);
      setCode("");
      setName("");
      setEmail("");
      setJobId(null);
      setFingerprintId(null);
      setCardUid("");
      setFingerPass(0);
      setSyncProgress(0);
      setSyncDevices([]);
      setSyncSummary({ total: 1, completed: 0, all_synced: false });
      setLoading(false);
      setErr("");
      setIsTimedOut(false);
      setTimeoutReason("");
      setTimeLeft(30);
      if (departments && departments.length > 0) {
        setDept(departments[0].name || departments[0] || "Engineering");
      }
      if (devices && devices.length > 0) {
        const onlineHrDev = devices.find(d => d.online === true && ((d.device_key || "").toUpperCase().includes("HR") || (d.device_label || "").toUpperCase().includes("HR")));
        const anyOnlineDev = onlineHrDev || devices.find(d => d.online === true);
        const fallbackDev = anyOnlineDev || devices[0];
        setSelectedDeviceId(fallbackDev.id);
      }
    }
  }, [isOpen, departments, devices]);

  // Selected device and online status
  const selectedDev = (devices || []).find(d => String(d.id) === String(selectedDeviceId)) || (devices && devices[0]);
  const isSelectedOnline = selectedDev ? (selectedDev.online === true) : false;

  // Polling for hardware updates during active enrollment job
  useEffect(() => {
    if (!isOpen || !jobId || step < 3 || step > 4 || isTimedOut) return;
    const interval = setInterval(async () => {
      try {
        const res = await apiCall(`/api/enrollment/status/${jobId}`, "GET", null, token);
        if (res && (res.job || res.status)) {
          const j = res.job || res;

          // Detect hardware failure, timeout, cancellation or reversion to standby
          if (
            j.status === "FAILED" ||
            j.status === "TIMEOUT" ||
            j.status === "CANCELLED" ||
            j.step === "FAILED" ||
            j.step === "TIMEOUT"
          ) {
            setIsTimedOut(true);
            setTimeoutReason(
              j.error_message ||
              "Hardware enrollment session timed out or terminal returned to standby access control state."
            );
            return;
          }

          if (j.card_uid && !cardUid) {
            setCardUid(j.card_uid);
          }
          if ((j.step === "CARD_TAPPED" || j.card_uid) && step === 3) {
            setCardUid(j.card_uid || cardUid);
            setTimeLeft(30);
            setTimeout(() => setStep(4), 900);
          } else if (j.step === "FINGER_1" && fingerPass < 1) {
            setFingerPass(1);
            setTimeLeft(30);
          } else if ((j.step === "FINGER_2" || j.step === "SYNCING" || j.step === "COMPLETED") && step === 4) {
            setFingerPass(2);
            setTimeout(() => setStep(5), 900);
          }
        }
      } catch(e) {}
    }, 900);
    return () => clearInterval(interval);
  }, [isOpen, jobId, step, cardUid, fingerPass, token, isTimedOut]);

  // Live hardware countdown timer (30s window per step)
  useEffect(() => {
    if (!isOpen || isTimedOut || loading || (step !== 3 && step !== 4)) return;
    const timer = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          setIsTimedOut(true);
          setTimeoutReason("Hardware enrollment timed out. Terminal returned to standby state.");
          if (jobId) {
            apiCall("/api/enrollment/step", "POST", { job_id: jobId, step: "TIMEOUT" }, token).catch(()=>{});
          }
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(timer);
  }, [isOpen, isTimedOut, loading, step, jobId, token]);

  // Live DownChar multi-device sync in Step 5
  useEffect(() => {
    if (!isOpen || step !== 5 || !jobId) return;

    // Trigger generation of DownChar sync jobs for other devices
    apiCall(`/api/enrollment/${jobId}/sync-devices`, "POST", {}, token).catch(() => {});

    // Ensure credentials committed on server
    apiCall("/api/enrollment/step", "POST", { job_id: jobId, step: "COMPLETED", card_uid: cardUid }, token).catch(() => {});

    const pollSync = async () => {
      try {
        const res = await apiCall(`/api/enrollment/${jobId}/sync-devices`, "GET", null, token);
        if (res && res.devices) {
          setSyncDevices(res.devices);
          setSyncSummary({
            total: res.total_devices || 1,
            completed: res.completed_devices || 0,
            all_synced: res.all_synced || false,
          });
          const pct = res.all_synced
            ? 100
            : Math.min(95, Math.max(35, Math.round(((res.completed_devices || 1) / Math.max(res.total_devices || 1, 1)) * 100)));
          setSyncProgress(pct);
        }
      } catch (e) {}
    };

    pollSync();
    const interval = setInterval(pollSync, 1200);
    return () => clearInterval(interval);
  }, [isOpen, step, jobId, cardUid, token]);

  if (!isOpen) return null;

  // Step 1 -> Step 2
  const goToDeviceSelection = (e) => {
    e.preventDefault();
    if (!code.trim() || !name.trim()) {
      setErr("Employee Code and Full Name are required");
      return;
    }
    setErr("");
    setStep(2);
  };

  // Step 2 -> Step 3 (Starts job on backend)
  const startEnrollmentJob = async () => {
    if (!isSelectedOnline) {
      setErr(`Cannot proceed: Terminal '${selectedDev?.device_label || selectedDev?.device_key || "Reader"}' is offline. Please power on the HR terminal.`);
      return;
    }
    setLoading(true);
    setErr("");
    setIsTimedOut(false);
    setTimeoutReason("");
    setTimeLeft(30);
    try {
      const data = await apiCall(
        "/api/enrollment/start",
        "POST",
        {
          code: code.trim(),
          name: name.trim(),
          dept: dept.trim(),
          type,
          email: email.trim() || null,
          device_id: selectedDeviceId || (devices[0]?.id || 1),
        },
        token
      );
      setJobId(data.job_id);
      setFingerprintId(data.fingerprint_id);
      setStep(3);
    } catch(err) {
      setErr(err.message || "Failed to start enrollment job");
    } finally {
      setLoading(false);
    }
  };

  const handleCancelAndClose = () => {
    if (jobId && (step === 3 || step === 4) && !isTimedOut) {
      apiCall("/api/enrollment/cancel", "POST", { job_id: jobId }, token).catch(()=>{});
    }
    setIsTimedOut(false);
    onClose();
  };

  const handleRetryEnrollment = async () => {
    setIsTimedOut(false);
    setTimeoutReason("");
    setCardUid("");
    setFingerPass(0);
    setTimeLeft(30);
    await startEnrollmentJob();
  };

  const handleFinish = () => {
    if (onSaved) onSaved();
    onClose();
  };

  const stepLabels = [
    { num: 1, label: "Details" },
    { num: 2, label: "Device" },
    { num: 3, label: "NFC Tap" },
    { num: 4, label: "Fingerprint" },
    { num: 5, label: "Sync" },
  ];

  return (
    <div className="modal-backdrop">
      <div className="modal-box modal-box-large" style={{maxWidth:560}}>
        {/* Header with Title and Close */}
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
          <div style={{display:"flex", alignItems:"center", gap:8}}>
            <div style={{width:28, height:28, borderRadius:7, background:"var(--primary-dim)", color:"var(--primary)", display:"flex", alignItems:"center", justifyContent:"center"}}>
              <Icon name={step === 3 ? "nfc" : (step === 4 ? "fingerprint" : (step === 5 ? "check-circle" : "users"))} size={16}/>
            </div>
            <div>
              <div style={{fontSize:16, fontWeight:700}}>Employee Registration & Onboarding</div>
              <div style={{fontSize:11.5, color:"var(--text-dim)"}}>Identity & Biometric Credential Provisioning</div>
            </div>
          </div>
          <button onClick={handleCancelAndClose} style={{background:"none", border:"none", cursor:"pointer", color:"var(--text-dim)"}}><Icon name="x" size={18}/></button>
        </div>

        {/* Multi-Step Stepper Progress Bar */}
        <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", margin:"16px 0 20px 0", position:"relative"}}>
          <div style={{position:"absolute", top:14, left:24, right:24, height:2, background:"var(--border)", zIndex:0}} />
          <div style={{position:"absolute", top:14, left:24, width:`${((step - 1) / 4) * 88}%`, height:2, background: isTimedOut ? "var(--rose)" : "var(--teal)", transition:"width .3s ease", zIndex:1}} />
          {stepLabels.map((s) => {
            const isDone = s.num < step;
            const isCurrent = s.num === step;
            return (
              <div key={s.num} style={{display:"flex", flexDirection:"column", alignItems:"center", gap:4, zIndex:2}}>
                <div style={{
                  width:28, height:28, borderRadius:99, display:"flex", alignItems:"center", justifyContent:"center",
                  fontSize:12, fontWeight:700,
                  background: isCurrent && isTimedOut ? "var(--rose)" : (isDone ? "var(--teal)" : (isCurrent ? "var(--primary)" : "var(--surface-2)")),
                  color: (isDone || isCurrent) ? "#fff" : "var(--text-dim)",
                  border: isCurrent ? (isTimedOut ? "2px solid var(--rose)" : "2px solid var(--primary)") : (isDone ? "none" : "1px solid var(--border)"),
                  boxShadow: isCurrent ? (isTimedOut ? "0 0 10px rgba(244,63,94,0.4)" : "0 0 10px rgba(76,111,255,0.4)") : "none",
                  transition:"all .2s ease"
                }}>
                  {isCurrent && isTimedOut ? <Icon name="x" size={13}/> : (isDone ? <Icon name="check" size={13}/> : s.num)}
                </div>
                <span style={{fontSize:11, fontWeight: isCurrent ? 600 : 500, color: isCurrent ? (isTimedOut ? "var(--rose)" : "var(--text)") : "var(--text-faint)"}}>
                  {s.label}
                </span>
              </div>
            );
          })}
        </div>

        {err && (
          <div style={{color:"var(--rose)", background:"var(--rose-bg)", border:"1px solid var(--rose)", padding:"8px 12px", borderRadius:8, fontSize:12.5, marginBottom:14}}>
            {err}
          </div>
        )}

        {/* STEP 1: Basic Details */}
        {step === 1 && (
          <form onSubmit={goToDeviceSelection} style={{display:"flex", flexDirection:"column", gap:12}}>
            <div>
              <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Employee Code <span style={{color:"var(--rose)"}}>*</span></label>
              <input required placeholder="EMP-001" value={code} onChange={e=>setCode(e.target.value)}
                style={{width:"100%", padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}} />
            </div>
            <div>
              <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Full Name <span style={{color:"var(--rose)"}}>*</span></label>
              <input required placeholder="Name" value={name} onChange={e=>setName(e.target.value)}
                style={{width:"100%", padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}} />
            </div>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
              <div>
                <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Department</label>
                <select value={dept} onChange={e=>setDept(e.target.value)}
                  style={{width:"100%", padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}>
                  {(departments.length > 0 ? departments : ["Engineering", "HR", "Sales", "Operations"]).map((d, i) => {
                    const val = d.name || d;
                    return <option key={i} value={val}>{val}</option>;
                  })}
                </select>
              </div>
              <div>
                <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Person Type</label>
                <select value={type} onChange={e=>setType(e.target.value)}
                  style={{width:"100%", padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}>
                  <option value="EMPLOYEE">Employee</option>
                  <option value="CONTRACTOR">Contractor</option>
                  <option value="VISITOR">Visitor</option>
                </select>
              </div>
            </div>
            <div>
              <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Email (optional)</label>
              <input type="email" placeholder="name@company.com" value={email} onChange={e=>setEmail(e.target.value)}
                style={{width:"100%", padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}} />
            </div>

            <div style={{background:"var(--surface-2)", border:"1px dashed var(--border)", borderRadius:8, padding:"10px 14px", marginTop:4}}>
              <div style={{display:"flex", alignItems:"center", gap:8, fontSize:12, color:"var(--text-dim)"}}>
                <Icon name="nfc" size={16}/>
                <span>RFID UID & Fingerprint slot will be captured live from the HR terminal in the next steps.</span>
              </div>
            </div>

            <div style={{display:"flex", justifyContent:"flex-end", gap:8, marginTop:12}}>
              <Button variant="ghost" onClick={onClose}>Cancel</Button>
              <Button variant="primary" type="submit">
                Next <Icon name="arrow-right" size={14}/>
              </Button>
            </div>
          </form>
        )}

        {/* STEP 2: Device Selection & Connection */}
        {step === 2 && (
          <div style={{display:"flex", flexDirection:"column", gap:14}}>
            <div style={{fontSize:13, color:"var(--text-dim)"}}>
              Select the designated enrollment terminal (ESP32) for credential provisioning:
            </div>

            <div style={{display:"flex", flexDirection:"column", gap:8, maxHeight:220, overflowY:"auto"}}>
              {devices && devices.length > 0 ? (
                devices.map((d) => {
                  const isSelected = String(selectedDeviceId) === String(d.id);
                  const isOnline = d.online === true;
                  return (
                    <div
                      key={d.id}
                      onClick={() => { setSelectedDeviceId(d.id); setErr(""); }}
                      style={{
                        display:"flex", justifyContent:"space-between", alignItems:"center",
                        padding:"12px 16px", borderRadius:10, cursor:"pointer",
                        border: isSelected ? (isOnline ? "2px solid var(--primary)" : "2px solid var(--rose)") : "1px solid var(--border)",
                        background: isSelected ? (isOnline ? "var(--primary-dim)" : "var(--rose-bg)") : "var(--surface-2)",
                        opacity: isOnline ? 1 : 0.65,
                        transition:"all .15s ease"
                      }}
                    >
                      <div style={{display:"flex", alignItems:"center", gap:12}}>
                        <div style={{
                          width:36, height:36, borderRadius:8,
                          background: isSelected ? (isOnline ? "var(--primary)" : "var(--rose)") : "var(--surface)",
                          color: isSelected ? "#fff" : (isOnline ? "var(--primary)" : "var(--rose)"),
                          display:"flex", alignItems:"center", justifyContent:"center"
                        }}>
                          <Icon name="cpu" size={18}/>
                        </div>
                        <div>
                          <div style={{fontWeight:600, fontSize:13.5, color:"var(--text)"}}>{d.device_label || d.device_key}</div>
                          <div style={{fontSize:11.5, color:"var(--text-dim)"}}>
                            <span className="mono">{d.device_key}</span> • {d.room_name || "Access Point"}
                          </div>
                        </div>
                      </div>
                      <div style={{display:"flex", alignItems:"center", gap:8}}>
                        <span style={{
                          display:"inline-flex", alignItems:"center", gap:5, fontSize:11, fontWeight:600,
                          padding:"3px 8px", borderRadius:99,
                          background: isOnline ? "var(--teal-bg)" : "var(--rose-bg)",
                          color: isOnline ? "var(--teal)" : "var(--rose)"
                        }}>
                          <span style={{width:6, height:6, borderRadius:99, background: isOnline ? "var(--teal)" : "var(--rose)"}}/>
                          {isOnline ? "Online" : "Offline"}
                        </span>
                        {isSelected && <Icon name="check" size={16}/>}
                      </div>
                    </div>
                  );
                })
              ) : (
                <div style={{padding:"24px 16px", textAlign:"center", color:"var(--text-dim)", fontSize:13, background:"var(--surface-2)", borderRadius:10}}>
                  No hardware terminals detected. Please verify ESP32 network connection.
                </div>
              )}
            </div>

            {!isSelectedOnline && (
              <div style={{
                display:"flex", alignItems:"center", gap:8, fontSize:12.5,
                color:"var(--rose)", background:"var(--rose-bg)", border:"1px solid var(--rose)",
                padding:"9px 14px", borderRadius:8
              }}>
                <Icon name="x" size={15}/>
                <span>Device is offline. Please power on the enrollment terminal or verify its network connection to proceed.</span>
              </div>
            )}

            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:10}}>
              <Button variant="ghost" onClick={() => { setErr(""); setStep(1); }}>
                <span style={{transform:"rotate(180deg)", display:"inline-flex"}}><Icon name="arrow-right" size={14}/></span> Back
              </Button>
              <Button variant="primary" onClick={startEnrollmentJob} disabled={loading || !isSelectedOnline}>
                {loading ? <><Icon name="loader" size={14}/> Connecting...</> : <>Connect & Start Enrollment <Icon name="arrow-right" size={14}/></>}
              </Button>
            </div>
          </div>
        )}

        {/* TIMED OUT / INVALID SESSION SCREEN */}
        {isTimedOut && (
          <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:16, padding:"8px 0", textAlign:"center"}}>
            <div style={{
              width:64, height:64, borderRadius:99,
              background:"var(--rose-bg)", color:"var(--rose)", border:"2px solid var(--rose)",
              display:"flex", alignItems:"center", justifyContent:"center"
            }}>
              <Icon name="alert-triangle" size={32}/>
            </div>

            <div>
              <div style={{
                display:"inline-block", background:"var(--rose-bg)", color:"var(--rose)",
                border:"1px solid var(--rose)", padding:"3px 12px", borderRadius:99,
                fontSize:11, fontWeight:700, letterSpacing:0.5, marginBottom:8
              }}>
                ENROLLMENT INVALID / NOT APPLICABLE
              </div>
              <div style={{fontSize:17, fontWeight:700, color:"var(--text)"}}>
                Hardware Enrollment Session Expired
              </div>
              <div style={{fontSize:12.5, color:"var(--text-dim)", marginTop:4, maxWidth:440, lineHeight:1.5}}>
                {timeoutReason || "The hardware reader timed out waiting for input and reverted to its default standby state. No biometric or NFC credentials were saved."}
              </div>
            </div>

            {/* Information card */}
            <div style={{
              width:"100%", background:"var(--surface-2)", border:"1px solid var(--border)",
              borderRadius:10, padding:"12px 16px", textAlign:"left", fontSize:12.5,
              display:"grid", gridTemplateColumns:"1fr 1fr", gap:10
            }}>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:11}}>EMPLOYEE</span>
                <span style={{fontWeight:600}}>{code} — {name}</span>
              </div>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:11}}>DEPARTMENT</span>
                <span style={{fontWeight:600}}>{dept}</span>
              </div>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:11}}>HARDWARE STATUS</span>
                <span style={{fontWeight:600, color:"var(--rose)"}}>Standby (Normal Access Mode)</span>
              </div>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:11}}>TERMINAL</span>
                <span style={{fontWeight:600}}>{selectedDev?.device_label || selectedDev?.device_key || "Reader"}</span>
              </div>
            </div>

            {/* Action buttons */}
            <div style={{display:"flex", gap:10, width:"100%", marginTop:8}}>
              <Button variant="ghost" onClick={handleCancelAndClose} style={{flex:1, justifyContent:"center"}}>
                <Icon name="x" size={14}/> Cancel & Close
              </Button>
              <Button variant="secondary" onClick={() => { setIsTimedOut(false); setStep(2); }} style={{flex:1, justifyContent:"center"}}>
                Change Device
              </Button>
              <Button variant="primary" onClick={handleRetryEnrollment} disabled={loading} style={{flex:1.2, justifyContent:"center"}}>
                {loading ? <><Icon name="loader" size={14}/> Starting...</> : <><Icon name="refresh" size={14}/> Retry Enrollment</>}
              </Button>
            </div>
          </div>
        )}

        {/* STEP 3: NFC Card Tap */}
        {step === 3 && !isTimedOut && (
          <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:16, padding:"8px 0"}}>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:16, fontWeight:700}}>Tap Employee NFC Card</div>
              <div style={{fontSize:12.5, color:"var(--text-dim)", marginTop:2}}>
                Place the NFC smart card on the HR device reader
              </div>
            </div>

            {/* Glowing NFC Card Visual */}
            <div
              className={cardUid ? "nfc-card-success" : "nfc-card-glow"}
              style={{
                width:260, height:160, borderRadius:16,
                background: cardUid
                  ? "linear-gradient(135deg, #0e2e2a 0%, #0f4f46 100%)"
                  : "linear-gradient(135deg, #1e293b 0%, #0f172a 100%)",
                border: cardUid ? "2px solid var(--teal)" : "2px solid var(--primary)",
                padding:18, display:"flex", flexDirection:"column", justifyContent:"space-between",
                position:"relative", overflow:"hidden", transition:"all .4s ease"
              }}
            >
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                <div style={{width:32, height:24, borderRadius:4, background:"#d97706", opacity:0.8}} />
                <Icon name="nfc" size={26}/>
              </div>

              <div style={{textAlign:"center", margin:"10px 0"}}>
                {cardUid ? (
                  <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:4}}>
                    <div style={{color:"var(--teal)", display:"flex", alignItems:"center", gap:6, fontWeight:700, fontSize:13}}>
                      <Icon name="check-circle" size={16}/> CARD CAPTURED
                    </div>
                    <div className="mono" style={{fontSize:18, fontWeight:700, color:"#fff", letterSpacing:1}}>
                      {cardUid}
                    </div>
                  </div>
                ) : (
                  <div style={{fontSize:13, fontWeight:600, color:"var(--text-dim)", letterSpacing:0.5}}>
                    READY TO SCAN
                  </div>
                )}
              </div>

              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", fontSize:11, color:"var(--text-faint)"}}>
                <span>{name || "EMPLOYEE"}</span>
                <span className="mono">{code || "EMP-001"}</span>
              </div>
            </div>

            {/* Status indicator */}
            <div style={{
              display:"inline-flex", alignItems:"center", gap:8, fontSize:12.5, fontWeight:600,
              padding:"6px 14px", borderRadius:99,
              background: cardUid ? "var(--teal-bg)" : "var(--primary-dim)",
              color: cardUid ? "var(--teal)" : "var(--primary)"
            }}>
              {cardUid ? (
                <><Icon name="check" size={14}/> NFC Card Registered: <span className="mono">{cardUid}</span></>
              ) : (
                <><span className="spin-slow" style={{display:"inline-flex"}}><Icon name="loader" size={14}/></span> Waiting for NFC Card Tap on terminal...</>
              )}
            </div>

            {/* Countdown indicator */}
            {!cardUid && (
              <div style={{
                display:"flex", alignItems:"center", gap:6, fontSize:11.5,
                color: timeLeft <= 10 ? "var(--rose)" : "var(--text-dim)",
                background: timeLeft <= 10 ? "var(--rose-bg)" : "var(--surface-2)",
                padding:"4px 12px", borderRadius:99,
                border: `1px solid ${timeLeft <= 10 ? "var(--rose)" : "var(--border)"}`,
                transition:"all .2s ease"
              }}>
                <Icon name="clock" size={13}/>
                <span>Hardware Window: <strong>{timeLeft}s</strong> remaining before reader reverts to standby</span>
              </div>
            )}

            {cardUid ? (
              <div style={{display:"flex", justifyContent:"center", marginTop:6}}>
                <Button variant="primary" onClick={() => setStep(4)} style={{padding:"8px 16px", fontSize:13}}>
                  Continue to Fingerprint <Icon name="arrow-right" size={13}/>
                </Button>
              </div>
            ) : (
              <button
                onClick={handleCancelAndClose}
                style={{
                  background:"none", border:"none", cursor:"pointer",
                  fontSize:11.5, color:"var(--text-dim)", textDecoration:"underline", marginTop:2
                }}
              >
                Cancel Enrollment Session
              </button>
            )}
          </div>
        )}

        {/* STEP 4: Fingerprint Enrollment */}
        {step === 4 && !isTimedOut && (
          <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:16, padding:"8px 0"}}>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:16, fontWeight:700}}>Biometric Fingerprint Enrollment</div>
              <div style={{fontSize:12.5, color:"var(--text-dim)", marginTop:2}}>
                Place same finger on the optical sensor (2 verification passes)
              </div>
            </div>

            {/* Biometric Scanner Visual */}
            <div style={{
              width:180, height:180, borderRadius:24,
              background:"var(--surface-2)", border:"2px solid var(--border)",
              display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
              position:"relative", overflow:"hidden", boxShadow:"inset 0 0 20px rgba(0,0,0,0.4)"
            }}>
              <div style={{color: fingerPass === 2 ? "var(--teal)" : "var(--primary)", transition:"color .3s ease"}}>
                <Icon name="fingerprint" size={84}/>
              </div>
              {fingerPass < 2 && <div className="scanner-beam" />}
              <div style={{
                position:"absolute", bottom:8, fontSize:10.5, fontWeight:600,
                background:"rgba(0,0,0,0.5)", padding:"2px 8px", borderRadius:4, color:"var(--text-dim)"
              }}>
                Slot #{fingerprintId || 1}
              </div>
            </div>

            {/* Pass 1 & Pass 2 Checklist */}
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, width:"100%"}}>
              <div style={{
                background: fingerPass >= 1 ? "var(--teal-bg)" : "var(--surface-2)",
                border: fingerPass >= 1 ? "1px solid var(--teal)" : "1px solid var(--border)",
                padding:"10px 14px", borderRadius:10, display:"flex", alignItems:"center", gap:10
              }}>
                <div style={{
                  width:24, height:24, borderRadius:99,
                  background: fingerPass >= 1 ? "var(--teal)" : "var(--border)",
                  color: fingerPass >= 1 ? "#fff" : "var(--text-dim)",
                  display:"flex", alignItems:"center", justifyContent:"center"
                }}>
                  {fingerPass >= 1 ? <Icon name="check" size={13}/> : "1"}
                </div>
                <div>
                  <div style={{fontSize:12, fontWeight:600, color: fingerPass >= 1 ? "var(--teal)" : "var(--text)"}}>Pass 1: Capture</div>
                  <div style={{fontSize:10.5, color:"var(--text-dim)"}}>
                    {fingerPass >= 1 ? "First image OK" : "Place finger"}
                  </div>
                </div>
              </div>

              <div style={{
                background: fingerPass >= 2 ? "var(--teal-bg)" : "var(--surface-2)",
                border: fingerPass >= 2 ? "1px solid var(--teal)" : "1px solid var(--border)",
                padding:"10px 14px", borderRadius:10, display:"flex", alignItems:"center", gap:10
              }}>
                <div style={{
                  width:24, height:24, borderRadius:99,
                  background: fingerPass >= 2 ? "var(--teal)" : "var(--border)",
                  color: fingerPass >= 2 ? "#fff" : "var(--text-dim)",
                  display:"flex", alignItems:"center", justifyContent:"center"
                }}>
                  {fingerPass >= 2 ? <Icon name="check" size={13}/> : "2"}
                </div>
                <div>
                  <div style={{fontSize:12, fontWeight:600, color: fingerPass >= 2 ? "var(--teal)" : "var(--text)"}}>Pass 2: Match & Store</div>
                  <div style={{fontSize:10.5, color:"var(--text-dim)"}}>
                    {fingerPass >= 2 ? "Template created" : "Place same finger"}
                  </div>
                </div>
              </div>
            </div>

            {/* Countdown indicator */}
            {fingerPass < 2 && (
              <div style={{
                display:"flex", alignItems:"center", gap:6, fontSize:11.5,
                color: timeLeft <= 10 ? "var(--rose)" : "var(--text-dim)",
                background: timeLeft <= 10 ? "var(--rose-bg)" : "var(--surface-2)",
                padding:"4px 12px", borderRadius:99,
                border: `1px solid ${timeLeft <= 10 ? "var(--rose)" : "var(--border)"}`,
                transition:"all .2s ease"
              }}>
                <Icon name="clock" size={13}/>
                <span>Hardware Window: <strong>{timeLeft}s</strong> remaining before sensor reverts to standby</span>
              </div>
            )}

            {fingerPass >= 2 ? (
              <div style={{display:"flex", justifyContent:"center", marginTop:6}}>
                <Button variant="primary" onClick={() => setStep(5)} style={{padding:"8px 16px", fontSize:13}}>
                  Continue to Device Sync <Icon name="arrow-right" size={13}/>
                </Button>
              </div>
            ) : (
              <button
                onClick={handleCancelAndClose}
                style={{
                  background:"none", border:"none", cursor:"pointer",
                  fontSize:11.5, color:"var(--text-dim)", textDecoration:"underline", marginTop:2
                }}
              >
                Cancel Enrollment Session
              </button>
            )}
          </div>
        )}

        {/* STEP 5: Synchronization & Completed */}
        {step === 5 && (
          <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:14, padding:"8px 0"}}>
            {/* Animated Celebration / Sync Icon */}
            <div style={{
              width:58, height:58, borderRadius:99,
              background: syncSummary.all_synced ? "var(--teal-bg)" : "var(--primary-dim)",
              color: syncSummary.all_synced ? "var(--teal)" : "var(--primary)",
              border: `2px solid ${syncSummary.all_synced ? "var(--teal)" : "var(--primary)"}`,
              display:"flex", alignItems:"center", justifyContent:"center",
              boxShadow: syncSummary.all_synced ? "0 0 20px rgba(45,212,191,0.4)" : "none",
              transition:"all .4s ease"
            }}>
              {syncSummary.all_synced ? <Icon name="check" size={28}/> : <Icon name="loader" size={26}/>}
            </div>

            <div style={{textAlign:"center"}}>
              <div style={{fontSize:16.5, fontWeight:700}}>
                {syncSummary.all_synced ? "Hardware Biometric Synchronization Done!" : "Synchronizing Multi-Terminal Biometrics..."}
              </div>
              <div style={{fontSize:12, color:"var(--text-dim)", marginTop:2}}>
                {syncSummary.all_synced
                  ? "Biometric template and access credentials active across all access points."
                  : "Provisioning DownChar biometrics to all connected access terminals in facility..."}
              </div>
            </div>

            {/* Sync Progress Bar */}
            <div style={{width:"100%", background:"var(--surface-2)", height:7, borderRadius:99, overflow:"hidden"}}>
              <div style={{
                height:"100%", width:`${syncProgress}%`,
                background:"linear-gradient(90deg, var(--primary), var(--teal))",
                transition:"width .4s ease"
              }} />
            </div>

            {/* DownChar Terminal Provisioning Checklist */}
            <div style={{
              width:"100%", background:"var(--surface-2)", border:"1px solid var(--border)",
              borderRadius:10, padding:"12px 14px"
            }}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
                <div style={{display:"flex", alignItems:"center", gap:6, fontSize:12, fontWeight:700, color:"var(--text)"}}>
                  <Icon name="cpu" size={14}/>
                  <span>Hardware DownChar Sync Distribution</span>
                </div>
                <span style={{
                  fontSize:11, fontWeight:600,
                  color: syncSummary.all_synced ? "var(--teal)" : "var(--primary)",
                  background: syncSummary.all_synced ? "var(--teal-bg)" : "var(--primary-dim)",
                  padding:"2px 8px", borderRadius:99
                }}>
                  {syncSummary.completed} of {syncSummary.total} Terminals Provisioned
                </span>
              </div>

              <div style={{display:"flex", flexDirection:"column", gap:6, maxHeight:150, overflowY:"auto"}}>
                {syncDevices && syncDevices.length > 0 ? (
                  syncDevices.map((d) => {
                    const isDone = d.sync_status === "COMPLETED";
                    const isRunning = d.sync_status === "RUNNING";
                    const isFailed = d.sync_status === "FAILED";
                    return (
                      <div
                        key={d.device_id}
                        style={{
                          display:"flex", justifyContent:"space-between", alignItems:"center",
                          padding:"8px 10px", borderRadius:6, background:"var(--surface)", border:"1px solid var(--border)",
                          fontSize:12
                        }}
                      >
                        <div style={{display:"flex", alignItems:"center", gap:8}}>
                          <span style={{
                            width:7, height:7, borderRadius:99,
                            background: isDone ? "var(--teal)" : (isRunning ? "var(--primary)" : (isFailed ? "var(--rose)" : (d.is_online ? "var(--amber)" : "var(--text-dim)")))
                          }}/>
                          <div>
                            <span style={{fontWeight:600}}>{d.device_label || d.device_key}</span>
                            <span style={{color:"var(--text-dim)", fontSize:11, marginLeft:6}} className="mono">({d.device_key})</span>
                            {d.is_master && (
                              <span style={{marginLeft:6, fontSize:10, padding:"1px 6px", borderRadius:4, background:"var(--primary-dim)", color:"var(--primary)", fontWeight:600}}>
                                Source
                              </span>
                            )}
                          </div>
                        </div>
                        <div style={{display:"flex", alignItems:"center", gap:6}}>
                          <span style={{
                            fontSize:11, fontWeight:600,
                            color: isDone ? "var(--teal)" : (isRunning ? "var(--primary)" : (isFailed ? "var(--rose)" : "var(--text-dim)"))
                          }}>
                            {d.status_text}
                          </span>
                          {isDone && <Icon name="check" size={13} style={{color:"var(--teal)"}}/>}
                          {isRunning && <span className="spin-slow" style={{display:"inline-flex"}}><Icon name="loader" size={13} style={{color:"var(--primary)"}}/></span>}
                        </div>
                      </div>
                    );
                  })
                ) : (
                  <div style={{padding:"8px", textAlign:"center", fontSize:11.5, color:"var(--text-dim)"}}>
                    Preparing DownChar distribution queue...
                  </div>
                )}
              </div>
            </div>

            {/* Recap Card */}
            <div style={{
              width:"100%", background:"var(--surface-2)", border:"1px solid var(--border)",
              borderRadius:10, padding:"12px 16px", display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, fontSize:12
            }}>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:10.5}}>EMPLOYEE</span>
                <span style={{fontWeight:600}}>{code} — {name}</span>
              </div>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:10.5}}>DEPARTMENT</span>
                <span style={{fontWeight:600}}>{dept}</span>
              </div>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:10.5}}>NFC CARD UID</span>
                <span className="mono" style={{fontWeight:600, color:"var(--teal)"}}>{cardUid || "Assigned"}</span>
              </div>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:10.5}}>FINGERPRINT SLOT</span>
                <span className="mono" style={{fontWeight:600, color:"var(--primary)"}}>Slot #{fingerprintId || 1}</span>
              </div>
            </div>

            <div style={{width:"100%", display:"flex", justifyContent:"flex-end", marginTop:4}}>
              <Button
                variant="primary"
                onClick={handleFinish}
                style={{width:"100%", justifyContent:"center", padding:"9px 18px", fontSize:13.5}}
                disabled={syncProgress < 30}
              >
                <Icon name="check" size={15}/> Done & Close
              </Button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}


function AddDeviceModal({isOpen, onClose, onSave, rooms}){
  const [key, setKey] = useState("");
  const [label, setLabel] = useState("");
  const [roomId, setRoomId] = useState(rooms && rooms[0]?.id ? rooms[0].id : 1);
  const [purpose, setPurpose] = useState("DOOR");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  useEffect(() => {
    if (rooms && rooms.length > 0 && !roomId) setRoomId(rooms[0].id);
  }, [rooms]);

  if (!isOpen) return null;

  const submit = async (e) => {
    e.preventDefault();
    if (!key || !label) { setErr("Device Key and Label are required"); return; }
    setLoading(true);
    setErr("");
    try {
      await onSave({ device_key: key.trim(), device_label: label.trim(), room_id: Number(roomId), purpose, source: "NATIVE" });
      onClose();
    } catch(err) {
      setErr(err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal-box">
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18}}>
          <div style={{fontSize:16, fontWeight:700}}>Add New Hardware Device</div>
          <button onClick={onClose} style={{background:"none", border:"none", cursor:"pointer", color:"var(--text-dim)"}}><Icon name="x" size={18}/></button>
        </div>
        {err && <div style={{color:"var(--rose)", fontSize:12.5, marginBottom:12}}>{err}</div>}
        <form onSubmit={submit} style={{display:"flex", flexDirection:"column", gap:12}}>
          <div>
            <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Device Key (min 8 chars)</label>
            <input required placeholder="ESP32_READER_02" value={key} onChange={e=>setKey(e.target.value)}
              style={{width:"100%", padding:"8px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}} className="mono" />
          </div>
          <div>
            <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Device Label</label>
            <input required placeholder="Server Room Reader" value={label} onChange={e=>setLabel(e.target.value)}
              style={{width:"100%", padding:"8px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}} />
          </div>
          <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
            <div>
              <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Installed Room</label>
              <select value={roomId} onChange={e=>setRoomId(e.target.value)}
                style={{width:"100%", padding:"8px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}>
                {(rooms || []).map(r=><option key={r.id} value={r.id}>{r.room_name}</option>)}
              </select>
            </div>
            <div>
              <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Purpose</label>
              <select value={purpose} onChange={e=>setPurpose(e.target.value)}
                style={{width:"100%", padding:"8px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}>
                <option value="DOOR">DOOR (Access control)</option>
                <option value="ATTENDANCE">ATTENDANCE (Clock in/out)</option>
              </select>
            </div>
          </div>
          <div style={{display:"flex", justifyContent:"flex-end", gap:8, marginTop:8}}>
            <Button variant="ghost" onClick={onClose} disabled={loading}>Cancel</Button>
            <Button variant="primary" type="submit" disabled={loading}>{loading ? "Adding..." : "Add Device"}</Button>
          </div>
        </form>
      </div>
    </div>
  );
}

function AddDepartmentModal({isOpen, onClose, onSave}){
  const [name, setName] = useState("");
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  if (!isOpen) return null;

  const submit = async (e) => {
    e.preventDefault();
    if (!name.trim()) { setErr("Department name is required"); return; }
    setLoading(true);
    setErr("");
    try {
      await onSave(name.trim());
      setName("");
      onClose();
    } catch(err) {
      setErr(err.message);
    } finally {
      setLoading(false);
    }
  };

  return (
    <div className="modal-backdrop">
      <div className="modal-box">
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:18}}>
          <div style={{fontSize:16, fontWeight:700}}>Add New Department</div>
          <button onClick={onClose} style={{background:"none", border:"none", cursor:"pointer", color:"var(--text-dim)"}}><Icon name="x" size={18}/></button>

function Shell(){
  const [token, setToken] = useState(sessionStorage.getItem("token") || "");
  const [page, setPage] = useState("dashboard");
  const [theme, setTheme] = useState(() => {
    const manual = localStorage.getItem("theme_manual");
    if (manual) return localStorage.getItem("theme") || "light";
    const hour = new Date().getHours();
    return (hour >= 12) ? "dark" : "light";
  });
  const [selectedEmp, setSelectedEmp] = useState(null);
  const [now, setNow] = useState(new Date());
  const [isAddModalOpen, setIsAddModalOpen] = useState(false);
  const [isDeleteUnlocked, setIsDeleteUnlocked] = useState(false);
  const [deletePassword, setDeletePassword] = useState("");
  const [showUnlockModal, setShowUnlockModal] = useState(false);
  const [deleteTargetEmp, setDeleteTargetEmp] = useState(null);

  useEffect(() => {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem("theme", theme); } catch (e) {}
  }, [theme]);

  const [employees, setEmployees] = useState([]);
  const [attendance, setAttendance] = useState([]);
  const [activity, setActivity] = useState([]);
  const [activityTotal, setActivityTotal] = useState(0);
  const [activityPage, setActivityPage] = useState(1);
  const [activityStats, setActivityStats] = useState({ granted: 0, denied: 0 });
  const [isLogsLoading, setIsLogsLoading] = useState(false);
  const [devices, setDevices] = useState([]);
  const [occupancy, setOccupancy] = useState({ count: 0, people: [] });
  const [rules, setRules] = useState([]);
  const [departmentsList, setDepartmentsList] = useState([]);
  const [shifts, setShifts] = useState([]);
  const [holidays, setHolidays] = useState([]);
  const [rooms, setRooms] = useState([]);
  const [selectedDate, setSelectedDate] = useState(new Date().toISOString().slice(0,10));
  const [isAttendanceLoading, setIsAttendanceLoading] = useState(false);

  const handleDateChange = useCallback(async (newDate) => {
    if (!newDate) return;
    setSelectedDate(newDate);
    if (!token) return;
    setIsAttendanceLoading(true);
    try {
      const res = await apiCall("/api/attendance?date=" + newDate, "GET", null, token);
      if (res && res.attendance) {
        setAttendance(res.attendance);
      }
    } catch (err) {
      console.error("Failed to load attendance for date:", newDate, err);
    } finally {
      setIsAttendanceLoading(false);
    }
  }, [token]);

  useEffect(()=>{
    const t = setInterval(()=> setNow(new Date()), 1000);
    return ()=>clearInterval(t);
  },[]);

  const loadData = useCallback(async () => {
    if (!token) return;
    try {
      const [peopleRes, attRes, evRes, devRes, occRes, rulesRes, deptsRes, shiftsRes, holsRes, roomsRes] = await Promise.all([
        apiCall("/api/people", "GET", null, token).catch(() => ({ people: [] })),
        apiCall("/api/attendance?date=" + selectedDate, "GET", null, token).catch(() => ({ attendance: [] })),
        apiCall(`/api/events?page=${activityPage}&limit=30`, "GET", null, token).catch(() => ({ events: [], total: 0 })),
        apiCall("/api/devices", "GET", null, token).catch(() => ({ devices: [] })),
        apiCall("/api/occupancy", "GET", null, token).catch(() => ({ count: 0, people: [] })),
        apiCall("/api/rules", "GET", null, token).catch(() => ({ rules: [] })),
        apiCall("/api/departments", "GET", null, token).catch(() => ({ departments: [] })),
        apiCall("/api/shifts", "GET", null, token).catch(() => ({ shifts: [] })),
        apiCall("/api/holidays", "GET", null, token).catch(() => ({ holidays: [] })),
        apiCall("/api/rooms", "GET", null, token).catch(() => ({ rooms: [] })),
      ]);

      const peopleList = peopleRes.people || [];
      const grouped = {};
      for (const p of peopleList) {
        if (!grouped[p.id]) grouped[p.id] = p;
        else if (p.card_uid) grouped[p.id] = p;
      }
      setEmployees(Object.values(grouped));
      setAttendance(attRes.attendance || []);
      setActivity(evRes.events || []);
      setActivityTotal(evRes.total != null ? evRes.total : (evRes.events ? evRes.events.length : 0));
      setActivityStats({
        granted: evRes.granted_count || 0,
        denied: evRes.denied_count || 0
      });
      setDevices(devRes.devices || []);
      setOccupancy(occRes || { count: 0, people: [] });
      setRules(rulesRes.rules || []);
      setDepartmentsList(deptsRes.departments || []);
      setShifts(shiftsRes.shifts || []);
      setHolidays(holsRes.holidays || []);
      setRooms(roomsRes.rooms || []);
    } catch(err) {
      console.error("Data fetch error:", err);
    }
  }, [token, selectedDate, activityPage]);

  useEffect(() => {
    loadData();
  }, [loadData]);

  const handleActivityPageChange = async (newPage) => {
    if (newPage === activityPage && activity.length > 0) return;
    setActivityPage(newPage);
    setIsLogsLoading(true);
    try {
      const res = await apiCall(`/api/events?page=${newPage}&limit=30`, "GET", null, token);
      if (res && res.events) {
        setActivity(res.events);
        if (res.total != null) setActivityTotal(res.total);
        if (res.granted_count != null) {
          setActivityStats({ granted: res.granted_count, denied: res.denied_count });
        }
      }
    } catch (err) {
      console.error("Failed to load page:", err);
    } finally {
      setIsLogsLoading(false);
    }
  };

  const handleRefreshActivity = async () => {
    setIsLogsLoading(true);
    try {
      const res = await apiCall(`/api/events?page=${activityPage}&limit=30`, "GET", null, token);
      if (res && res.events) {
        setActivity(res.events);
        if (res.total != null) setActivityTotal(res.total);
        if (res.granted_count != null) {
          setActivityStats({ granted: res.granted_count, denied: res.denied_count });
        }
      }
    } catch (err) {
      console.error("Refresh activity error:", err);
    } finally {
      setIsLogsLoading(false);
    }
  };

  useEffect(() => {
    if (!token) return;
    const stream = new EventSource(API + "/api/stream");

    stream.addEventListener("access_event", (e) => {
      try {
        const ev = JSON.parse(e.data);
        setActivityTotal(prev => prev + 1);
        const dec = String(ev.decision || ev.result || "").toUpperCase();
        const isGranted = dec === "ALLOWED" || dec === "GRANTED";
        setActivityStats(prev => ({
          granted: prev.granted + (isGranted ? 1 : 0),
          denied: prev.denied + (isGranted ? 0 : 1)
        }));
        if (activityPage === 1) {
          setActivity(prev => [ev, ...prev.slice(0, 29)]);
        }
        apiCall("/api/attendance?date=" + selectedDate, "GET", null, token).then(r => setAttendance(r.attendance || []));
        apiCall("/api/occupancy", "GET", null, token).then(r => setOccupancy(r || { count: 0, people: [] }));
      } catch(err) {}
    });

    stream.addEventListener("occupancy_changed", () => {
      apiCall("/api/occupancy", "GET", null, token).then(r => setOccupancy(r || { count: 0, people: [] }));
    });

    return () => stream.close();
  }, [token, selectedDate, activityPage]);

  const departments = useMemo(() => {
    if (departmentsList && departmentsList.length > 0) return departmentsList.map(d => d.name);
    const set = new Set(["Engineering", "Operations", "Finance", "HR", "Sales"]);
    employees.forEach(e => { if (e.department) set.add(e.department); });
    return Array.from(set);
  }, [departmentsList, employees]);


  const handleAddEmployee = async (empData) => {
    try {
      const person = await apiCall(
        "/api/people",
        "POST",
        {
          employee_code: (empData.code || "").trim(),
          full_name: (empData.name || "").trim(),
          department: (empData.dept || "").trim(),
          person_type: empData.type || "EMPLOYEE",
          email: (empData.email || "").trim() || null,
        },
        token
      );

      if (!person || !person.id) {
        throw new Error("Employee creation failed");
      }

      if ((empData.card && empData.card.trim()) || (empData.fp && !isNaN(empData.fp))) {
        await apiCall(
          "/api/credentials",
          "POST",
          {
            person_id: person.id,
            card_uid: (empData.card || "").trim().toUpperCase(),
            fingerprint_slot: empData.fp && !isNaN(empData.fp) ? Number(empData.fp) : null,
          },
          token
        );
      }

      await loadData();
    } catch (err) {
      console.error("Add employee failed:", err);
      alert(err.message || "Failed to add employee");
    }
  };

  const handleEnrollEmployee = async (employee, deviceId) => {
  if (!employee || !employee.id) {
    alert("Invalid employee");
    return;
  }

  if (!deviceId) {
    alert("Please select a target ESP32 device");
    return;
  }

  try {
    const result = await apiCall(
      "/api/fingerprint-enrollment",
      "POST",
      {
        person_id: Number(employee.id),
        target_device_id: Number(deviceId),
      },
      token
    );

    if (!result) {
      throw new Error("Failed to create enrollment job");
    }

    if (result.created === false && result.existing === true) {
      alert(
        `Enrollment job already exists.\n\n` +
        `Job ID: ${result.job_id}\n` +
        `Fingerprint ID: ${result.fingerprint_id}\n` +
        `Target ESP32: ${result.target_esp32_id}`
      );
      return;
    }

    alert(
      `Enrollment job created successfully!\n\n` +
      `Job ID: ${result.job_id}\n` +
      `Employee: ${result.full_name}\n` +
      `Fingerprint ID: ${result.fingerprint_id}\n` +
      `Target ESP32: ${result.target_esp32_id}`
    );

    await loadData();

  } catch (err) {
    console.error(
      "Enrollment job creation failed:",
      err
    );

    alert(
      err.message ||
      "Failed to create enrollment job"
    );
  }
};
 
  const handleUnlockDelete = (pw) => {
    setDeletePassword(pw);
    setIsDeleteUnlocked(true);
    setShowUnlockModal(false);
  };

  const handleLockDelete = () => {
    setIsDeleteUnlocked(false);
    setDeletePassword("");
  };

  const handlePermanentDelete = async (emp, pw) => {
    const passwordToUse = (pw || deletePassword || "").trim();
    if (!emp || !emp.id) return;
    try {
      await apiCall(
        `/api/people/${emp.id}/permanent`,
        "DELETE",
        { password: passwordToUse },
        token
      );
      setDeleteTargetEmp(null);
      setSelectedEmp(null);
      await loadData();
      alert(`Employee ${emp.full_name} and all biometric/NFC credentials were permanently deleted.`);
    } catch (err) {
      console.error("Permanent deletion failed:", err);
      throw err;
    }
  };

  const handleDeactivate = async (emp) => {
    try {
      if (emp.is_active) {
        if (!confirm("Deactivate " + emp.full_name + "? Their card access will be stopped.")) return;
        await apiCall("/api/people/" + emp.id, "DELETE", null, token);
      } else {
        await apiCall("/api/people/" + emp.id, "PUT", { is_active: true }, token);
      }
      setSelectedEmp(null);
      await loadData();
    } catch(err) {
      alert("Action failed: " + err.message);
    }
  };

  const handleAddDevice = async (deviceData) => {
    await apiCall("/api/devices", "POST", deviceData, token);
    await loadData();
  };

  const handleUpdateDevicePurpose = async (deviceId, purpose) => {
    try {
      await apiCall("/api/devices/" + deviceId, "PUT", { purpose }, token);
      await loadData();
    } catch(err) {
      alert("Failed to update device purpose: " + err.message);
    }
  };

  const handleDeleteDevice = async (deviceId) => {
    if (!confirm("Are you sure you want to remove/deactivate this hardware device?")) return;
    await apiCall("/api/devices/" + deviceId, "DELETE", null, token);
    await loadData();
  };

  const handleAddDepartment = async (name) => {
    await apiCall("/api/departments", "POST", { name }, token);
    await loadData();
  };

  const handleDeleteDepartment = async (deptId, deptName) => {
    if (!confirm("Delete department '" + deptName + "'?")) return;
    await apiCall("/api/departments/" + deptId, "DELETE", null, token);
    await loadData();
  };

  const handleAddRule = async (ruleData) => {
    await apiCall("/api/rules", "POST", ruleData, token);
    await loadData();
  };

  const handleDeleteRule = async (ruleId) => {
    if (!confirm("Remove this access rule?")) return;
    await apiCall("/api/rules/" + ruleId, "DELETE", null, token);
    await loadData();
  };

  const handleAddShift = async (shiftData) => {
    await apiCall("/api/shifts", "POST", shiftData, token);
    await loadData();
  };

  const handleDeleteShift = async (shiftId) => {
    if (!confirm("Remove this shift schedule?")) return;
    await apiCall("/api/shifts/" + shiftId, "DELETE", null, token);
    await loadData();
  };

  const handleAddHoliday = async (holidayData) => {
    await apiCall("/api/holidays", "POST", holidayData, token);
    await loadData();
  };

  const handleDeleteHoliday = async (holidayId) => {
    if (!confirm("Remove this holiday?")) return;
    await apiCall("/api/holidays/" + holidayId, "DELETE", null, token);
    await loadData();
  };

  const handleLogout = () => {
    sessionStorage.clear();
    setToken("");
    setSelectedEmp(null);
  };

  if(!token) return <LoginPage onLogin={t => setToken(t)} />;

  const pageTitle = NAV.find(n=>n.key===page)?.label || "";

  return (
    <div data-theme={theme} style={{display:"flex", minHeight:"100vh", background:"var(--bg)", color:"var(--text)"}}>
      {/* Slim Vertical Left Dock */}
      <aside style={{
        width: 68,
        borderRight: "1px solid var(--border)",
        padding: "16px 10px",
        display: "flex",
        flexDirection: "column",
        alignItems: "center",
        background: "var(--surface)",
        flexShrink: 0
      }}>
        {/* Top Logo / Emblem */}
        <div
          onClick={() => { setPage("dashboard"); setSelectedEmp(null); }}
          title="AccessPro Dashboard"
          style={{
            width: 40,
            height: 40,
            borderRadius: 10,
            background: "var(--primary)",
            display: "flex",
            alignItems: "center",
            justifyContent: "center",
            color: "#ffffff",
            marginBottom: 18,
            boxShadow: "0 2px 8px var(--primary-glow)",
            cursor: "pointer"
          }}
        >
          <Icon name="id" size={20} />
        </div>

        {/* Dynamic Working Navigation Buttons */}
        <nav style={{ display: "flex", flexDirection: "column", gap: 8, alignItems: "center" }}>
          {NAV.map(n => {
            const isActive = page === n.key;
            return (
              <button
                key={n.key}
                type="button"
                onClick={() => { setPage(n.key); setSelectedEmp(null); }}
                title={n.label}
                className={"dock-btn" + (isActive ? " active" : "")}
              >
                <Icon name={n.icon} size={19} />
              </button>
            );
          })}
        </nav>

        <div style={{ flex: 1 }} />

        {/* Logout */}
        <button
          type="button"
          onClick={handleLogout}
          title="Sign out"
          className="dock-btn"
          style={{ color: "var(--rose)" }}
        >
          <Icon name="logout" size={19} />
        </button>
      </aside>

      <main style={{flex:1, display:"flex", flexDirection:"column", minWidth:0}}>
        {/* Top Header Bar */}
        <header style={{
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          padding: "16px 28px",
          borderBottom: "1px solid var(--border)",
          background: "var(--surface)"
        }}>
          <div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 21, fontWeight: 700, letterSpacing: -0.5, color: "var(--text)" }}>
                {selectedEmp ? selectedEmp.full_name : pageTitle}
              </span>
              <Icon name="polygon-emblem" size={22} />
            </div>
          </div>

          <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
            {/* Dark / Light Mode Toggle */}
            <button
              type="button"
              onClick={() => {
                setTheme(t => {
                  const next = t === "dark" ? "light" : "dark";
                  try {
                    localStorage.setItem("theme_manual", "true");
                    localStorage.setItem("theme", next);
                  } catch (e) {}
                  return next;
                });
              }}
              title={theme === "dark" ? "Switch to Light Mode" : "Switch to Dark Mode"}
              style={{
                width: 36,
                height: 36,
                borderRadius: 8,
                border: "1px solid var(--border)",
                background: "var(--surface-2)",
                display: "flex",
                alignItems: "center",
                justifyContent: "center",
                cursor: "pointer",
                color: "var(--text)",
                transition: "all .12s ease"
              }}
            >
              <Icon name={theme === "dark" ? "sun" : "moon"} size={16} />
            </button>

            {/* Admin Profile Pill */}
            <div style={{
              display: "flex",
              alignItems: "center",
              gap: 10,
              padding: "4px 12px 4px 4px",
              borderRadius: 24,
              background: "var(--surface-2)",
              border: "1px solid var(--border)"
            }}>
              <div style={{
                width: 34,
                height: 34,
                borderRadius: "50%",
                background: "var(--primary-dim)",
                color: "var(--primary)",
                fontWeight: 700,
                fontSize: 12,
                display: "flex",
                alignItems: "center",
                justifyContent: "center"
              }}>
                AD
              </div>
              <div style={{ textAlign: "left" }}>
                <div style={{ fontSize: 12.5, fontWeight: 700, color: "var(--text)", lineHeight: 1.1 }}>
                  Admin
                </div>
                <div style={{ fontSize: 11, color: "var(--text-faint)", marginTop: 1 }}>
                  admin@domain.ae
                </div>
              </div>
            </div>
          </div>
        </header>

        <div style={{padding:24, flex:1, overflow:"auto"}}>
          {page==="dashboard" && (
            <DashboardPage
              employees={employees}
              attendance={attendance}
              activity={activity}
              activityTotal={activityTotal}
              activityPage={activityPage}
              activityStats={activityStats}
              onPageChange={handleActivityPageChange}
              onRefreshActivity={handleRefreshActivity}
              isLogsLoading={isLogsLoading}
              occupancy={occupancy}
              dateStr={selectedDate}
              onSelectDate={setSelectedDate}
              onAdvancedConfig={() => setPage("admin")}
              token={token}
            />
          )}
          {page==="logs" && (
            <RecentLogsPage
              activity={activity}
              activityTotal={activityTotal}
              activityPage={activityPage}
              activityStats={activityStats}
              onPageChange={handleActivityPageChange}
              onRefreshActivity={handleRefreshActivity}
              isLogsLoading={isLogsLoading}
              employees={employees}
              devices={devices}
              rooms={rooms}
            />
          )}
          {page==="employees" && !selectedEmp && (
            <EmployeesPage
              employees={employees}
              departments={departments}
              onSelect={setSelectedEmp}
              onAddClick={()=>setIsAddModalOpen(true)}
              onDeactivate={handleDeactivate}
              onDelete={(emp)=>setDeleteTargetEmp(emp)}
              isDeleteUnlocked={isDeleteUnlocked}
              onUnlockClick={()=>setShowUnlockModal(true)}
              onLockClick={handleLockDelete}
            />
          )}
          {page==="employees" && selectedEmp && (
            <EmployeeProfile
              emp={selectedEmp}
              attendanceHistory={attendance.filter(a => a.person_id === selectedEmp.id || a.employee_code === selectedEmp.employee_code)}
              onBack={()=>setSelectedEmp(null)}
              onDeactivate={handleDeactivate}
              onDelete={(emp)=>setDeleteTargetEmp(emp)}
              isDeleteUnlocked={isDeleteUnlocked}
              onUnlockClick={()=>setShowUnlockModal(true)}
              token={token}
            />
          )}
          {page==="attendance" && (
            <AttendancePage
              attendance={attendance}
              departments={departments}
              selectedDate={selectedDate}
              onDateChange={handleDateChange}
              isLoading={isAttendanceLoading}
            />
          )}
          {page==="devices" && (
            <DevicesPage
              devices={devices}
              rooms={rooms}
              onAddDevice={handleAddDevice}
              onDeleteDevice={handleDeleteDevice}
              onUpdatePurpose={handleUpdateDevicePurpose}
            />
          )}
          {page==="admin" && (
            <AdminPage
              departments={departmentsList}
              employees={employees}
              rules={rules}
              shifts={shifts}
              holidays={holidays}
              rooms={rooms}
              onAddDepartment={handleAddDepartment}
              onDeleteDepartment={handleDeleteDepartment}
              onAddRule={handleAddRule}
              onDeleteRule={handleDeleteRule}
              onAddShift={handleAddShift}
              onDeleteShift={handleDeleteShift}
              onAddHoliday={handleAddHoliday}
              onDeleteHoliday={handleDeleteHoliday}
            />
          )}
        </div>
      </main>

      <AddEmployeeModal
        isOpen={isAddModalOpen}
        onClose={()=>setIsAddModalOpen(false)}
        onSaved={loadData}
        departments={departmentsList}
        devices={devices}
        token={token}
      />

      <UnlockDeleteModal
        isOpen={showUnlockModal}
        onClose={()=>setShowUnlockModal(false)}
        onUnlock={handleUnlockDelete}
        token={token}
      />

      <PermanentDeleteModal
        emp={deleteTargetEmp}
        isOpen={Boolean(deleteTargetEmp)}
        onClose={()=>setDeleteTargetEmp(null)}
        onConfirm={handlePermanentDelete}
        defaultPassword={deletePassword}
        token={token}
      />
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<Shell/>);
</script>
</body>
</html>
