<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance & Access Control — Admin Console</title>
<script>
  (function() {
    var savedTheme = localStorage.getItem("theme") || "light";
    document.documentElement.setAttribute("data-theme", savedTheme);
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  :root{
    --bg:#f4f6fb; --surface:#ffffff; --surface-2:#eef1f8; --border:#dde3ef;
    --text:#1c2333; --text-dim:#5b6479; --text-faint:#98a1b5;
    --primary:#3454d1; --primary-dim:#dde5ff;
    --teal:#0f8f7a; --teal-bg:#e1f5f0;
    --amber:#b8710a; --amber-bg:#fdf1dd;
    --rose:#c23b57; --rose-bg:#fbe6ea;
    --radius:10px;
  }
  [data-theme="dark"]{
    --bg:#0b1220; --surface:#141c2f; --surface-2:#1a2438; --border:#26314a;
    --text:#e7ebf5; --text-dim:#8d97ad; --text-faint:#5c6680;
    --primary:#4c6fff; --primary-dim:#2a3d8f;
    --teal:#2dd4bf; --teal-bg:#0e2e2a;
    --amber:#f5a524; --amber-bg:#332208;
    --rose:#f5738a; --rose-bg:#331119;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  #root{min-height:100vh;}
  ::selection{background:var(--primary); color:#fff;}
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  ::-webkit-scrollbar{width:8px; height:8px;}
  ::-webkit-scrollbar-thumb{background:var(--border); border-radius:8px;}
  @keyframes flashIn { from { background: var(--primary-dim); } to { background: transparent; } }
  .flash-row { animation: flashIn 1.4s ease-out; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
  .modal-box { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 500px; padding: 24px; box-shadow: 0 16px 40px rgba(0,0,0,0.6); }
  .modal-box-large { max-width: 580px; }
  @keyframes pulseGlow {
    0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(76, 111, 255, 0.45); }
    70% { transform: scale(1.02); box-shadow: 0 0 0 20px rgba(76, 111, 255, 0); }
    100% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(76, 111, 255, 0); }
  }
  @keyframes pulseGreen {
    0% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(45, 212, 191, 0.5); }
    70% { transform: scale(1.02); box-shadow: 0 0 0 20px rgba(45, 212, 191, 0); }
    100% { transform: scale(0.98); box-shadow: 0 0 0 0 rgba(45, 212, 191, 0); }
  }
  @keyframes scanLine {
    0% { top: 4px; opacity: 0.9; }
    50% { top: calc(100% - 6px); opacity: 1; }
    100% { top: 4px; opacity: 0.9; }
  }
  @keyframes spinSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .spin-slow { animation: spinSlow 1.5s linear infinite; }
  .nfc-card-glow { animation: pulseGlow 2s infinite ease-in-out; }
  .nfc-card-success { animation: pulseGreen 2s infinite ease-in-out; }
  .scanner-beam { position: absolute; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, transparent, #2dd4bf, transparent); box-shadow: 0 0 12px #2dd4bf; animation: scanLine 2s ease-in-out infinite; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const {useState, useMemo, useEffect, useCallback} = React;

const API = (location.port === "3000") ? "" : "http://127.0.0.1:3000";

const NAV = [
  {key:"dashboard", label:"Dashboard", icon:"grid"},
  {key:"employees", label:"Employees", icon:"users"},
  {key:"attendance", label:"Attendance", icon:"clock"},
  {key:"devices", label:"Devices", icon:"cpu"},
  {key:"admin", label:"Admin panel", icon:"settings"},
];

    case "users": return <svg {...p}><circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.6"/><path d="M21 20c0-2.6-1.7-4.8-4-5.6"/></svg>;
    case "clock": return <svg {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.2 2"/></svg>;
    case "cpu": return <svg {...p}><rect x="6" y="6" width="12" height="12" rx="2"/><path d="M9 2v3M15 2v3M9 19v3M15 19v3M2 9h3M2 15h3M19 9h3M19 15h3"/></svg>;
    case "settings": return <svg {...p}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1 2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9c.2.6.7 1 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>;
    case "sun": return <svg {...p}><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>;
    case "moon": return <svg {...p}><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z"/></svg>;
    case "search": return <svg {...p}><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>;
    case "plus": return <svg {...p}><path d="M12 5v14M5 12h14"/></svg>;
    case "download": return <svg {...p}><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>;
    case "id": return <svg {...p}><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="8.5" cy="12" r="2"/><path d="M14 10h5M14 14h5"/></svg>;
    case "check": return <svg {...p}><path d="M20 6L9 17l-5-5"/></svg>;
    case "x": return <svg {...p}><path d="M18 6L6 18M6 6l12 12"/></svg>;
    case "logout": return <svg {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>;
    case "chevron": return <svg {...p}><path d="M9 18l6-6-6-6"/></svg>;
    case "trash": return <svg {...p}><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>;
    case "nfc": return <svg {...p}><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 10a5 5 0 0 1 7.1 0M9.5 12.5a1.5 1.5 0 0 1 2.1 0"/><circle cx="17" cy="15" r="1"/></svg>;
    case "fingerprint": return <svg {...p}><path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"/><path d="M14 13.12c0 2.38 0 6.38-1 8.88"/><path d="M2 16h.01"/><path d="M21.8 16c.2-2 .131-5.354 0-6"/><path d="M9 6.8a6 6 0 0 1 9 5.2c0 .47 0 1.17-.02 2"/><path d="M5.5 10a8 8 0 0 1 13 0"/><path d="M2 12a10 10 0 0 1 20 0"/><path d="M12 2v2"/></svg>;
    case "arrow-right": return <svg {...p}><path d="M5 12h14M12 5l7 7-7 7"/></svg>;
    case "loader": return <svg {...p} className="spin-slow"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>;
    case "radio": return <svg {...p}><path d="M4.93 4.93a10 10 0 0 1 14.14 0M7.76 7.76a6 6 0 0 1 8.48 0M10.6 10.6a2 2 0 0 1 2.8 0"/><circle cx="12" cy="12" r="1"/></svg>;
    case "check-circle": return <svg {...p}><circle cx="12" cy="12" r="9"/><path d="M8.5 12l2.5 2.5 5-5"/></svg>;
    case "alert-triangle": return <svg {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>;
    case "refresh": return <svg {...p}><path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>;
    case "lock": return <svg {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>;
    case "unlock": return <svg {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 9.9-1"/></svg>;
    case "eye": return <svg {...p}><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>;
    case "eye-off": return <svg {...p}><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>;
    default: return null;

}

function StatusBadge({status}){
  const map = {
    present:{c:"var(--teal)", bg:"var(--teal-bg)", label:"Present"},
    late:{c:"var(--amber)", bg:"var(--amber-bg)", label:"Late"},
    absent:{c:"var(--rose)", bg:"var(--rose-bg)", label:"Absent"},
    active:{c:"var(--teal)", bg:"var(--teal-bg)", label:"Active"},
    inactive:{c:"var(--text-faint)", bg:"var(--surface-2)", label:"Inactive"},
    online:{c:"var(--teal)", bg:"var(--teal-bg)", label:"Online"},
    offline:{c:"var(--rose)", bg:"var(--rose-bg)", label:"Offline"},
    ALLOWED:{c:"var(--teal)", bg:"var(--teal-bg)", label:"Allowed"},
    DENIED:{c:"var(--rose)", bg:"var(--rose-bg)", label:"Denied"},
  };
  const s = map[status] || map.inactive;
  return (
    <span style={{
      display:"inline-flex", alignItems:"center", gap:6, fontSize:12, fontWeight:600,
      color:s.c, background:s.bg, padding:"3px 10px", borderRadius:999,
    }}>
      <span style={{width:6, height:6, borderRadius:99, background:s.c}}/>
      {s.label}
    </span>
  );
}

function Card({children, style}){
  return (
    <div style={{
      background:"var(--surface)", border:"1px solid var(--border)", borderRadius:"var(--radius)",
      padding:"18px 20px", ...style
    }}>{children}</div>
  );
}

function StatCard({label, value, sub, accent}){
  return (
    <Card>
      <div style={{fontSize:12.5, color:"var(--text-dim)", fontWeight:500, marginBottom:10}}>{label}</div>
      <div style={{fontSize:28, fontWeight:700, color: accent || "var(--text)", lineHeight:1}}>{value}</div>
      {sub && <div style={{fontSize:12, color:"var(--text-faint)", marginTop:8}}>{sub}</div>}
    </Card>
  );
}

function Button({children, variant="ghost", onClick, style, type="button", disabled=false}){
  const base = {
    padding:"9px 14px", borderRadius:8, fontSize:13.5, fontWeight:600, cursor: disabled?"not-allowed":"pointer",
    display:"inline-flex", alignItems:"center", gap:7, border:"1px solid var(--border)",
    transition:"background .12s ease", opacity: disabled ? 0.6 : 1, ...style
  };
  const variants = {
    primary:{background:"var(--primary)", color:"#fff", border:"1px solid var(--primary)"},
    ghost:{background:"transparent", color:"var(--text)"},
    subtle:{background:"var(--surface-2)", color:"var(--text)"},
    danger:{background:"var(--rose)", color:"#fff", border:"1px solid var(--rose)"},
  };
  return <button type={type} disabled={disabled} onClick={onClick} style={{...base, ...variants[variant]}}>{children}</button>;
}

function Th({children}){
  return <th style={{textAlign:"left", padding:"10px 14px", fontSize:11.5, textTransform:"uppercase", letterSpacing:"0.04em", color:"var(--text-faint)", fontWeight:600, borderBottom:"1px solid var(--border)"}}>{children}</th>;
}
function Td({children, mono, style}){
  return <td className={mono?"mono":""} style={{padding:"11px 14px", fontSize:13.5, borderBottom:"1px solid var(--border)", color:"var(--text)", ...style}}>{children}</td>;
}

async function apiCall(path, method="GET", body=null, token="") {
  const headers = {};
  if (token) headers["Authorization"] = "Bearer " + token;
  if (body) headers["Content-Type"] = "application/json";

  const res = await fetch(API + path, {
    method,
    headers,
    body: body ? JSON.stringify(body) : null,
  });

  if (res.status === 401) {
    sessionStorage.clear();
    window.location.reload();
    throw new Error("Session expired");
  }

  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const detailMsg = data.details
      ? (Array.isArray(data.details) ? data.details.map(d => d.message || (d.path && d.path.join("."))).join(", ") : JSON.stringify(data.details))
      : "";
    throw new Error(data.message || detailMsg || data.error || ("HTTP " + res.status));
  }
  return data;
}

function DashboardPage({
  employees,
  attendance,
  activity,
  occupancy,
  dateStr
 }) {
  const formatTime = (value) => {
    if (!value) return "--";
    const d = new Date(value);
    if (isNaN(d.getTime())) return value;
    return d.toLocaleTimeString([], {
      hour: "2-digit",
      minute: "2-digit",
      second: "2-digit"
    });
  };

  const formatDate = (value) => {
    if (!value) return "--";
    const d = new Date(value);
    if (isNaN(d.getTime())) return value;
    return d.toLocaleDateString([], {
      day: "2-digit",
      month: "short",
      year: "numeric"
    });
  };

  const getEmployeeName = (ev) => {
    if (ev.full_name && ev.full_name !== "Unknown") return ev.full_name;
    if (ev.person_name && ev.person_name !== "Unknown") return ev.person_name;
    if (ev.name && ev.name !== "Unknown") return ev.name;

    if (employees && employees.length > 0) {
      if (ev.person_id) {
        const found = employees.find(e => Number(e.id) === Number(ev.person_id));
        if (found && found.full_name) return found.full_name;
      }
      if (ev.employee_code) {
        const found = employees.find(e => (e.employee_code || "").toUpperCase() === (ev.employee_code || "").toUpperCase());
        if (found && found.full_name) return found.full_name;
      }
      if (ev.card_uid) {
        const cleanCard = String(ev.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
        const found = employees.find(e => e.card_uid && String(e.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase() === cleanCard);
        if (found && found.full_name) return found.full_name;
      }
    }

    if (ev.employee_code) return ev.employee_code;
    if (ev.person_id) return "Employee #" + ev.person_id;
    return "Unregistered User";
  };

  const getEmployeeCode = (ev) => {
    if (ev.employee_code && ev.employee_code !== "--") return ev.employee_code;
    if (employees && employees.length > 0) {
      if (ev.person_id) {
        const found = employees.find(e => Number(e.id) === Number(ev.person_id));
        if (found && found.employee_code) return found.employee_code;
      }
      if (ev.card_uid) {
        const cleanCard = String(ev.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
        const found = employees.find(e => e.card_uid && String(e.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase() === cleanCard);
        if (found && found.employee_code) return found.employee_code;
      }
    }
    return "--";
  };

  const getEmployeeDept = (ev) => {
    if (ev.department) return ev.department;
    if (employees && employees.length > 0) {
      if (ev.person_id) {
        const found = employees.find(e => Number(e.id) === Number(ev.person_id));
        if (found && found.department) return found.department;
      }
      if (ev.card_uid) {
        const cleanCard = String(ev.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase();
        const found = employees.find(e => e.card_uid && String(e.card_uid).replace(/[^0-9A-Fa-f]/g, "").toUpperCase() === cleanCard);
        if (found && found.department) return found.department;
      }
    }
    return null;
  };

  const getDecision = (ev) => {
    const value = String(
      ev.decision ||
      ev.result ||
      ""
    ).toUpperCase();

    if (value === "ALLOWED" || value === "GRANTED") {
      return "GRANTED";
    }

    return "DENIED";
  };

  const recentLogs = Array.isArray(activity)
    ? activity.slice(0, 30)
    : [];

  const grantedCount = recentLogs.filter(
    ev => getDecision(ev) === "GRANTED"
  ).length;

  const deniedCount = recentLogs.filter(
    ev => getDecision(ev) === "DENIED"
  ).length;

  return (
    <div style={{display:"flex", flexDirection:"column", gap:18}}>

      {/* Summary cards */}
      <div style={{
        display:"grid",
        gridTemplateColumns:"repeat(4, minmax(0, 1fr))",
        gap:12
      }}>

        <div style={{
          background:"var(--surface)",
          border:"1px solid var(--border)",
          borderRadius:12,
          padding:16
        }}>
          <div style={{
            fontSize:12,
            color:"var(--text-dim)",
            marginBottom:7
          }}>
            Employees
          </div>

          <div style={{
            fontSize:25,
            fontWeight:700
          }}>
            {employees?.length || 0}
          </div>
        </div>

        <div style={{
          background:"var(--surface)",
          border:"1px solid var(--border)",
          borderRadius:12,
          padding:16
        }}>
          <div style={{
            fontSize:12,
            color:"var(--text-dim)",
            marginBottom:7
          }}>
            Currently Inside
          </div>

          <div style={{
            fontSize:25,
            fontWeight:700
          }}>
            {occupancy?.count || 0}
          </div>
        </div>

        <div style={{
          background:"var(--surface)",
          border:"1px solid var(--border)",
          borderRadius:12,
          padding:16
        }}>
          <div style={{
            fontSize:12,
            color:"var(--text-dim)",
            marginBottom:7
          }}>
            Recent Granted
          </div>

          <div style={{
            fontSize:25,
            fontWeight:700
          }}>
            {grantedCount}
          </div>
        </div>

        <div style={{
          background:"var(--surface)",
          border:"1px solid var(--border)",
          borderRadius:12,
          padding:16
        }}>
          <div style={{
            fontSize:12,
            color:"var(--text-dim)",
            marginBottom:7
          }}>
            Recent Denied
          </div>

          <div style={{
            fontSize:25,
            fontWeight:700
          }}>
            {deniedCount}
          </div>
        </div>

      </div>


      {/* Recent access logs */}
      <div style={{
        background:"var(--surface)",
        border:"1px solid var(--border)",
        borderRadius:12,
        overflow:"hidden"
      }}>

        <div style={{
          padding:"15px 18px",
          borderBottom:"1px solid var(--border)",
          display:"flex",
          justifyContent:"space-between",
          alignItems:"center"
        }}>

          <div>
            <div style={{
              fontSize:15,
              fontWeight:700
            }}>
              Recent Access Logs
            </div>

            <div style={{
              fontSize:11.5,
              color:"var(--text-faint)",
              marginTop:3
            }}>
              Live access activity from connected ESP32 devices
            </div>
          </div>

          <div style={{
            fontSize:11,
            color:"var(--text-faint)"
          }}>

 }

  return (
    <div>

            <div>
              <div style={{fontWeight:700, fontSize:15.5}}>{emp.full_name}</div>

          <div style={{display:"flex", flexDirection:"column", gap:9, fontSize:13}}>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>Employee ID</span><span className="mono">{emp.employee_code}</span></div>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>Email</span><span>{emp.email || "—"}</span></div>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>RFID Card</span>{emp.card_uid ? <span className="mono">{emp.card_uid}</span> : <StatusBadge status="inactive"/>}</div>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>Fingerprint</span>{emp.fingerprint_slot!=null ? <span className="mono">slot {emp.fingerprint_slot}</span> : <StatusBadge status="inactive"/>}</div>
            <div style={{display:"flex", justifyContent:"space-between"}}><span style={{color:"var(--text-dim)"}}>Status</span><StatusBadge status={emp.is_active ? "active" : "inactive"}/></div>
          </div>

          <div style={{marginTop: 20, paddingTop: 16, borderTop: "1px solid var(--border)"}}>
            <Button variant="ghost" onClick={()=>onDeactivate(emp)} style={{width:"100%", justifyContent:"center", border:"1px solid var(--border)"}}>
              <Icon name="x" size={15}/> {emp.is_active ? "Deactivate Employee" : "Reactivate Employee"}
            </Button>

            {isDeleteUnlocked ? (
              <Button
                variant="danger"
                onClick={()=>onDelete && onDelete(emp)}
                style={{
                  width:"100%", justifyContent:"center", marginTop: 8,
                  background: "var(--rose)", color: "#fff", border: "1px solid var(--rose)"
                }}
              >
                <Icon name="trash" size={15}/> Permanently Delete All Data
              </Button>

              <button
                type="button"
                onClick={onUnlockClick}

                  width:"100%", background:"none", border:"none", cursor:"pointer",

            <StatCard label="Total hours" value={totalHours}/>

          <Card>
            <div style={{fontSize:14.5, fontWeight:600, marginBottom:12}}>Attendance history</div>
            <table style={{width:"100%", borderCollapse:"collapse"}}>
              <thead><tr><Th>Date</Th><Th>Check-in</Th><Th>Check-out</Th><Th>Hours</Th><Th>Status</Th></tr></thead>

                  <tr><Td colSpan={5} style={{textAlign:"center", color:"var(--text-dim)"}}>No records logged yet.</Td></tr>

                  attendanceHistory.map((a,i)=>{

                    const outT = a.last_out ? new Date(a.last_out).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : "—";

            </table>
          </Card>
        </div>
      </div>
    </div>
  );
}

function AttendancePage({attendance, departments, selectedDate, onDateChange}){
  const [status, setStatus] = useState("all");
  const [dept, setDept] = useState("all");

  const rows = attendance.filter(a => {
    let s = "absent";
    if (a.first_in) {
      const t = new Date(a.first_in).toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
      s = t > "09:45" ? "late" : "present";
    }
    return (status === "all" || s === status) && (dept === "all" || a.department === dept);
  });

  return (
    <Card style={{padding:0}}>
      <div style={{display:"flex", gap:10, alignItems:"center", padding:"16px 18px", borderBottom:"1px solid var(--border)", flexWrap:"wrap"}}>
        <select value={dept} onChange={e=>setDept(e.target.value)} style={{padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}>
          <option value="all">All departments</option>
          {departments.map(d=><option key={d} value={d}>{d}</option>)}
        </select>
        <select value={status} onChange={e=>setStatus(e.target.value)} style={{padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}>
          <option value="all">All statuses</option>
          <option value="present">Present</option>
          <option value="late">Late</option>
          <option value="absent">Absent</option>
        </select>
        <input type="date" value={selectedDate} onChange={e=>onDateChange(e.target.value)}
          style={{padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}/>
        <div style={{flex:1}}/>
        <Button variant="subtle" onClick={() => window.print()}><Icon name="download" size={15}/>Print / Export</Button>
      </div>
      <div style={{overflowX:"auto"}}>
        <table style={{width:"100%", borderCollapse:"collapse"}}>
          <thead><tr>
            <Th>Employee ID</Th><Th>Name</Th><Th>Department</Th><Th>Date</Th><Th>Check-in</Th><Th>Check-out</Th><Th>Hours</Th><Th>Status</Th>
          </tr></thead>
          <tbody>
            {rows.length === 0 ? (
              <tr><Td colSpan={8} style={{textAlign:"center", color:"var(--text-dim)"}}>No attendance records found for this filter.</Td></tr>
            ) : (
              rows.map((a,i)=>{
                const inTime = a.first_in ? new Date(a.first_in).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : "—";
                const outTime = a.last_out ? new Date(a.last_out).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : "—";
                let s = "absent";
                if (a.first_in) {
                  const t = new Date(a.first_in).toLocaleTimeString("en-GB", {hour:"2-digit", minute:"2-digit"});
                  s = t > "09:45" ? "late" : "present";
                }
                return (
                  <tr key={i}>
                    <Td mono>{a.employee_code}</Td>
                    <Td>{a.full_name}</Td>
                    <Td>{a.department}</Td>
                    <Td mono>{selectedDate}</Td>
                    <Td mono>{inTime}</Td>
                    <Td mono>{outTime}</Td>
                    <Td mono>{a.hours ? a.hours + "h" : "—"}</Td>
                    <Td><StatusBadge status={s}/></Td>
                  </tr>
                );
              })
            )}
          </tbody>
        </table>
      </div>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", padding:"12px 18px", fontSize:12.5, color:"var(--text-faint)"}}>
        <span>Showing {rows.length} of {attendance.length} records</span>
      </div>
    </Card>
  );
}

function AddEmployeeModal({isOpen, onClose, onSaved, departments=[], devices=[], token=""}){
  const [step, setStep] = useState(1); // 1: Details, 2: Device, 3: NFC Tap, 4: Fingerprint, 5: Sync
  const [code, setCode] = useState("");
  const [name, setName] = useState("");
  const [dept, setDept] = useState("Engineering");
  const [type, setType] = useState("EMPLOYEE");
  const [email, setEmail] = useState("");
  const [selectedDeviceId, setSelectedDeviceId] = useState("");
  
  const [jobId, setJobId] = useState(null);
  const [fingerprintId, setFingerprintId] = useState(null);
  const [cardUid, setCardUid] = useState("");
  const [fingerPass, setFingerPass] = useState(0); // 0: none, 1: first pass, 2: second pass
  const [syncProgress, setSyncProgress] = useState(0);
  const [syncDevices, setSyncDevices] = useState([]);
  const [syncSummary, setSyncSummary] = useState({ total: 1, completed: 0, all_synced: false });
  const [loading, setLoading] = useState(false);
  const [err, setErr] = useState("");

  const [isTimedOut, setIsTimedOut] = useState(false);
  const [timeoutReason, setTimeoutReason] = useState("");
  const [timeLeft, setTimeLeft] = useState(30);

  // Set default department and device when modal opens
  useEffect(() => {
    if (isOpen) {
      setStep(1);
      setCode("");
      setName("");
      setEmail("");
      setJobId(null);
      setFingerprintId(null);
      setCardUid("");
      setFingerPass(0);
      setSyncProgress(0);
      setSyncDevices([]);
      setSyncSummary({ total: 1, completed: 0, all_synced: false });
      setLoading(false);
      setErr("");
      setIsTimedOut(false);
      setTimeoutReason("");
      setTimeLeft(30);
      if (departments && departments.length > 0) {
        setDept(departments[0].name || departments[0] || "Engineering");
      }
      if (devices && devices.length > 0) {
        const onlineHrDev = devices.find(d => d.online === true && ((d.device_key || "").toUpperCase().includes("HR") || (d.device_label || "").toUpperCase().includes("HR")));
        const anyOnlineDev = onlineHrDev || devices.find(d => d.online === true);
        const fallbackDev = anyOnlineDev || devices[0];
        setSelectedDeviceId(fallbackDev.id);
      }
    }
  }, [isOpen, departments, devices]);

  // Selected device and online status
  const selectedDev = (devices || []).find(d => String(d.id) === String(selectedDeviceId)) || (devices && devices[0]);
  const isSelectedOnline = selectedDev ? (selectedDev.online === true) : false;

  // Polling for hardware updates during active enrollment job
  useEffect(() => {
    if (!isOpen || !jobId || step < 3 || step > 4 || isTimedOut) return;
    const interval = setInterval(async () => {
      try {
        const res = await apiCall(`/api/enrollment/status/${jobId}`, "GET", null, token);
        if (res && (res.job || res.status)) {
          const j = res.job || res;

          // Detect hardware failure, timeout, cancellation or reversion to standby
          if (
            j.status === "FAILED" ||
            j.status === "TIMEOUT" ||
            j.status === "CANCELLED" ||
            j.step === "FAILED" ||
            j.step === "TIMEOUT"
          ) {
            setIsTimedOut(true);
            setTimeoutReason(
              j.error_message ||
              "Hardware enrollment session timed out or terminal returned to standby access control state."
            );
            return;
          }

          if (j.card_uid && !cardUid) {
            setCardUid(j.card_uid);
          }
          if ((j.step === "CARD_TAPPED" || j.card_uid) && step === 3) {
            setCardUid(j.card_uid || cardUid);
            setTimeLeft(30);
            setTimeout(() => setStep(4), 900);
          } else if (j.step === "FINGER_1" && fingerPass < 1) {
            setFingerPass(1);
            setTimeLeft(30);
          } else if ((j.step === "FINGER_2" || j.step === "SYNCING" || j.step === "COMPLETED") && step === 4) {
            setFingerPass(2);
            setTimeout(() => setStep(5), 900);
          }
        }
      } catch(e) {}
    }, 900);
    return () => clearInterval(interval);
  }, [isOpen, jobId, step, cardUid, fingerPass, token, isTimedOut]);

  // Live hardware countdown timer (30s window per step)
  useEffect(() => {
    if (!isOpen || isTimedOut || loading || (step !== 3 && step !== 4)) return;
    const timer = setInterval(() => {
      setTimeLeft(prev => {
        if (prev <= 1) {
          setIsTimedOut(true);
          setTimeoutReason("Hardware enrollment timed out. Terminal returned to standby state.");
          if (jobId) {
            apiCall("/api/enrollment/step", "POST", { job_id: jobId, step: "TIMEOUT" }, token).catch(()=>{});
          }
          return 0;
        }
        return prev - 1;
      });
    }, 1000);
    return () => clearInterval(timer);
  }, [isOpen, isTimedOut, loading, step, jobId, token]);

  // Live DownChar multi-device sync in Step 5
  useEffect(() => {
    if (!isOpen || step !== 5 || !jobId) return;

    // Trigger generation of DownChar sync jobs for other devices
    apiCall(`/api/enrollment/${jobId}/sync-devices`, "POST", {}, token).catch(() => {});

    // Ensure credentials committed on server
    apiCall("/api/enrollment/step", "POST", { job_id: jobId, step: "COMPLETED", card_uid: cardUid }, token).catch(() => {});

    const pollSync = async () => {
      try {
        const res = await apiCall(`/api/enrollment/${jobId}/sync-devices`, "GET", null, token);
        if (res && res.devices) {
          setSyncDevices(res.devices);
          setSyncSummary({
            total: res.total_devices || 1,
            completed: res.completed_devices || 0,
            all_synced: res.all_synced || false,
          });
          const pct = res.all_synced
            ? 100
            : Math.min(95, Math.max(35, Math.round(((res.completed_devices || 1) / Math.max(res.total_devices || 1, 1)) * 100)));
          setSyncProgress(pct);
        }
      } catch (e) {}
    };

    pollSync();
    const interval = setInterval(pollSync, 1200);
    return () => clearInterval(interval);
  }, [isOpen, step, jobId, cardUid, token]);

  if (!isOpen) return null;

  // Step 1 -> Step 2
  const goToDeviceSelection = (e) => {
    e.preventDefault();
    if (!code.trim() || !name.trim()) {
      setErr("Employee Code and Full Name are required");
      return;
    }
    setErr("");
    setStep(2);
  };

  // Step 2 -> Step 3 (Starts job on backend)
  const startEnrollmentJob = async () => {
    if (!isSelectedOnline) {
      setErr(`Cannot proceed: Terminal '${selectedDev?.device_label || selectedDev?.device_key || "Reader"}' is offline. Please power on the HR terminal.`);
      return;
    }
    setLoading(true);
    setErr("");
    setIsTimedOut(false);
    setTimeoutReason("");
    setTimeLeft(30);
    try {
      const data = await apiCall(
        "/api/enrollment/start",
        "POST",
        {
          code: code.trim(),
          name: name.trim(),
          dept: dept.trim(),
          type,
          email: email.trim() || null,
          device_id: selectedDeviceId || (devices[0]?.id || 1),
        },
        token
      );
      setJobId(data.job_id);
      setFingerprintId(data.fingerprint_id);
      setStep(3);
    } catch(err) {
      setErr(err.message || "Failed to start enrollment job");
    } finally {
      setLoading(false);
    }
  };

  const handleCancelAndClose = () => {
    if (jobId && (step === 3 || step === 4) && !isTimedOut) {
      apiCall("/api/enrollment/cancel", "POST", { job_id: jobId }, token).catch(()=>{});
    }
    setIsTimedOut(false);
    onClose();
  };

  const handleRetryEnrollment = async () => {
    setIsTimedOut(false);
    setTimeoutReason("");
    setCardUid("");
    setFingerPass(0);
    setTimeLeft(30);
    await startEnrollmentJob();
  };

  const handleFinish = () => {
    if (onSaved) onSaved();
    onClose();
  };

  const stepLabels = [
    { num: 1, label: "Details" },
    { num: 2, label: "Device" },
    { num: 3, label: "NFC Tap" },
    { num: 4, label: "Fingerprint" },
    { num: 5, label: "Sync" },
  ];

  return (
    <div className="modal-backdrop">
      <div className="modal-box modal-box-large" style={{maxWidth:560}}>
        {/* Header with Title and Close */}
        <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:14}}>
          <div style={{display:"flex", alignItems:"center", gap:8}}>
            <div style={{width:28, height:28, borderRadius:7, background:"var(--primary-dim)", color:"var(--primary)", display:"flex", alignItems:"center", justifyContent:"center"}}>
              <Icon name={step === 3 ? "nfc" : (step === 4 ? "fingerprint" : (step === 5 ? "check-circle" : "users"))} size={16}/>
            </div>
            <div>
              <div style={{fontSize:16, fontWeight:700}}>Employee Registration & Onboarding</div>
              <div style={{fontSize:11.5, color:"var(--text-dim)"}}>Identity & Biometric Credential Provisioning</div>
            </div>
          </div>
          <button onClick={handleCancelAndClose} style={{background:"none", border:"none", cursor:"pointer", color:"var(--text-dim)"}}><Icon name="x" size={18}/></button>
        </div>

        {/* Multi-Step Stepper Progress Bar */}
        <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", margin:"16px 0 20px 0", position:"relative"}}>
          <div style={{position:"absolute", top:14, left:24, right:24, height:2, background:"var(--border)", zIndex:0}} />
          <div style={{position:"absolute", top:14, left:24, width:`${((step - 1) / 4) * 88}%`, height:2, background: isTimedOut ? "var(--rose)" : "var(--teal)", transition:"width .3s ease", zIndex:1}} />
          {stepLabels.map((s) => {
            const isDone = s.num < step;
            const isCurrent = s.num === step;
            return (
              <div key={s.num} style={{display:"flex", flexDirection:"column", alignItems:"center", gap:4, zIndex:2}}>
                <div style={{
                  width:28, height:28, borderRadius:99, display:"flex", alignItems:"center", justifyContent:"center",
                  fontSize:12, fontWeight:700,
                  background: isCurrent && isTimedOut ? "var(--rose)" : (isDone ? "var(--teal)" : (isCurrent ? "var(--primary)" : "var(--surface-2)")),
                  color: (isDone || isCurrent) ? "#fff" : "var(--text-dim)",
                  border: isCurrent ? (isTimedOut ? "2px solid var(--rose)" : "2px solid var(--primary)") : (isDone ? "none" : "1px solid var(--border)"),
                  boxShadow: isCurrent ? (isTimedOut ? "0 0 10px rgba(244,63,94,0.4)" : "0 0 10px rgba(76,111,255,0.4)") : "none",
                  transition:"all .2s ease"
                }}>
                  {isCurrent && isTimedOut ? <Icon name="x" size={13}/> : (isDone ? <Icon name="check" size={13}/> : s.num)}
                </div>
                <span style={{fontSize:11, fontWeight: isCurrent ? 600 : 500, color: isCurrent ? (isTimedOut ? "var(--rose)" : "var(--text)") : "var(--text-faint)"}}>
                  {s.label}
                </span>
              </div>
            );
          })}
        </div>

        {err && (
          <div style={{color:"var(--rose)", background:"var(--rose-bg)", border:"1px solid var(--rose)", padding:"8px 12px", borderRadius:8, fontSize:12.5, marginBottom:14}}>
            {err}
          </div>
        )}

        {/* STEP 1: Basic Details */}
        {step === 1 && (
          <form onSubmit={goToDeviceSelection} style={{display:"flex", flexDirection:"column", gap:12}}>
            <div>
              <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Employee Code <span style={{color:"var(--rose)"}}>*</span></label>
              <input required placeholder="EMP-0012" value={code} onChange={e=>setCode(e.target.value)}
                style={{width:"100%", padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}} />
            </div>
            <div>
              <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Full Name <span style={{color:"var(--rose)"}}>*</span></label>
              <input required placeholder="Arvind Kumar" value={name} onChange={e=>setName(e.target.value)}
                style={{width:"100%", padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}} />
            </div>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10}}>
              <div>
                <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Department</label>
                <select value={dept} onChange={e=>setDept(e.target.value)}
                  style={{width:"100%", padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}>
                  {(departments.length > 0 ? departments : ["Engineering", "HR", "Sales", "Operations"]).map((d, i) => {
                    const val = d.name || d;
                    return <option key={i} value={val}>{val}</option>;
                  })}
                </select>
              </div>
              <div>
                <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Person Type</label>
                <select value={type} onChange={e=>setType(e.target.value)}
                  style={{width:"100%", padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}}>
                  <option value="EMPLOYEE">Employee</option>
                  <option value="CONTRACTOR">Contractor</option>
                  <option value="VISITOR">Visitor</option>
                </select>
              </div>
            </div>
            <div>
              <label style={{fontSize:12, color:"var(--text-dim)", display:"block", marginBottom:4}}>Email (optional)</label>
              <input type="email" placeholder="arvind@company.com" value={email} onChange={e=>setEmail(e.target.value)}
                style={{width:"100%", padding:"9px 12px", borderRadius:8, border:"1px solid var(--border)", background:"var(--surface-2)", color:"var(--text)", fontSize:13.5}} />
            </div>

            <div style={{background:"var(--surface-2)", border:"1px dashed var(--border)", borderRadius:8, padding:"10px 14px", marginTop:4}}>
              <div style={{display:"flex", alignItems:"center", gap:8, fontSize:12, color:"var(--text-dim)"}}>
                <Icon name="nfc" size={16}/>
                <span>RFID UID & Fingerprint slot will be captured live from the HR terminal in the next steps.</span>
              </div>
            </div>

            <div style={{display:"flex", justifyContent:"flex-end", gap:8, marginTop:12}}>
              <Button variant="ghost" onClick={onClose}>Cancel</Button>
              <Button variant="primary" type="submit">
                Next <Icon name="arrow-right" size={14}/>
              </Button>
            </div>
          </form>
        )}

        {/* STEP 2: Device Selection & Connection */}
        {step === 2 && (
          <div style={{display:"flex", flexDirection:"column", gap:14}}>
            <div style={{fontSize:13, color:"var(--text-dim)"}}>
              Select the designated enrollment terminal (ESP32) for credential provisioning:
            </div>

            <div style={{display:"flex", flexDirection:"column", gap:8, maxHeight:220, overflowY:"auto"}}>
              {devices && devices.length > 0 ? (
                devices.map((d) => {
                  const isSelected = String(selectedDeviceId) === String(d.id);
                  const isOnline = d.online === true;
                  return (
                    <div
                      key={d.id}
                      onClick={() => { setSelectedDeviceId(d.id); setErr(""); }}
                      style={{
                        display:"flex", justifyContent:"space-between", alignItems:"center",
                        padding:"12px 16px", borderRadius:10, cursor:"pointer",
                        border: isSelected ? (isOnline ? "2px solid var(--primary)" : "2px solid var(--rose)") : "1px solid var(--border)",
                        background: isSelected ? (isOnline ? "var(--primary-dim)" : "var(--rose-bg)") : "var(--surface-2)",
                        opacity: isOnline ? 1 : 0.65,
                        transition:"all .15s ease"
                      }}
                    >
                      <div style={{display:"flex", alignItems:"center", gap:12}}>
                        <div style={{
                          width:36, height:36, borderRadius:8,
                          background: isSelected ? (isOnline ? "var(--primary)" : "var(--rose)") : "var(--surface)",
                          color: isSelected ? "#fff" : (isOnline ? "var(--primary)" : "var(--rose)"),
                          display:"flex", alignItems:"center", justifyContent:"center"
                        }}>
                          <Icon name="cpu" size={18}/>
                        </div>
                        <div>
                          <div style={{fontWeight:600, fontSize:13.5, color:"var(--text)"}}>{d.device_label || d.device_key}</div>
                          <div style={{fontSize:11.5, color:"var(--text-dim)"}}>
                            <span className="mono">{d.device_key}</span> • {d.room_name || "Access Point"}
                          </div>
                        </div>
                      </div>
                      <div style={{display:"flex", alignItems:"center", gap:8}}>
                        <span style={{
                          display:"inline-flex", alignItems:"center", gap:5, fontSize:11, fontWeight:600,
                          padding:"3px 8px", borderRadius:99,
                          background: isOnline ? "var(--teal-bg)" : "var(--rose-bg)",
                          color: isOnline ? "var(--teal)" : "var(--rose)"
                        }}>
                          <span style={{width:6, height:6, borderRadius:99, background: isOnline ? "var(--teal)" : "var(--rose)"}}/>
                          {isOnline ? "Online" : "Offline"}
                        </span>
                        {isSelected && <Icon name="check" size={16}/>}
                      </div>
                    </div>
                  );
                })
              ) : (
                <div style={{padding:"24px 16px", textAlign:"center", color:"var(--text-dim)", fontSize:13, background:"var(--surface-2)", borderRadius:10}}>
                  No hardware terminals detected. Please verify ESP32 network connection.
                </div>
              )}
            </div>

            {!isSelectedOnline && (
              <div style={{
                display:"flex", alignItems:"center", gap:8, fontSize:12.5,
                color:"var(--rose)", background:"var(--rose-bg)", border:"1px solid var(--rose)",
                padding:"9px 14px", borderRadius:8
              }}>
                <Icon name="x" size={15}/>
                <span>Device is offline. Please power on the enrollment terminal or verify its network connection to proceed.</span>
              </div>
            )}

            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginTop:10}}>
              <Button variant="ghost" onClick={() => { setErr(""); setStep(1); }}>
                <span style={{transform:"rotate(180deg)", display:"inline-flex"}}><Icon name="arrow-right" size={14}/></span> Back
              </Button>
              <Button variant="primary" onClick={startEnrollmentJob} disabled={loading || !isSelectedOnline}>
                {loading ? <><Icon name="loader" size={14}/> Connecting...</> : <>Connect & Start Enrollment <Icon name="arrow-right" size={14}/></>}
              </Button>
            </div>
          </div>
        )}

        {/* TIMED OUT / INVALID SESSION SCREEN */}
        {isTimedOut && (
          <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:16, padding:"8px 0", textAlign:"center"}}>
            <div style={{
              width:64, height:64, borderRadius:99,
              background:"var(--rose-bg)", color:"var(--rose)", border:"2px solid var(--rose)",
              display:"flex", alignItems:"center", justifyContent:"center"
            }}>
              <Icon name="alert-triangle" size={32}/>
            </div>

            <div>
              <div style={{
                display:"inline-block", background:"var(--rose-bg)", color:"var(--rose)",
                border:"1px solid var(--rose)", padding:"3px 12px", borderRadius:99,
                fontSize:11, fontWeight:700, letterSpacing:0.5, marginBottom:8
              }}>
                ENROLLMENT INVALID / NOT APPLICABLE
              </div>
              <div style={{fontSize:17, fontWeight:700, color:"var(--text)"}}>
                Hardware Enrollment Session Expired
              </div>
              <div style={{fontSize:12.5, color:"var(--text-dim)", marginTop:4, maxWidth:440, lineHeight:1.5}}>
                {timeoutReason || "The hardware reader timed out waiting for input and reverted to its default standby state. No biometric or NFC credentials were saved."}
              </div>
            </div>

            {/* Information card */}
            <div style={{
              width:"100%", background:"var(--surface-2)", border:"1px solid var(--border)",
              borderRadius:10, padding:"12px 16px", textAlign:"left", fontSize:12.5,
              display:"grid", gridTemplateColumns:"1fr 1fr", gap:10
            }}>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:11}}>EMPLOYEE</span>
                <span style={{fontWeight:600}}>{code} — {name}</span>
              </div>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:11}}>DEPARTMENT</span>
                <span style={{fontWeight:600}}>{dept}</span>
              </div>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:11}}>HARDWARE STATUS</span>
                <span style={{fontWeight:600, color:"var(--rose)"}}>Standby (Normal Access Mode)</span>
              </div>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:11}}>TERMINAL</span>
                <span style={{fontWeight:600}}>{selectedDev?.device_label || selectedDev?.device_key || "Reader"}</span>
              </div>
            </div>

            {/* Action buttons */}
            <div style={{display:"flex", gap:10, width:"100%", marginTop:8}}>
              <Button variant="ghost" onClick={handleCancelAndClose} style={{flex:1, justifyContent:"center"}}>
                <Icon name="x" size={14}/> Cancel & Close
              </Button>
              <Button variant="secondary" onClick={() => { setIsTimedOut(false); setStep(2); }} style={{flex:1, justifyContent:"center"}}>
                Change Device
              </Button>
              <Button variant="primary" onClick={handleRetryEnrollment} disabled={loading} style={{flex:1.2, justifyContent:"center"}}>
                {loading ? <><Icon name="loader" size={14}/> Starting...</> : <><Icon name="refresh" size={14}/> Retry Enrollment</>}
              </Button>
            </div>
          </div>
        )}

        {/* STEP 3: NFC Card Tap */}
        {step === 3 && !isTimedOut && (
          <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:16, padding:"8px 0"}}>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:16, fontWeight:700}}>Tap Employee NFC Card</div>
              <div style={{fontSize:12.5, color:"var(--text-dim)", marginTop:2}}>
                Place the NFC smart card on the HR device reader
              </div>
            </div>

            {/* Glowing NFC Card Visual */}
            <div
              className={cardUid ? "nfc-card-success" : "nfc-card-glow"}
              style={{
                width:260, height:160, borderRadius:16,
                background: cardUid
                  ? "linear-gradient(135deg, #0e2e2a 0%, #0f4f46 100%)"
                  : "linear-gradient(135deg, #1e293b 0%, #0f172a 100%)",
                border: cardUid ? "2px solid var(--teal)" : "2px solid var(--primary)",
                padding:18, display:"flex", flexDirection:"column", justifyContent:"space-between",
                position:"relative", overflow:"hidden", transition:"all .4s ease"
              }}
            >
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
                <div style={{width:32, height:24, borderRadius:4, background:"#d97706", opacity:0.8}} />
                <Icon name="nfc" size={26}/>
              </div>

              <div style={{textAlign:"center", margin:"10px 0"}}>
                {cardUid ? (
                  <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:4}}>
                    <div style={{color:"var(--teal)", display:"flex", alignItems:"center", gap:6, fontWeight:700, fontSize:13}}>
                      <Icon name="check-circle" size={16}/> CARD CAPTURED
                    </div>
                    <div className="mono" style={{fontSize:18, fontWeight:700, color:"#fff", letterSpacing:1}}>
                      {cardUid}
                    </div>
                  </div>
                ) : (
                  <div style={{fontSize:13, fontWeight:600, color:"var(--text-dim)", letterSpacing:0.5}}>
                    READY TO SCAN
                  </div>
                )}
              </div>

              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", fontSize:11, color:"var(--text-faint)"}}>
                <span>{name || "EMPLOYEE"}</span>
                <span className="mono">{code || "EMP-001"}</span>
              </div>
            </div>

            {/* Status indicator */}
            <div style={{
              display:"inline-flex", alignItems:"center", gap:8, fontSize:12.5, fontWeight:600,
              padding:"6px 14px", borderRadius:99,
              background: cardUid ? "var(--teal-bg)" : "var(--primary-dim)",
              color: cardUid ? "var(--teal)" : "var(--primary)"
            }}>
              {cardUid ? (
                <><Icon name="check" size={14}/> NFC Card Registered: <span className="mono">{cardUid}</span></>
              ) : (
                <><span className="spin-slow" style={{display:"inline-flex"}}><Icon name="loader" size={14}/></span> Waiting for NFC Card Tap on terminal...</>
              )}
            </div>

            {/* Countdown indicator */}
            {!cardUid && (
              <div style={{
                display:"flex", alignItems:"center", gap:6, fontSize:11.5,
                color: timeLeft <= 10 ? "var(--rose)" : "var(--text-dim)",
                background: timeLeft <= 10 ? "var(--rose-bg)" : "var(--surface-2)",
                padding:"4px 12px", borderRadius:99,
                border: `1px solid ${timeLeft <= 10 ? "var(--rose)" : "var(--border)"}`,
                transition:"all .2s ease"
              }}>
                <Icon name="clock" size={13}/>
                <span>Hardware Window: <strong>{timeLeft}s</strong> remaining before reader reverts to standby</span>
              </div>
            )}

            {cardUid ? (
              <div style={{display:"flex", justifyContent:"center", marginTop:6}}>
                <Button variant="primary" onClick={() => setStep(4)} style={{padding:"8px 16px", fontSize:13}}>
                  Continue to Fingerprint <Icon name="arrow-right" size={13}/>
                </Button>
              </div>
            ) : (
              <button
                onClick={handleCancelAndClose}
                style={{
                  background:"none", border:"none", cursor:"pointer",
                  fontSize:11.5, color:"var(--text-dim)", textDecoration:"underline", marginTop:2
                }}
              >
                Cancel Enrollment Session
              </button>
            )}
          </div>
        )}

        {/* STEP 4: Fingerprint Enrollment */}
        {step === 4 && !isTimedOut && (
          <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:16, padding:"8px 0"}}>
            <div style={{textAlign:"center"}}>
              <div style={{fontSize:16, fontWeight:700}}>Biometric Fingerprint Enrollment</div>
              <div style={{fontSize:12.5, color:"var(--text-dim)", marginTop:2}}>
                Place same finger on the optical sensor (2 verification passes)
              </div>
            </div>

            {/* Biometric Scanner Visual */}
            <div style={{
              width:180, height:180, borderRadius:24,
              background:"var(--surface-2)", border:"2px solid var(--border)",
              display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
              position:"relative", overflow:"hidden", boxShadow:"inset 0 0 20px rgba(0,0,0,0.4)"
            }}>
              <div style={{color: fingerPass === 2 ? "var(--teal)" : "var(--primary)", transition:"color .3s ease"}}>
                <Icon name="fingerprint" size={84}/>
              </div>
              {fingerPass < 2 && <div className="scanner-beam" />}
              <div style={{
                position:"absolute", bottom:8, fontSize:10.5, fontWeight:600,
                background:"rgba(0,0,0,0.5)", padding:"2px 8px", borderRadius:4, color:"var(--text-dim)"
              }}>
                Slot #{fingerprintId || 1}
              </div>
            </div>

            {/* Pass 1 & Pass 2 Checklist */}
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:10, width:"100%"}}>
              <div style={{
                background: fingerPass >= 1 ? "var(--teal-bg)" : "var(--surface-2)",
                border: fingerPass >= 1 ? "1px solid var(--teal)" : "1px solid var(--border)",
                padding:"10px 14px", borderRadius:10, display:"flex", alignItems:"center", gap:10
              }}>
                <div style={{
                  width:24, height:24, borderRadius:99,
                  background: fingerPass >= 1 ? "var(--teal)" : "var(--border)",
                  color: fingerPass >= 1 ? "#fff" : "var(--text-dim)",
                  display:"flex", alignItems:"center", justifyContent:"center"
                }}>
                  {fingerPass >= 1 ? <Icon name="check" size={13}/> : "1"}
                </div>
                <div>
                  <div style={{fontSize:12, fontWeight:600, color: fingerPass >= 1 ? "var(--teal)" : "var(--text)"}}>Pass 1: Capture</div>
                  <div style={{fontSize:10.5, color:"var(--text-dim)"}}>
                    {fingerPass >= 1 ? "First image OK" : "Place finger"}
                  </div>
                </div>
              </div>

              <div style={{
                background: fingerPass >= 2 ? "var(--teal-bg)" : "var(--surface-2)",
                border: fingerPass >= 2 ? "1px solid var(--teal)" : "1px solid var(--border)",
                padding:"10px 14px", borderRadius:10, display:"flex", alignItems:"center", gap:10
              }}>
                <div style={{
                  width:24, height:24, borderRadius:99,
                  background: fingerPass >= 2 ? "var(--teal)" : "var(--border)",
                  color: fingerPass >= 2 ? "#fff" : "var(--text-dim)",
                  display:"flex", alignItems:"center", justifyContent:"center"
                }}>
                  {fingerPass >= 2 ? <Icon name="check" size={13}/> : "2"}
                </div>
                <div>
                  <div style={{fontSize:12, fontWeight:600, color: fingerPass >= 2 ? "var(--teal)" : "var(--text)"}}>Pass 2: Match & Store</div>
                  <div style={{fontSize:10.5, color:"var(--text-dim)"}}>
                    {fingerPass >= 2 ? "Template created" : "Place same finger"}
                  </div>
                </div>
              </div>
            </div>

            {/* Countdown indicator */}
            {fingerPass < 2 && (
              <div style={{
                display:"flex", alignItems:"center", gap:6, fontSize:11.5,
                color: timeLeft <= 10 ? "var(--rose)" : "var(--text-dim)",
                background: timeLeft <= 10 ? "var(--rose-bg)" : "var(--surface-2)",
                padding:"4px 12px", borderRadius:99,
                border: `1px solid ${timeLeft <= 10 ? "var(--rose)" : "var(--border)"}`,
                transition:"all .2s ease"
              }}>
                <Icon name="clock" size={13}/>
                <span>Hardware Window: <strong>{timeLeft}s</strong> remaining before sensor reverts to standby</span>
              </div>
            )}

            {fingerPass >= 2 ? (
              <div style={{display:"flex", justifyContent:"center", marginTop:6}}>
                <Button variant="primary" onClick={() => setStep(5)} style={{padding:"8px 16px", fontSize:13}}>
                  Continue to Device Sync <Icon name="arrow-right" size={13}/>
                </Button>
              </div>
            ) : (
              <button
                onClick={handleCancelAndClose}
                style={{
                  background:"none", border:"none", cursor:"pointer",
                  fontSize:11.5, color:"var(--text-dim)", textDecoration:"underline", marginTop:2
                }}
              >
                Cancel Enrollment Session
              </button>
            )}
          </div>
        )}

        {/* STEP 5: Synchronization & Completed */}
        {step === 5 && (
          <div style={{display:"flex", flexDirection:"column", alignItems:"center", gap:14, padding:"8px 0"}}>
            {/* Animated Celebration / Sync Icon */}
            <div style={{
              width:58, height:58, borderRadius:99,
              background: syncSummary.all_synced ? "var(--teal-bg)" : "var(--primary-dim)",
              color: syncSummary.all_synced ? "var(--teal)" : "var(--primary)",
              border: `2px solid ${syncSummary.all_synced ? "var(--teal)" : "var(--primary)"}`,
              display:"flex", alignItems:"center", justifyContent:"center",
              boxShadow: syncSummary.all_synced ? "0 0 20px rgba(45,212,191,0.4)" : "none",
              transition:"all .4s ease"
            }}>
              {syncSummary.all_synced ? <Icon name="check" size={28}/> : <Icon name="loader" size={26}/>}
            </div>

            <div style={{textAlign:"center"}}>
              <div style={{fontSize:16.5, fontWeight:700}}>
                {syncSummary.all_synced ? "Hardware Biometric Synchronization Done!" : "Synchronizing Multi-Terminal Biometrics..."}
              </div>
              <div style={{fontSize:12, color:"var(--text-dim)", marginTop:2}}>
                {syncSummary.all_synced
                  ? "Biometric template and access credentials active across all access points."
                  : "Provisioning DownChar biometrics to all connected access terminals in facility..."}
              </div>
            </div>

            {/* Sync Progress Bar */}
            <div style={{width:"100%", background:"var(--surface-2)", height:7, borderRadius:99, overflow:"hidden"}}>
              <div style={{
                height:"100%", width:`${syncProgress}%`,
                background:"linear-gradient(90deg, var(--primary), var(--teal))",
                transition:"width .4s ease"
              }} />
            </div>

            {/* DownChar Terminal Provisioning Checklist */}
            <div style={{
              width:"100%", background:"var(--surface-2)", border:"1px solid var(--border)",
              borderRadius:10, padding:"12px 14px"
            }}>
              <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8}}>
                <div style={{display:"flex", alignItems:"center", gap:6, fontSize:12, fontWeight:700, color:"var(--text)"}}>
                  <Icon name="cpu" size={14}/>
                  <span>Hardware DownChar Sync Distribution</span>
                </div>
                <span style={{
                  fontSize:11, fontWeight:600,
                  color: syncSummary.all_synced ? "var(--teal)" : "var(--primary)",
                  background: syncSummary.all_synced ? "var(--teal-bg)" : "var(--primary-dim)",
                  padding:"2px 8px", borderRadius:99
                }}>
                  {syncSummary.completed} of {syncSummary.total} Terminals Provisioned
                </span>
              </div>

              <div style={{display:"flex", flexDirection:"column", gap:6, maxHeight:150, overflowY:"auto"}}>
                {syncDevices && syncDevices.length > 0 ? (
                  syncDevices.map((d) => {
                    const isDone = d.sync_status === "COMPLETED";
                    const isRunning = d.sync_status === "RUNNING";
                    const isFailed = d.sync_status === "FAILED";
                    return (
                      <div
                        key={d.device_id}
                        style={{
                          display:"flex", justifyContent:"space-between", alignItems:"center",
                          padding:"8px 10px", borderRadius:6, background:"var(--surface)", border:"1px solid var(--border)",
                          fontSize:12
                        }}
                      >
                        <div style={{display:"flex", alignItems:"center", gap:8}}>
                          <span style={{
                            width:7, height:7, borderRadius:99,
                            background: isDone ? "var(--teal)" : (isRunning ? "var(--primary)" : (isFailed ? "var(--rose)" : (d.is_online ? "var(--amber)" : "var(--text-dim)")))
                          }}/>
                          <div>
                            <span style={{fontWeight:600}}>{d.device_label || d.device_key}</span>
                            <span style={{color:"var(--text-dim)", fontSize:11, marginLeft:6}} className="mono">({d.device_key})</span>
                            {d.is_master && (
                              <span style={{marginLeft:6, fontSize:10, padding:"1px 6px", borderRadius:4, background:"var(--primary-dim)", color:"var(--primary)", fontWeight:600}}>
                                Source
                              </span>
                            )}
                          </div>
                        </div>
                        <div style={{display:"flex", alignItems:"center", gap:6}}>
                          <span style={{
                            fontSize:11, fontWeight:600,
                            color: isDone ? "var(--teal)" : (isRunning ? "var(--primary)" : (isFailed ? "var(--rose)" : "var(--text-dim)"))
                          }}>
                            {d.status_text}
                          </span>
                          {isDone && <Icon name="check" size={13} style={{color:"var(--teal)"}}/>}
                          {isRunning && <span className="spin-slow" style={{display:"inline-flex"}}><Icon name="loader" size={13} style={{color:"var(--primary)"}}/></span>}
                        </div>
                      </div>
                    );
                  })
                ) : (
                  <div style={{padding:"8px", textAlign:"center", fontSize:11.5, color:"var(--text-dim)"}}>
                    Preparing DownChar distribution queue...
                  </div>
                )}
              </div>
            </div>

            {/* Recap Card */}
            <div style={{
              width:"100%", background:"var(--surface-2)", border:"1px solid var(--border)",
              borderRadius:10, padding:"12px 16px", display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, fontSize:12
            }}>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:10.5}}>EMPLOYEE</span>
                <span style={{fontWeight:600}}>{code} — {name}</span>
              </div>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:10.5}}>DEPARTMENT</span>
                <span style={{fontWeight:600}}>{dept}</span>
              </div>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:10.5}}>NFC CARD UID</span>
                <span className="mono" style={{fontWeight:600, color:"var(--teal)"}}>{cardUid || "Assigned"}</span>
              </div>
              <div>
                <span style={{color:"var(--text-dim)", display:"block", fontSize:10.5}}>FINGERPRINT SLOT</span>
                <span className="mono" style={{fontWeight:600, color:"var(--primary)"}}>Slot #{fingerprintId || 1}</span>
              </div>
            </div>

            <div style={{width:"100%", display:"flex", justifyContent:"flex-end", marginTop:4}}>
              <Button
                variant="primary"
                onClick={handleFinish}
                style={{width:"100%", justifyContent:"center", padding:"9px 18px", fontSize:13.5}}
                disabled={syncProgress < 30}
              >
                <Icon name="check" size={15}/> Done & Close
              </Button>
            </div>
          </div>
        )}
      </div>
    </div>
  );
}
